<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020812">
  <meta name="color-scheme" content="dark">
  <title>Tenis AI — Early Hold</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="neon.css">
</head>
<body>
  <header class="app-header neon-header">
    <div class="brand neon-brand">
      <img class="brand-symbol" src="brand-symbol.png" alt="">
      <div class="brand-copy">
        <img class="brand-wordmark" src="brand-wordmark.png" alt="Tenis AI">
        <p>Early Hold v6.1 · Adaptive + Community</p>
      </div>
    </div>
    <button id="refresh" class="icon-btn neon-refresh" title="Odśwież" aria-label="Odśwież">↻</button>
  </header>

  <section class="status neon-status">
    <span id="updated">Ładowanie…</span>
    <span id="mode"></span>
    <span id="history-mode"></span>
    <span id="matched">Dopasowane: —</span>
  </section>

  <div class="main-tabs neon-tabs" role="tablist">
    <button class="active" data-view="matches">🎾 <span>Mecze</span></button>
    <button data-view="stats">📊 <span>Statystyki</span></button>
    <button data-view="history">🕘 <span>Historia</span></button>
    <button data-view="feedback">💡 <span>Pomysły</span></button>
    <button data-view="coupons">🧾 <span>Kupony</span></button>
  </div>

  <div id="match-controls">
    <nav id="tour-nav" class="neon-tour-nav">
      <button class="active" data-filter="all">Wszystkie <small class="count">0</small></button>
      <button data-filter="atp">ATP <small class="count">0</small></button>
      <button data-filter="wta">WTA <small class="count">0</small></button>
      <button data-filter="challenger">CH <small class="count">0</small></button>
      <button data-filter="itf">ITF <small class="count">0</small></button>
    </nav>
    <div class="collapse-bar">
      <button id="collapse-all">Zwiń wszystkie</button>
      <button id="expand-all">Rozwiń wszystkie</button>
    </div>
  </div>

  <main id="app"></main>

  <footer>
    <div class="footer-brand">Tenis AI · stworzone przez <b>Abeel87 × ChatGPT</b></div>
    <div>Zielone = wynik modelu ≥72/100. Historia zapisuje zielone sygnały przed meczem i rozlicza je po wyniku. Wyniki 0–100 są estymacją modelu, nie gwarancją ani kursem bukmacherskim.</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
