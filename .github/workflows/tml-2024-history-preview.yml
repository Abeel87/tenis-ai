name: TML 2024 history preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/tml_2024_history_preview.py'
      - 'backend/insufficient_history_evidence.py'
      - 'backend/history_coverage_audit.py'
      - 'backend/history_hygiene_v78a.py'
      - 'backend/model.py'
      - 'backend/model_core.py'
      - 'frontend/data/results.json'
      - 'tests/test_tml_2024_history_preview.py'
      - '.github/workflows/tml-2024-history-preview.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: backend:.

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: python -m pip install pytest pandas requests

      - name: Unit tests
        run: python -m pytest -q tests/test_tml_2024_history_preview.py

      - name: Restore latest tennis cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tml-2024-preview-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Require restored production cache snapshot
        shell: bash
        env:
          MATCHED_CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$MATCHED_CACHE_KEY" || { echo 'No tennis-history Actions cache restored'; exit 21; }
          count=$(find data/cache -maxdepth 1 -type f -name '*.csv.gz' | wc -l)
          echo "restored root CSV cache files: ${count}"
          test "$count" -ge 11 || { echo 'Expected all declared current TennisMyLife cache files'; exit 22; }
          test -s frontend/data/results.json || { echo 'Missing current results.json'; exit 23; }

      - name: Preview 2024 TennisMyLife history
        env:
          LIVE_TENNIS_API_KEY: ''
        run: python backend/tml_2024_history_preview.py

      - name: Validate preview-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/tml_2024_history_preview.json').read_text(encoding='utf-8'))
          policy = report['policy']
          summary = report['summary']
          decision = report['decision']
          assert policy['live_tennis_api_calls'] == 0
          assert policy['tennismylife_requests'] == 4
          assert policy['tennismylife_2024_only'] is True
          assert policy['production_cache_writes'] == 0
          assert policy['temporary_or_memory_only'] is True
          assert policy['fuzzy_matching'] is False
          assert policy['manual_aliases'] is False
          assert policy['provider_id_matching'] is False
          assert policy['cross_provider_id_comparison'] is False
          assert policy['uses_existing_baseline_history_key_only'] is True
          assert policy['minimum_match_gate'] == 5
          assert policy['minimum_match_gate_changed'] is False
          assert policy['identity_resolver_changed'] is False
          assert policy['history_hygiene_changed'] is False
          assert policy['model_math_changed'] is False
          assert policy['runtime_change_authorized'] is False
          assert policy['archive_data_authorized_for_runtime'] is False
          assert decision['runtime_change'] is False
          assert decision['authorize_2024_archive'] is False
          assert summary['visible_matches'] > 0
          assert summary['baseline_raw_rows'] > 0
          assert summary['short_history_slots'] > 0
          assert summary['all_2024_sources_fetched'] is True
          assert len(report['sources']) == 4
          print(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(report['category_counts'], indent=2, sort_keys=True))
          PY

      - name: Upload TASK 014 report
        uses: actions/upload-artifact@v4
        with:
          name: tml-2024-history-preview
          path: artifacts/tml_2024_history_preview.json
          if-no-files-found: error
