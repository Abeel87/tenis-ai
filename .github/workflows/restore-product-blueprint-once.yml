name: Restore agreed Tenis AI product blueprint

on:
  push:
    branches:
      - ui/restore-agreed-product-blueprint

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/restore-agreed-product-blueprint
          fetch-depth: 0

      - name: Apply agreed product structure
        run: python scripts/restore_product_blueprint_once.py

      - name: Install focused test dependency
        run: python -m pip install -q pytest

      - name: Validate product UI
        run: |
          python -m pytest -q tests/test_clean_product_ui.py
          node tests/ui_static_smoke.mjs
          node --check frontend/app.js
          node --check frontend/project-ui.js
          node --check frontend/playable-ui.js
          node --check frontend/player-dna-shadow.js
          node --check frontend/player-intelligence-ui.js

      - name: Commit canonical blueprint
        shell: bash
        run: |
          git config user.name "tenis-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/restore-product-blueprint-once.yml scripts/restore_product_blueprint_once.py
          git add frontend/index.html frontend/app.js frontend/project-ui.js frontend/style.css frontend/playable-ui.js frontend/player-dna-shadow.js frontend/player-intelligence-ui.js tests/test_clean_product_ui.py
          git commit -m "Restore agreed role-aware Tenis AI product blueprint"
          git push origin HEAD:ui/restore-agreed-product-blueprint
