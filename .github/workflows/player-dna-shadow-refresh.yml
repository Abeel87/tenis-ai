name: Player DNA SHADOW refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/canonical_point_event.py'
      - 'backend/player_dna_point_dataset.py'
      - 'backend/player_dna_match_context.py'
      - 'backend/player_dna_shadow_profiles.py'
      - 'backend/player_dna_profile_readiness.py'
      - 'backend/player_dna_point_scorer.py'
      - 'backend/player_dna_current_shadow.py'
      - 'backend/player_dna_tennis_simulator.py'
      - 'backend/player_dna_market_backtest.py'
      - 'backend/player_dna_market_walk_forward.py'
      - 'backend/player_dna_hold_calibration.py'
      - 'backend/player_dna_hold_walk_forward.py'
      - 'backend/player_dna_prospective_validation.py'
      - 'backend/player_identity.py'
      - '.github/workflows/player-dna-shadow-refresh.yml'
  workflow_run:
    workflows: ["Update tennis data and deploy Pages"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - 'backend/canonical_point_event.py'
      - 'backend/player_dna_point_dataset.py'
      - 'backend/player_dna_match_context.py'
      - 'backend/player_dna_shadow_profiles.py'
      - 'backend/player_dna_profile_readiness.py'
      - 'backend/player_dna_point_scorer.py'
      - 'backend/player_dna_current_shadow.py'
      - 'backend/player_dna_tennis_simulator.py'
      - 'backend/player_dna_market_backtest.py'
      - 'backend/player_dna_market_walk_forward.py'
      - 'backend/player_dna_hold_calibration.py'
      - 'backend/player_dna_hold_walk_forward.py'
      - 'backend/player_dna_prospective_validation.py'
      - 'backend/player_identity.py'
      - 'tests/test_canonical_point_event.py'
      - 'tests/test_player_dna_point_dataset.py'
      - 'tests/test_player_dna_match_context.py'
      - 'tests/test_player_dna_shadow_profiles.py'
      - 'tests/test_player_dna_profile_readiness.py'
      - 'tests/test_player_dna_point_scorer.py'
      - 'tests/test_player_dna_current_shadow.py'
      - 'tests/test_player_dna_tennis_simulator.py'
      - 'tests/test_player_dna_market_backtest.py'
      - 'tests/test_player_dna_market_walk_forward.py'
      - 'tests/test_player_dna_hold_calibration.py'
      - 'tests/test_player_dna_hold_walk_forward.py'
      - 'tests/test_player_dna_prospective_validation.py'
      - 'tests/test_player_identity.py'
      - '.github/workflows/player-dna-shadow-refresh.yml'

permissions:
  contents: write
  actions: write

concurrency:
  # Keep main refreshes mutually exclusive, but never let a main/data refresh
  # cancel the validation run of an open PR.
  group: player-dna-shadow-refresh-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Restore tennis history + PBP cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tennis-history-${{ runner.os }}-player-dna-shadow-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Player DNA canonical guards
        run: |
          python -m py_compile backend/canonical_point_event.py
          python -m py_compile backend/player_dna_point_dataset.py
          python -m py_compile backend/player_dna_match_context.py
          python -m py_compile backend/player_dna_shadow_profiles.py
          python -m py_compile backend/player_dna_profile_readiness.py
          python -m py_compile backend/player_dna_point_scorer.py
          python -m py_compile backend/player_dna_current_shadow.py
          python -m py_compile backend/player_dna_tennis_simulator.py
          python -m py_compile backend/player_dna_market_backtest.py
          python -m py_compile backend/player_dna_market_walk_forward.py
          python -m py_compile backend/player_dna_hold_calibration.py
          python -m py_compile backend/player_dna_hold_walk_forward.py
          python -m py_compile backend/player_dna_prospective_validation.py
          python -m pytest -q             tests/test_canonical_point_event.py             tests/test_player_dna_point_dataset.py             tests/test_player_dna_match_context.py             tests/test_player_dna_shadow_profiles.py             tests/test_player_dna_profile_readiness.py             tests/test_player_dna_point_scorer.py             tests/test_player_dna_current_shadow.py             tests/test_player_dna_tennis_simulator.py             tests/test_player_dna_market_backtest.py             tests/test_player_dna_market_walk_forward.py             tests/test_player_dna_hold_calibration.py             tests/test_player_dna_hold_walk_forward.py             tests/test_player_dna_prospective_validation.py             tests/test_player_identity.py

      - name: Build strict Player DNA point dataset
        run: python backend/player_dna_point_dataset.py

      - name: Audit Player DNA profile readiness
        run: python backend/player_dna_profile_readiness.py

      - name: Build leakage-safe Player DNA profiles
        run: python backend/player_dna_shadow_profiles.py

      - name: Train + evaluate Player DNA scorer
        run: python backend/player_dna_point_scorer.py

      - name: Score current card in SHADOW
        run: python backend/player_dna_current_shadow.py

      - name: Backtest simulated markets on historical holdout
        run: python backend/player_dna_market_backtest.py

      - name: Validate dynamic lean market walk-forward robustness
        run: python backend/player_dna_market_walk_forward.py

      - name: Audit hold calibration on untouched third partition
        run: python backend/player_dna_hold_calibration.py

      - name: Audit hold calibration walk-forward robustness
        run: python backend/player_dna_hold_walk_forward.py

      - name: Simulate raw + hold-calibrated tennis markets in SHADOW
        run: python backend/player_dna_tennis_simulator.py

      - name: Collect prospective calibrated-candidate evidence
        run: python backend/player_dna_prospective_validation.py

      - name: Hard isolation + learning guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = Path('frontend/data')
          derived = Path('data/derived/player_dna')

          dataset = json.loads((data / 'player_dna_point_dataset_summary.json').read_text(encoding='utf-8'))
          assert dataset.get('shadow_only') is True
          assert dataset.get('training_join_enabled') is False
          assert dataset.get('profile_aggregation_enabled') is False
          matches = int(dataset.get('matches') or 0)
          context_matches = int(dataset.get('context_matches') or 0)
          strict_points = int(dataset.get('context_ready_player_point') or 0)
          assert matches > 0 and context_matches == matches and strict_points > 0

          readiness = json.loads((data / 'player_dna_profile_readiness.json').read_text(encoding='utf-8'))
          assert readiness.get('gate') == 'AUDIT_ONLY_NO_PROFILE_AGGREGATION'
          assert readiness.get('training_join_enabled') is False
          assert readiness.get('profile_aggregation_enabled') is False
          assert readiness.get('readiness_threshold_activation_enabled') is False
          assert int(readiness.get('source_matches_seen') or 0) == matches

          profiles = json.loads((data / 'player_dna_shadow_profile_summary.json').read_text(encoding='utf-8'))
          assert profiles.get('mode') == 'SHADOW_AS_OF_PROFILE'
          assert profiles.get('production_influence') is False
          assert profiles.get('training_join_enabled') is False
          assert profiles.get('profile_threshold_activation_enabled') is False
          assert profiles.get('same_time_matches_count_as_prior') is False
          assert int(profiles.get('player_match_snapshots') or 0) > 0

          scorer = json.loads((data / 'player_dna_point_scorer.json').read_text(encoding='utf-8'))
          assert scorer.get('mode') == 'SHADOW_EVAL_ONLY'
          assert scorer.get('production_influence') is False
          assert scorer.get('runtime_scoring_enabled') is False
          assert scorer.get('prod_model_write_enabled') is False
          assert scorer.get('real_shadow_training') is True
          assert (scorer.get('split') or {}).get('same_timestamp_split') is False
          assert float(scorer.get('join_coverage') or 0) == 1.0
          scorer_signal = scorer.get('signal') or {}
          assert scorer_signal.get('status') in {
              'POSITIVE_HOLDOUT_SIGNAL',
              'MIXED_OR_NO_INCREMENTAL_SIGNAL',
              'STATEFUL_CONTEXT_POSITIVE_HOLDOUT_SIGNAL',
              'STATEFUL_CONTEXT_MIXED_OR_NO_INCREMENTAL_SIGNAL',
          }
          if scorer_signal.get('status', '').startswith('STATEFUL_CONTEXT_'):
              assert scorer_signal.get('promotion_gate') is False
              stateful_contract = scorer.get('stateful_context_contract') or {}
              assert stateful_contract.get('features_use_score_before_only') is True
              assert stateful_contract.get('score_after_used_as_feature') is False
              assert stateful_contract.get('current_point_winner_used_as_feature') is False
              assert stateful_contract.get('runtime_scoring_enabled') is False
              assert stateful_contract.get('production_influence') is False
              assert stateful_contract.get('symphony2_influence') is False
              assert stateful_contract.get('superbet_playable_influence') is False
              stateful_models = scorer.get('models') or {}
              assert (stateful_models.get('score_state_only_logistic') or {}).get('model', {}).get('converged') is True
              assert (stateful_models.get('profile_rank_plus_score_state_logistic') or {}).get('model', {}).get('converged') is True
              assert (stateful_models.get('profile_rank_plus_lean_score_state_logistic') or {}).get('model', {}).get('converged') is True
              assert stateful_contract.get('lean_state_groups') == ['point_pressure', 'set_match_state']
              assert stateful_contract.get('lean_dropped_state_groups') == ['tiebreak_context', 'prior_momentum']
              lean_comparison = scorer.get('lean_stateful_comparison') or {}
              assert lean_comparison.get('mode') == 'SHADOW_MODEL_SELECTION_DIAGNOSTIC_ONLY'
              assert lean_comparison.get('runtime_scoring_enabled') is False
              assert lean_comparison.get('production_influence') is False
              assert lean_comparison.get('promotion_gate') is False
              stateful_walk_forward = scorer.get('stateful_walk_forward') or {}
              assert stateful_walk_forward.get('lean_signal') in {
                  'LEAN_STATEFUL_WALK_FORWARD_ROBUST_SHADOW',
                  'LEAN_STATEFUL_WALK_FORWARD_NOT_YET_ROBUST',
              }
              assert stateful_walk_forward.get('lean_vs_full_signal') in {
                  'LEAN_STATEFUL_SUPERIOR_TO_FULL_WALK_FORWARD_SHADOW',
                  'LEAN_STATEFUL_NOT_SUPERIOR_TO_FULL_ON_ALL_FOLDS',
              }

          current = json.loads((data / 'player_dna_current_shadow.json').read_text(encoding='utf-8'))
          assert current.get('mode') == 'SHADOW_CURRENT_ONLY'
          assert current.get('production_influence') is False
          assert current.get('symphony2_influence') is False
          assert current.get('superbet_playable_influence') is False
          assert current.get('match_winner_probability_enabled') is False
          assert current.get('point_serve_probability_only') is True
          assert current.get('rank_features_used') is False
          assert current.get('provider_rank_context_passthrough') is True
          assert current.get('rank_context_source') == 'fixture.players.p1/p2.ranking'
          current_matches = int(current.get('current_matches') or 0)
          rank_context_matches = int(current.get('rank_context_matches') or 0)
          assert 0 <= rank_context_matches <= current_matches
          rank_context_coverage = float(current.get('rank_context_coverage') or 0.0)
          assert 0.0 <= rank_context_coverage <= 1.0
          assert current_matches > 0
          assert int(current.get('stable_id_matches') or 0) == current_matches
          assert int(current.get('valid_target_matches') or 0) == current_matches
          current_validation = current.get('historical_validation') or {}
          assert current_validation.get('status') == 'POSITIVE_HOLDOUT_SIGNAL'
          assert current_validation.get('runtime_feature_group') == 'profile_only'
          assert current_validation.get('stateful_reference_status') == scorer_signal.get('status')
          assert current_validation.get('stateful_reference_is_runtime_gate') is False
          assert int(current.get('scored_matches') or 0) > 0
          assert int(current.get('scored_matches') or 0) == int(current.get('eligible_matches') or 0)

          backtest = json.loads((data / 'player_dna_market_backtest.json').read_text(encoding='utf-8'))
          assert backtest.get('mode') == 'SHADOW_BACKTEST_ONLY'
          assert backtest.get('status') == 'BACKTEST_COMPLETE_NO_PROMOTION'
          assert backtest.get('production_influence') is False
          assert backtest.get('symphony2_influence') is False
          assert backtest.get('superbet_playable_influence') is False
          assert backtest.get('auto_promote') is False
          assert backtest.get('current_simulation_status_unchanged') == 'UNVALIDATED_MATCH_LEVEL'
          assert backtest.get('model_features') == 'PROFILE_ONLY_CURRENT_COMPATIBLE'
          assert backtest.get('model_converged') is True
          assert backtest.get('dynamic_lean_model_converged') is True
          dynamic_bt = backtest.get('dynamic_lean_stateful_candidate') or {}
          assert dynamic_bt.get('mode') == 'SHADOW_DYNAMIC_LEAN_STATEFUL_E2E_BACKTEST_ONLY'
          assert dynamic_bt.get('status') == 'BACKTEST_COMPLETE_NO_PROMOTION'
          assert dynamic_bt.get('signal') in {
              'DYNAMIC_LEAN_STATEFUL_E2E_PROMISING_SHADOW',
              'DYNAMIC_LEAN_STATEFUL_E2E_MIXED_OR_NO_GAIN',
              'INSUFFICIENT_DYNAMIC_LEAN_MATCH_LEVEL_SAMPLE',
          }
          assert dynamic_bt.get('production_influence') is False
          assert dynamic_bt.get('runtime_scoring_enabled') is False
          assert dynamic_bt.get('symphony2_influence') is False
          assert dynamic_bt.get('superbet_playable_influence') is False
          assert dynamic_bt.get('auto_promote') is False
          assert dynamic_bt.get('promotion_gate') is False
          assert dynamic_bt.get('feature_groups') == ['profile', 'rank', 'point_pressure', 'set_match_state']
          assert dynamic_bt.get('dropped_state_groups') == ['tiebreak_context', 'prior_momentum']
          assert dynamic_bt.get('tiebreak_policy') == 'PROFILE_ONLY_NEUTRAL_FIXED_PER_MATCH'
          assert dynamic_bt.get('model_converged') is True
          assert int(dynamic_bt.get('matched_settled_matches') or 0) >= 200
          dynamic_summary = dynamic_bt.get('summary') or {}
          assert int(dynamic_summary.get('binary_markets_evaluated_ge_100') or 0) >= 6
          dynamic_chronology = dynamic_bt.get('chronology_contract') or {}
          assert dynamic_chronology.get('lean_model_fit_train_partition_only') is True
          assert dynamic_chronology.get('holdout_profiles_as_of_each_match') is True
          assert dynamic_chronology.get('hypothetical_point_features_are_pre_point_only') is True
          for market in ('match_p1_win', 'first_set_p1_win', 'first_set_tiebreak'):
              metrics = (dynamic_bt.get('binary_markets_vs_profile_only') or {}).get(market) or {}
              assert int(metrics.get('n') or 0) >= 100
              assert metrics.get('reference_profile_only_brier') is not None
              assert metrics.get('dynamic_lean_brier') is not None
              assert metrics.get('brier_gain_vs_profile_only') is not None
          market_wf = json.loads((data / 'player_dna_dynamic_market_walk_forward.json').read_text(encoding='utf-8'))
          assert market_wf.get('mode') == 'SHADOW_DYNAMIC_LEAN_MARKET_WALK_FORWARD_ONLY'
          assert market_wf.get('status') == 'WALK_FORWARD_COMPLETE_NO_PROMOTION'
          assert market_wf.get('signal') in {
              'DYNAMIC_LEAN_MARKET_WALK_FORWARD_ROBUST_SHADOW',
              'DYNAMIC_LEAN_MARKET_WALK_FORWARD_MIXED_OR_NO_GAIN',
              'INSUFFICIENT_DYNAMIC_LEAN_MARKET_WALK_FORWARD_SAMPLE',
          }
          for key in ('production_influence', 'runtime_scoring_enabled', 'symphony2_influence', 'superbet_playable_influence', 'auto_promote', 'promotion_gate'):
              assert market_wf.get(key) is False
          assert market_wf.get('feature_groups') == ['profile', 'rank', 'point_pressure', 'set_match_state']
          assert market_wf.get('dropped_state_groups') == ['tiebreak_context', 'prior_momentum']
          assert market_wf.get('tiebreak_policy') == 'PROFILE_ONLY_NEUTRAL_FIXED_PER_MATCH'
          wf_policy = market_wf.get('fold_policy') or {}
          assert wf_policy.get('train_fractions') == [0.55, 0.7, 0.85]
          assert wf_policy.get('expanding_train_windows') is True
          assert wf_policy.get('evaluation_windows_disjoint') is True
          assert wf_policy.get('same_timestamp_groups_not_split') is True
          assert wf_policy.get('evaluation_fraction_windows') == [[0.55, 0.7], [0.7, 0.85], [0.85, 1.0]]
          wf_chronology = market_wf.get('chronology_contract') or {}
          for key in ('models_refit_per_fold_on_prior_matches_only', 'evaluation_windows_are_future_only', 'evaluation_windows_are_disjoint', 'same_timestamp_groups_are_never_split', 'profiles_are_as_of_each_target_match', 'rank_metadata_is_pre_match_context', 'hypothetical_point_features_are_pre_point_only', 'outcome_labels_used_only_for_evaluation'):
              assert wf_chronology.get(key) is True
          wf_folds = market_wf.get('folds') or []
          assert len(wf_folds) == 3
          for fold in wf_folds:
              assert fold.get('status') == 'FOLD_COMPLETE'
              assert fold.get('same_timestamp_split') is False
              assert fold.get('profile_model_converged') is True
              assert fold.get('dynamic_lean_model_converged') is True
          wf_summary = market_wf.get('summary') or {}
          assert int(wf_summary.get('required_folds') or 0) == 3
          assert int(wf_summary.get('completed_folds') or 0) == 3
          supported_folds = int(wf_summary.get('supported_folds') or 0)
          assert 0 <= supported_folds <= 3
          aggregate_matched = int(wf_summary.get('aggregate_matched_settled_matches') or 0)
          assert aggregate_matched >= 500
          if market_wf.get('signal') == 'INSUFFICIENT_DYNAMIC_LEAN_MARKET_WALK_FORWARD_SAMPLE':
              assert supported_folds < 3
          else:
              assert supported_folds == 3
          wf_aggregate = market_wf.get('aggregate') or {}
          assert wf_aggregate.get('mode') == 'SHADOW_DYNAMIC_LEAN_STATEFUL_E2E_BACKTEST_ONLY'
          assert wf_aggregate.get('status') == 'BACKTEST_COMPLETE_NO_PROMOTION'
          assert int(wf_aggregate.get('matched_settled_matches') or 0) >= 500
          segment_aggregate = market_wf.get('segment_aggregate') or {}
          segment_policy = segment_aggregate.get('policy') or {}
          assert segment_policy.get('dimensions') == ['tour', 'surface', 'tour_surface']
          assert int(segment_policy.get('segment_min_matched') or 0) == 40
          assert int(segment_policy.get('segment_min_market_n') or 0) == 30
          assert int(segment_policy.get('segment_min_evaluated_markets') or 0) == 4
          assert int(segment_policy.get('repeatable_min_folds') or 0) == 2
          assert segment_policy.get('diagnostic_only') is True
          assert segment_policy.get('promotion_gate') is False
          segment_dimensions = segment_aggregate.get('dimensions') or {}
          assert set(segment_dimensions) == {'tour', 'surface', 'tour_surface'}
          segment_watchlist = segment_aggregate.get('watchlist') or {}
          for key in ('repeatable_positive', 'repeatable_negative', 'mixed'):
              assert isinstance(segment_watchlist.get(key), list)
          consensus = market_wf.get('segment_consensus_shadow_policy') or {}
          assert consensus.get('mode') == 'SHADOW_SEGMENT_CONSENSUS_DIAGNOSTIC_ONLY'
          assert consensus.get('production_influence') is False
          assert consensus.get('runtime_switch_enabled') is False
          assert consensus.get('symphony2_influence') is False
          assert consensus.get('superbet_playable_influence') is False
          assert consensus.get('auto_promote') is False
          assert consensus.get('joint_segment_backtest_claim') is False
          assert consensus.get('prospective_validation_required') is True
          consensus_policy = consensus.get('policy') or {}
          assert consensus_policy.get('tour_and_surface_marginals_must_agree') is True
          assert consensus_policy.get('conflict_means_no_switch') is True
          assert consensus_policy.get('insufficient_means_no_switch') is True
          consensus_watch = consensus.get('watchlist') or {}
          for key in ('consensus_dynamic_candidate', 'consensus_profile_reference', 'conflict', 'insufficient_or_mixed'):
              assert isinstance(consensus_watch.get(key), list)
          for fold in wf_folds:
              segments = fold.get('segments') or {}
              assert set(segments) == {'tour', 'surface', 'tour_surface'}
              for dimension in ('tour', 'surface', 'tour_surface'):
                  assert isinstance(segments.get(dimension), dict)

          assert (backtest.get('signal') in {
              'POSITIVE_MATCH_LEVEL_HOLDOUT_SIGNAL',
              'MIXED_OR_NO_MATCH_LEVEL_SIGNAL',
          })
          bt_counts = backtest.get('counts') or {}
          assert int(bt_counts.get('settled_simulated_holdout_matches') or 0) >= 200
          bt_summary = backtest.get('summary') or {}
          assert int(bt_summary.get('binary_markets_evaluated_ge_100') or 0) >= 6
          for market in ('match_p1_win', 'first_set_p1_win', 'first_set_tiebreak'):
              metrics = (backtest.get('binary_markets') or {}).get(market) or {}
              assert int(metrics.get('n') or 0) >= 100
              assert metrics.get('brier') is not None
              assert metrics.get('baseline_brier') is not None
              assert metrics.get('ece_10_bin') is not None

          trajectory_bt = backtest.get('trajectory_validation') or {}
          assert trajectory_bt.get('status') == 'TRAJECTORY_HISTORICAL_DIAGNOSTIC'
          assert trajectory_bt.get('promotion_gate') is False
          assert 'no match-level robustness claim' in str(trajectory_bt.get('claim') or '')
          for checkpoint in ('after_2_games', 'after_4_games', 'after_6_games'):
              cp = (trajectory_bt.get('checkpoint_neutral_start_server') or {}).get(checkpoint) or {}
              assert int(cp.get('n') or 0) > 0
              assert cp.get('top1_accuracy') is not None
              assert cp.get('top3_accuracy') is not None
              assert float(cp.get('top3_accuracy') or 0) >= float(cp.get('top1_accuracy') or 0)
          first_path_bt = trajectory_bt.get('first_set_conditioned_on_observed_first_server') or {}
          match_path_bt = trajectory_bt.get('match_set_sequence_conditioned_on_observed_first_server') or {}
          full_match_bt = trajectory_bt.get('full_match_game_path_conditioned_on_observed_first_server') or {}
          assert int(first_path_bt.get('n') or 0) > 0
          assert int(match_path_bt.get('n') or 0) > 0
          assert int(full_match_bt.get('n') or 0) > 0
          assert first_path_bt.get('hit_at_8') is not None
          assert first_path_bt.get('mean_top1_prefix_fraction') is not None
          assert match_path_bt.get('hit_at_12') is not None
          assert full_match_bt.get('hit_at_4') is not None
          assert full_match_bt.get('mean_top1_prefix_fraction') is not None

          calibration = json.loads((data / 'player_dna_hold_calibration_audit.json').read_text(encoding='utf-8'))
          assert calibration.get('mode') == 'SHADOW_CALIBRATION_AUDIT_ONLY'
          assert calibration.get('status') == 'CALIBRATION_EXPERIMENT_COMPLETE_NO_INTEGRATION'
          assert calibration.get('production_influence') is False
          assert calibration.get('symphony2_influence') is False
          assert calibration.get('superbet_playable_influence') is False
          assert calibration.get('current_simulator_modified') is False
          assert calibration.get('auto_integrate') is False
          assert calibration.get('signal') in {
              'HOLD_CALIBRATION_PROMISING_SHADOW',
              'HOLD_CALIBRATION_NOT_YET_PROVEN',
          }
          assert ((calibration.get('split') or {}).get('same_timestamp_groups_not_split')) is True
          counts_cal = calibration.get('counts') or {}
          assert int(counts_cal.get('calibration_games') or 0) >= 500
          assert int(counts_cal.get('test_games') or 0) >= 500
          assert int(counts_cal.get('settled_test_matches') or 0) >= 100
          hold_cal = calibration.get('hold_calibrator') or {}
          assert hold_cal.get('converged') is True
          game_test = calibration.get('game_hold_test') or {}
          assert (game_test.get('iid_raw') or {}).get('brier') is not None
          assert (game_test.get('calibrated') or {}).get('brier') is not None

          walk_forward = json.loads((data / 'player_dna_hold_walk_forward.json').read_text(encoding='utf-8'))
          assert walk_forward.get('mode') == 'SHADOW_WALK_FORWARD_AUDIT_ONLY'
          assert walk_forward.get('status') in {
              'WALK_FORWARD_COMPLETE_NO_INTEGRATION',
              'WALK_FORWARD_INCOMPLETE_NO_INTEGRATION',
          }
          assert walk_forward.get('signal') in {
              'HOLD_CALIBRATION_WALK_FORWARD_ROBUST_SHADOW',
              'HOLD_CALIBRATION_WALK_FORWARD_NOT_YET_ROBUST',
          }
          assert walk_forward.get('production_influence') is False
          assert walk_forward.get('symphony2_influence') is False
          assert walk_forward.get('superbet_playable_influence') is False
          assert walk_forward.get('current_simulator_modified') is False
          assert walk_forward.get('candidate_gate_modified') is False
          assert walk_forward.get('auto_integrate') is False
          chronology = walk_forward.get('chronology_policy') or {}
          assert chronology.get('test_windows_disjoint') is True
          assert chronology.get('same_timestamp_groups_not_split') is True
          assert chronology.get('mature_history_windows') is True
          assert isinstance(walk_forward.get('segment_aggregate'), dict)
          aggregate = walk_forward.get('aggregate') or {}
          assert int(aggregate.get('required_folds') or 0) == 3
          assert int(aggregate.get('completed_folds') or 0) >= 2

          simulation = json.loads((data / 'player_dna_current_simulation.json').read_text(encoding='utf-8'))
          assert simulation.get('mode') == 'SHADOW_SIMULATION_ONLY'
          assert simulation.get('production_influence') is False
          assert simulation.get('symphony2_influence') is False
          assert simulation.get('superbet_playable_influence') is False
          assert simulation.get('match_level_validation_required') is True
          assert simulation.get('auto_promote') is False
          assert int(simulation.get('source_scored_matches') or 0) == int(current.get('scored_matches') or 0)
          assert int(simulation.get('simulated_matches') or 0) == int(current.get('scored_matches') or 0)
          expected_candidate = calibration.get('signal') == 'HOLD_CALIBRATION_PROMISING_SHADOW'
          assert simulation.get('hold_calibration_candidate_enabled') is expected_candidate
          expected_candidate_count = int(current.get('scored_matches') or 0) if expected_candidate else 0
          assert int(simulation.get('calibrated_candidate_matches') or 0) == expected_candidate_count
          source_cal = simulation.get('hold_calibration_source') or {}
          assert source_cal.get('signal') == calibration.get('signal')
          policy = simulation.get('market_policy') or {}
          assert policy.get('raw_iid_remains_reference') is True
          assert policy.get('hold_calibrated_is_candidate_only') is True
          assert policy.get('winner_markets') == 'NO_AUTOMATIC_SWITCH'
          for row in simulation.get('matches') or []:
              assert row.get('validation_status') == 'UNVALIDATED_MATCH_LEVEL'
              sim = row.get('simulation') or {}
              fs = sim.get('first_set') or {}
              mm = sim.get('match') or {}
              trajectory = sim.get('trajectory') or {}
              assert trajectory.get('status') == 'SHADOW_TRAJECTORY_FOUNDATION'
              assert trajectory.get('validation_status') == 'UNVALIDATED_MATCH_LEVEL'
              tcontract = trajectory.get('contract') or {}
              assert tcontract.get('not_a_single_certain_script') is True
              assert tcontract.get('ranked_paths_are_exact_within_known_start_server_condition') is True
              assert tcontract.get('production_influence') is False
              assert tcontract.get('symphony2_influence') is False
              assert tcontract.get('superbet_playable_influence') is False
              checkpoints = trajectory.get('checkpoints_neutral_start_server') or {}
              for checkpoint in ('after_2_games', 'after_4_games', 'after_6_games'):
                  rows_cp = checkpoints.get(checkpoint) or []
                  assert rows_cp
                  assert abs(sum(float(item.get('probability') or 0) for item in rows_cp) - 1.0) <= 1e-9
              conditioned = trajectory.get('serve_order_conditioned') or {}
              for key in ('p1_serves_first', 'p2_serves_first'):
                  branch = conditioned.get(key) or {}
                  assert branch.get('first_set_top_game_paths')
                  assert branch.get('match_top_set_paths')
                  full_paths = branch.get('full_match_top_game_paths') or []
                  assert full_paths
                  assert len(full_paths) <= 4
                  assert full_paths == sorted(full_paths, key=lambda item: float(item.get('probability') or 0), reverse=True)
                  for full_path in full_paths:
                      sets = full_path.get('sets') or []
                      assert int(full_path.get('sets_played') or 0) == len(sets)
                      assert int(full_path.get('total_games') or 0) == sum(len(item.get('progression') or []) for item in sets)
                      for set_path in sets:
                          progression = set_path.get('progression') or []
                          assert progression
                          assert progression[-1] == set_path.get('score')
                          if set_path.get('tiebreak') is True:
                              assert progression.count('6:6') == 1
              assert abs(float(fs.get('p1_win') or 0) + float(fs.get('p2_win') or 0) - 1.0) <= 1e-9
              assert abs(sum(float(v) for v in (fs.get('exact_score') or {}).values()) - 1.0) <= 1e-9
              assert abs(sum(float(v) for v in (mm.get('exact_score') or {}).values()) - 1.0) <= 1e-9
              candidate = row.get('hold_calibrated_candidate')
              if expected_candidate:
                  assert isinstance(candidate, dict)
                  assert candidate.get('mode') == 'SHADOW_HOLD_CALIBRATED_CANDIDATE'
                  assert candidate.get('validation_status') == 'BACKTESTED_HOLD_CALIBRATION_CANDIDATE'
                  assert candidate.get('production_influence') is False
                  assert candidate.get('symphony2_influence') is False
                  assert candidate.get('superbet_playable_influence') is False
                  assert candidate.get('auto_promote') is False
                  cfs = candidate.get('first_set') or {}
                  cmm = candidate.get('match') or {}
                  ctraj = candidate.get('trajectory') or {}
                  assert ctraj.get('status') == 'SHADOW_TRAJECTORY_FOUNDATION'
                  assert ctraj.get('validation_status') == 'UNVALIDATED_MATCH_LEVEL'
                  ccontract = ctraj.get('contract') or {}
                  assert ccontract.get('production_influence') is False
                  assert ccontract.get('full_match_game_paths_are_exact_for_known_start_server') is True
                  for cbranch in (ctraj.get('serve_order_conditioned') or {}).values():
                      assert cbranch.get('full_match_top_game_paths')
                  assert abs(float(cfs.get('p1_win') or 0) + float(cfs.get('p2_win') or 0) - 1.0) <= 1e-9
                  assert abs(sum(float(v) for v in (cfs.get('exact_score') or {}).values()) - 1.0) <= 1e-9
                  assert abs(sum(float(v) for v in (cmm.get('exact_score') or {}).values()) - 1.0) <= 1e-9
              else:
                  assert candidate is None

          prospective = json.loads((data / 'player_dna_prospective_validation.json').read_text(encoding='utf-8'))
          assert prospective.get('mode') == 'SHADOW_PROSPECTIVE_VALIDATION_ONLY'
          assert prospective.get('status') == 'PROSPECTIVE_COLLECTION_ACTIVE'
          assert prospective.get('signal') in {
              'COLLECTING_PROSPECTIVE_EVIDENCE',
              'PROSPECTIVE_DURATION_ROBUST_SHADOW',
              'PROSPECTIVE_DURATION_NOT_YET_PROVEN',
          }
          assert prospective.get('production_influence') is False
          assert prospective.get('symphony2_influence') is False
          assert prospective.get('superbet_playable_influence') is False
          assert prospective.get('current_simulator_modified') is False
          assert prospective.get('auto_integrate') is False
          assert prospective.get('market_scope') == 'DURATION_MARKETS_ONLY'
          assert prospective.get('winner_markets_promoted') is False
          integrity = prospective.get('ledger_integrity') or {}
          assert integrity.get('status') == 'LEDGER_INTEGRITY_OK'
          assert integrity.get('prediction_rewrite_forbidden') is True
          assert integrity.get('settlement_regression_forbidden') is True
          assert integrity.get('settled_actual_rewrite_forbidden') is True
          assert integrity.get('settled_at_rewrite_forbidden') is True
          assert integrity.get('snapshot_drop_forbidden_before_retention_cap') is True
          assert int(integrity.get('rewritten_predictions') or 0) == 0
          assert int(integrity.get('settlement_regressions') or 0) == 0
          assert int(integrity.get('settled_actual_rewrites') or 0) == 0
          assert int(integrity.get('settled_at_rewrites') or 0) == 0
          assert int(integrity.get('missing_previous_snapshots') or 0) == 0
          assert int(integrity.get('duplicate_previous_match_ids') or 0) == 0
          assert int(integrity.get('duplicate_current_match_ids') or 0) == 0
          assert int(integrity.get('current_snapshot_count_after_retention') or 0) == int((prospective.get('counts') or {}).get('snapshots') or 0)
          if int(integrity.get('pruned_by_retention') or 0) == 0:
              assert int(integrity.get('preserved_snapshots') or 0) == int(integrity.get('previous_snapshot_count') or 0)
          observability = prospective.get('settlement_observability') or {}
          unsettled_obs = observability.get('unsettled') or {}
          buckets = unsettled_obs.get('buckets') or {}
          assert sum(int(v or 0) for v in buckets.values()) == int((prospective.get('counts') or {}).get('unsettled_snapshots') or 0)
          assert 'does not imply cancellation' in str(unsettled_obs.get('meaning') or '')
          latency = observability.get('settlement_latency') or {}
          assert int(latency.get('n') or 0) <= int((prospective.get('counts') or {}).get('settled_snapshots') or 0)
          assert 'first workflow observation' in str(latency.get('meaning') or '')
          drift = observability.get('schedule_drift') or {}
          assert int(drift.get('count') or 0) >= 0
          assert 'snapshot is never rewritten' in str(drift.get('meaning') or '')
          readiness = prospective.get('evidence_readiness') or {}
          overall_ready = readiness.get('overall') or {}
          assert int(overall_ready.get('required') or 0) == 150
          readiness_policy = readiness.get('policy') or {}
          assert int(readiness_policy.get('per_supported_segment_minimum_settled') or 0) == 30
          assert readiness_policy.get('all_supported_tours_and_surfaces_must_meet_minimum') is True
          assert readiness_policy.get('performance_verdict_before_support_ready_forbidden') is True
          if prospective.get('signal') in {'PROSPECTIVE_DURATION_ROBUST_SHADOW', 'PROSPECTIVE_DURATION_NOT_YET_PROVEN'}:
              assert readiness.get('ready_for_performance_verdict') is True
              assert overall_ready.get('support_sufficient') is True
              assert readiness.get('segment_support_ready') is True
          if readiness.get('ready_for_performance_verdict') is not True:
              assert prospective.get('signal') == 'COLLECTING_PROSPECTIVE_EVIDENCE'
          policy_prospective = prospective.get('eligibility_policy') or {}
          assert policy_prospective.get('requires_walk_forward_robust') is True
          assert policy_prospective.get('requires_repeatable_tour') is True
          assert policy_prospective.get('requires_repeatable_surface') is True
          assert policy_prospective.get('post_result_snapshot_forbidden') is True
          if walk_forward.get('signal') == 'HOLD_CALIBRATION_WALK_FORWARD_ROBUST_SHADOW':
              repeatable_tours = sorted(
                  name for name, row in ((walk_forward.get('segment_aggregate') or {}).get('tour') or {}).items()
                  if isinstance(row, dict) and row.get('repeatable_duration_signal') is True
              )
              repeatable_surfaces = sorted(
                  name for name, row in ((walk_forward.get('segment_aggregate') or {}).get('surface') or {}).items()
                  if isinstance(row, dict) and row.get('repeatable_duration_signal') is True
              )
              assert policy_prospective.get('supported_tours') == repeatable_tours
              assert policy_prospective.get('supported_surfaces') == repeatable_surfaces
          for snap in prospective.get('snapshots') or []:
              assert snap.get('captured_pre_match') is True
              assert set((snap.get('raw_probabilities') or {}).keys()) == {
                  'first_set_tiebreak', 'first_set_over_8.5',
                  'first_set_over_9.5', 'first_set_over_10.5',
              }
              assert set((snap.get('calibrated_probabilities') or {}).keys()) == {
                  'first_set_tiebreak', 'first_set_over_8.5',
                  'first_set_over_9.5', 'first_set_over_10.5',
              }
              if snap.get('settled') is True:
                  assert set((snap.get('actual') or {}).keys()) == {
                      'first_set_tiebreak', 'first_set_over_8.5',
                      'first_set_over_9.5', 'first_set_over_10.5',
                  }

          model = json.loads((derived / 'current_point_model_shadow.json').read_text(encoding='utf-8'))
          assert model.get('mode') == 'SHADOW_MODEL_ARTIFACT'
          assert model.get('production_influence') is False
          assert model.get('prod_runtime_model') is False
          assert model.get('shadow_current_scoring_only') is True
          assert (model.get('fit') or {}).get('converged') is True
          assert model.get('training_cutoff_exclusive') == current.get('training_cutoff_exclusive')

          print(
              'PLAYER_DNA_SHADOW_OK '
              f"matches={matches} strict_points={strict_points} "
              f"current={current_matches} scored={current.get('scored_matches')} "
              f"collecting={current.get('collecting_history_matches')} "
              f"signal={(scorer.get('signal') or {}).get('status')} "
              f"simulated={simulation.get('simulated_matches')} "
              f"backtest={backtest.get('signal')} "
              f"hold_calibration={calibration.get('signal')} "
              f"walk_forward={walk_forward.get('signal')} "
              f"prospective={prospective.get('signal')} "
              f"prospective_new={integrity.get('new_snapshots')} "
              f"prospective_settled_now={integrity.get('newly_settled')} "
              f"prospective_rewrites={integrity.get('rewritten_predictions')} "
              f"prospective_overdue={(unsettled_obs.get('buckets') or {}).get('overdue_gt_72h')} "
              f"schedule_drift={drift.get('count')} "
              f"prospective_ready={readiness.get('ready_for_performance_verdict')} "
              f"segment_ready={readiness.get('segment_support_ready')} "
              f"settled_holdout={bt_counts.get('settled_simulated_holdout_matches')} "
              f"fingerprint={current.get('model_fingerprint_sha256')}"
          )
          PY

      - name: Upload Player DNA SHADOW artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-dna-shadow-refresh
          path: |
            frontend/data/player_dna_point_dataset_summary.json
            frontend/data/player_dna_profile_readiness.json
            frontend/data/player_dna_shadow_profile_summary.json
            frontend/data/player_dna_point_scorer.json
            frontend/data/player_dna_current_shadow.json
            frontend/data/player_dna_current_simulation.json
            frontend/data/player_dna_market_backtest.json
            frontend/data/player_dna_dynamic_market_walk_forward.json
            frontend/data/player_dna_hold_calibration_audit.json
            frontend/data/player_dna_hold_walk_forward.json
            frontend/data/player_dna_prospective_validation.json
            data/derived/player_dna/current_point_model_shadow.json
            data/derived/player_dna/current_simulation_full.json.gz
            data/derived/player_dna/point_events.jsonl.gz
            data/derived/player_dna/profile_snapshots.jsonl.gz
          if-no-files-found: error
          retention-days: 14

      - name: Publish Player DNA SHADOW reports
        if: github.event_name != 'pull_request'
        id: commit
        run: |
          git config user.name "tenis-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add             frontend/data/player_dna_point_dataset_summary.json             frontend/data/player_dna_profile_readiness.json             frontend/data/player_dna_shadow_profile_summary.json             frontend/data/player_dna_point_scorer.json             frontend/data/player_dna_current_shadow.json             frontend/data/player_dna_current_simulation.json             frontend/data/player_dna_market_backtest.json             frontend/data/player_dna_hold_calibration_audit.json             frontend/data/player_dna_hold_walk_forward.json             frontend/data/player_dna_prospective_validation.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh Player DNA SHADOW"
          for attempt in 1 2 3; do
            git fetch origin
            if git rebase origin/main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to publish Player DNA SHADOW after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Dispatch FAST Pages deploy
        if: github.event_name != 'pull_request' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages-fast.yml --ref main
