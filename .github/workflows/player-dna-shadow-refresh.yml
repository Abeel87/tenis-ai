name: Player DNA SHADOW refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/canonical_point_event.py'
      - 'backend/player_dna_point_dataset.py'
      - 'backend/player_dna_match_context.py'
      - 'backend/player_dna_shadow_profiles.py'
      - 'backend/player_dna_profile_readiness.py'
      - 'backend/player_dna_point_scorer.py'
      - 'backend/player_dna_current_shadow.py'
      - 'backend/player_dna_tennis_simulator.py'
      - 'backend/player_dna_market_backtest.py'
      - 'backend/player_dna_hold_calibration.py'
      - 'backend/player_identity.py'
      - '.github/workflows/player-dna-shadow-refresh.yml'
  workflow_run:
    workflows: ["Update tennis data and deploy Pages"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - 'backend/canonical_point_event.py'
      - 'backend/player_dna_point_dataset.py'
      - 'backend/player_dna_match_context.py'
      - 'backend/player_dna_shadow_profiles.py'
      - 'backend/player_dna_profile_readiness.py'
      - 'backend/player_dna_point_scorer.py'
      - 'backend/player_dna_current_shadow.py'
      - 'backend/player_identity.py'
      - 'tests/test_canonical_point_event.py'
      - 'tests/test_player_dna_point_dataset.py'
      - 'tests/test_player_dna_match_context.py'
      - 'tests/test_player_dna_shadow_profiles.py'
      - 'tests/test_player_dna_profile_readiness.py'
      - 'tests/test_player_dna_point_scorer.py'
      - 'tests/test_player_dna_current_shadow.py'
      - 'tests/test_player_dna_tennis_simulator.py'
      - 'tests/test_player_dna_market_backtest.py'
      - 'tests/test_player_dna_hold_calibration.py'
      - 'tests/test_player_identity.py'
      - '.github/workflows/player-dna-shadow-refresh.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: player-dna-shadow-refresh
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: '1'

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Restore tennis history + PBP cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tennis-history-${{ runner.os }}-player-dna-shadow-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Player DNA canonical guards
        run: |
          python -m py_compile backend/canonical_point_event.py
          python -m py_compile backend/player_dna_point_dataset.py
          python -m py_compile backend/player_dna_match_context.py
          python -m py_compile backend/player_dna_shadow_profiles.py
          python -m py_compile backend/player_dna_profile_readiness.py
          python -m py_compile backend/player_dna_point_scorer.py
          python -m py_compile backend/player_dna_current_shadow.py
          python -m py_compile backend/player_dna_tennis_simulator.py
          python -m py_compile backend/player_dna_market_backtest.py
          python -m py_compile backend/player_dna_hold_calibration.py
          python -m py_compile backend/player_dna_hold_walk_forward.py
          python -m pytest -q             tests/test_canonical_point_event.py             tests/test_player_dna_point_dataset.py             tests/test_player_dna_match_context.py             tests/test_player_dna_shadow_profiles.py             tests/test_player_dna_profile_readiness.py             tests/test_player_dna_point_scorer.py             tests/test_player_dna_current_shadow.py             tests/test_player_dna_tennis_simulator.py             tests/test_player_dna_market_backtest.py             tests/test_player_dna_hold_calibration.py             tests/test_player_dna_hold_walk_forward.py             tests/test_player_identity.py

      - name: Build strict Player DNA point dataset
        run: python backend/player_dna_point_dataset.py

      - name: Audit Player DNA profile readiness
        run: python backend/player_dna_profile_readiness.py

      - name: Build leakage-safe Player DNA profiles
        run: python backend/player_dna_shadow_profiles.py

      - name: Train + evaluate Player DNA scorer
        run: python backend/player_dna_point_scorer.py

      - name: Score current card in SHADOW
        run: python backend/player_dna_current_shadow.py

      - name: Backtest simulated markets on historical holdout
        run: python backend/player_dna_market_backtest.py

      - name: Audit hold calibration on untouched third partition
        run: python backend/player_dna_hold_calibration.py

      - name: Audit hold calibration walk-forward robustness
        run: python backend/player_dna_hold_walk_forward.py

      - name: Simulate raw + hold-calibrated tennis markets in SHADOW
        run: python backend/player_dna_tennis_simulator.py

      - name: Hard isolation + learning guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = Path('frontend/data')
          derived = Path('data/derived/player_dna')

          dataset = json.loads((data / 'player_dna_point_dataset_summary.json').read_text(encoding='utf-8'))
          assert dataset.get('shadow_only') is True
          assert dataset.get('training_join_enabled') is False
          assert dataset.get('profile_aggregation_enabled') is False
          matches = int(dataset.get('matches') or 0)
          context_matches = int(dataset.get('context_matches') or 0)
          strict_points = int(dataset.get('context_ready_player_point') or 0)
          assert matches > 0 and context_matches == matches and strict_points > 0

          readiness = json.loads((data / 'player_dna_profile_readiness.json').read_text(encoding='utf-8'))
          assert readiness.get('gate') == 'AUDIT_ONLY_NO_PROFILE_AGGREGATION'
          assert readiness.get('training_join_enabled') is False
          assert readiness.get('profile_aggregation_enabled') is False
          assert readiness.get('readiness_threshold_activation_enabled') is False
          assert int(readiness.get('source_matches_seen') or 0) == matches

          profiles = json.loads((data / 'player_dna_shadow_profile_summary.json').read_text(encoding='utf-8'))
          assert profiles.get('mode') == 'SHADOW_AS_OF_PROFILE'
          assert profiles.get('production_influence') is False
          assert profiles.get('training_join_enabled') is False
          assert profiles.get('profile_threshold_activation_enabled') is False
          assert profiles.get('same_time_matches_count_as_prior') is False
          assert int(profiles.get('player_match_snapshots') or 0) > 0

          scorer = json.loads((data / 'player_dna_point_scorer.json').read_text(encoding='utf-8'))
          assert scorer.get('mode') == 'SHADOW_EVAL_ONLY'
          assert scorer.get('production_influence') is False
          assert scorer.get('runtime_scoring_enabled') is False
          assert scorer.get('prod_model_write_enabled') is False
          assert scorer.get('real_shadow_training') is True
          assert (scorer.get('split') or {}).get('same_timestamp_split') is False
          assert float(scorer.get('join_coverage') or 0) == 1.0
          assert (scorer.get('signal') or {}).get('status') == 'POSITIVE_HOLDOUT_SIGNAL'

          current = json.loads((data / 'player_dna_current_shadow.json').read_text(encoding='utf-8'))
          assert current.get('mode') == 'SHADOW_CURRENT_ONLY'
          assert current.get('production_influence') is False
          assert current.get('symphony2_influence') is False
          assert current.get('superbet_playable_influence') is False
          assert current.get('match_winner_probability_enabled') is False
          assert current.get('point_serve_probability_only') is True
          current_matches = int(current.get('current_matches') or 0)
          assert current_matches > 0
          assert int(current.get('stable_id_matches') or 0) == current_matches
          assert int(current.get('valid_target_matches') or 0) == current_matches
          assert (current.get('historical_validation') or {}).get('status') == 'POSITIVE_HOLDOUT_SIGNAL'
          assert int(current.get('scored_matches') or 0) > 0
          assert int(current.get('scored_matches') or 0) == int(current.get('eligible_matches') or 0)

          backtest = json.loads((data / 'player_dna_market_backtest.json').read_text(encoding='utf-8'))
          assert backtest.get('mode') == 'SHADOW_BACKTEST_ONLY'
          assert backtest.get('status') == 'BACKTEST_COMPLETE_NO_PROMOTION'
          assert backtest.get('production_influence') is False
          assert backtest.get('symphony2_influence') is False
          assert backtest.get('superbet_playable_influence') is False
          assert backtest.get('auto_promote') is False
          assert backtest.get('current_simulation_status_unchanged') == 'UNVALIDATED_MATCH_LEVEL'
          assert backtest.get('model_features') == 'PROFILE_ONLY_CURRENT_COMPATIBLE'
          assert backtest.get('model_converged') is True
          assert (backtest.get('signal') in {
              'POSITIVE_MATCH_LEVEL_HOLDOUT_SIGNAL',
              'MIXED_OR_NO_MATCH_LEVEL_SIGNAL',
          })
          bt_counts = backtest.get('counts') or {}
          assert int(bt_counts.get('settled_simulated_holdout_matches') or 0) >= 200
          bt_summary = backtest.get('summary') or {}
          assert int(bt_summary.get('binary_markets_evaluated_ge_100') or 0) >= 6
          for market in ('match_p1_win', 'first_set_p1_win', 'first_set_tiebreak'):
              metrics = (backtest.get('binary_markets') or {}).get(market) or {}
              assert int(metrics.get('n') or 0) >= 100
              assert metrics.get('brier') is not None
              assert metrics.get('baseline_brier') is not None
              assert metrics.get('ece_10_bin') is not None

          calibration = json.loads((data / 'player_dna_hold_calibration_audit.json').read_text(encoding='utf-8'))
          assert calibration.get('mode') == 'SHADOW_CALIBRATION_AUDIT_ONLY'
          assert calibration.get('status') == 'CALIBRATION_EXPERIMENT_COMPLETE_NO_INTEGRATION'
          assert calibration.get('production_influence') is False
          assert calibration.get('symphony2_influence') is False
          assert calibration.get('superbet_playable_influence') is False
          assert calibration.get('current_simulator_modified') is False
          assert calibration.get('auto_integrate') is False
          assert calibration.get('signal') in {
              'HOLD_CALIBRATION_PROMISING_SHADOW',
              'HOLD_CALIBRATION_NOT_YET_PROVEN',
          }
          assert ((calibration.get('split') or {}).get('same_timestamp_groups_not_split')) is True
          counts_cal = calibration.get('counts') or {}
          assert int(counts_cal.get('calibration_games') or 0) >= 500
          assert int(counts_cal.get('test_games') or 0) >= 500
          assert int(counts_cal.get('settled_test_matches') or 0) >= 100
          hold_cal = calibration.get('hold_calibrator') or {}
          assert hold_cal.get('converged') is True
          game_test = calibration.get('game_hold_test') or {}
          assert (game_test.get('iid_raw') or {}).get('brier') is not None
          assert (game_test.get('calibrated') or {}).get('brier') is not None

          walk_forward = json.loads((data / 'player_dna_hold_walk_forward.json').read_text(encoding='utf-8'))
          assert walk_forward.get('mode') == 'SHADOW_WALK_FORWARD_AUDIT_ONLY'
          assert walk_forward.get('status') in {
              'WALK_FORWARD_COMPLETE_NO_INTEGRATION',
              'WALK_FORWARD_INCOMPLETE_NO_INTEGRATION',
          }
          assert walk_forward.get('signal') in {
              'HOLD_CALIBRATION_WALK_FORWARD_ROBUST_SHADOW',
              'HOLD_CALIBRATION_WALK_FORWARD_NOT_YET_ROBUST',
          }
          assert walk_forward.get('production_influence') is False
          assert walk_forward.get('symphony2_influence') is False
          assert walk_forward.get('superbet_playable_influence') is False
          assert walk_forward.get('current_simulator_modified') is False
          assert walk_forward.get('candidate_gate_modified') is False
          assert walk_forward.get('auto_integrate') is False
          chronology = walk_forward.get('chronology_policy') or {}
          assert chronology.get('test_windows_disjoint') is True
          assert chronology.get('same_timestamp_groups_not_split') is True
          assert chronology.get('mature_history_windows') is True
          assert isinstance(walk_forward.get('segment_aggregate'), dict)
          aggregate = walk_forward.get('aggregate') or {}
          assert int(aggregate.get('required_folds') or 0) == 3
          assert int(aggregate.get('completed_folds') or 0) >= 2

          simulation = json.loads((data / 'player_dna_current_simulation.json').read_text(encoding='utf-8'))
          assert simulation.get('mode') == 'SHADOW_SIMULATION_ONLY'
          assert simulation.get('production_influence') is False
          assert simulation.get('symphony2_influence') is False
          assert simulation.get('superbet_playable_influence') is False
          assert simulation.get('match_level_validation_required') is True
          assert simulation.get('auto_promote') is False
          assert int(simulation.get('source_scored_matches') or 0) == int(current.get('scored_matches') or 0)
          assert int(simulation.get('simulated_matches') or 0) == int(current.get('scored_matches') or 0)
          expected_candidate = calibration.get('signal') == 'HOLD_CALIBRATION_PROMISING_SHADOW'
          assert simulation.get('hold_calibration_candidate_enabled') is expected_candidate
          expected_candidate_count = int(current.get('scored_matches') or 0) if expected_candidate else 0
          assert int(simulation.get('calibrated_candidate_matches') or 0) == expected_candidate_count
          source_cal = simulation.get('hold_calibration_source') or {}
          assert source_cal.get('signal') == calibration.get('signal')
          policy = simulation.get('market_policy') or {}
          assert policy.get('raw_iid_remains_reference') is True
          assert policy.get('hold_calibrated_is_candidate_only') is True
          assert policy.get('winner_markets') == 'NO_AUTOMATIC_SWITCH'
          for row in simulation.get('matches') or []:
              assert row.get('validation_status') == 'UNVALIDATED_MATCH_LEVEL'
              sim = row.get('simulation') or {}
              fs = sim.get('first_set') or {}
              mm = sim.get('match') or {}
              assert abs(float(fs.get('p1_win') or 0) + float(fs.get('p2_win') or 0) - 1.0) <= 1e-9
              assert abs(sum(float(v) for v in (fs.get('exact_score') or {}).values()) - 1.0) <= 1e-9
              assert abs(sum(float(v) for v in (mm.get('exact_score') or {}).values()) - 1.0) <= 1e-9
              candidate = row.get('hold_calibrated_candidate')
              if expected_candidate:
                  assert isinstance(candidate, dict)
                  assert candidate.get('mode') == 'SHADOW_HOLD_CALIBRATED_CANDIDATE'
                  assert candidate.get('validation_status') == 'BACKTESTED_HOLD_CALIBRATION_CANDIDATE'
                  assert candidate.get('production_influence') is False
                  assert candidate.get('symphony2_influence') is False
                  assert candidate.get('superbet_playable_influence') is False
                  assert candidate.get('auto_promote') is False
                  cfs = candidate.get('first_set') or {}
                  cmm = candidate.get('match') or {}
                  assert abs(float(cfs.get('p1_win') or 0) + float(cfs.get('p2_win') or 0) - 1.0) <= 1e-9
                  assert abs(sum(float(v) for v in (cfs.get('exact_score') or {}).values()) - 1.0) <= 1e-9
                  assert abs(sum(float(v) for v in (cmm.get('exact_score') or {}).values()) - 1.0) <= 1e-9
              else:
                  assert candidate is None

          model = json.loads((derived / 'current_point_model_shadow.json').read_text(encoding='utf-8'))
          assert model.get('mode') == 'SHADOW_MODEL_ARTIFACT'
          assert model.get('production_influence') is False
          assert model.get('prod_runtime_model') is False
          assert model.get('shadow_current_scoring_only') is True
          assert (model.get('fit') or {}).get('converged') is True
          assert model.get('training_cutoff_exclusive') == current.get('training_cutoff_exclusive')

          print(
              'PLAYER_DNA_SHADOW_OK '
              f"matches={matches} strict_points={strict_points} "
              f"current={current_matches} scored={current.get('scored_matches')} "
              f"collecting={current.get('collecting_history_matches')} "
              f"signal={(scorer.get('signal') or {}).get('status')} "
              f"simulated={simulation.get('simulated_matches')} "
              f"backtest={backtest.get('signal')} "
              f"hold_calibration={calibration.get('signal')} "
              f"walk_forward={walk_forward.get('signal')} "
              f"settled_holdout={bt_counts.get('settled_simulated_holdout_matches')} "
              f"fingerprint={current.get('model_fingerprint_sha256')}"
          )
          PY

      - name: Upload Player DNA SHADOW artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-dna-shadow-refresh
          path: |
            frontend/data/player_dna_point_dataset_summary.json
            frontend/data/player_dna_profile_readiness.json
            frontend/data/player_dna_shadow_profile_summary.json
            frontend/data/player_dna_point_scorer.json
            frontend/data/player_dna_current_shadow.json
            frontend/data/player_dna_current_simulation.json
            frontend/data/player_dna_market_backtest.json
            frontend/data/player_dna_hold_calibration_audit.json
            frontend/data/player_dna_hold_walk_forward.json
            data/derived/player_dna/current_point_model_shadow.json
            data/derived/player_dna/point_events.jsonl.gz
            data/derived/player_dna/profile_snapshots.jsonl.gz
          if-no-files-found: error
          retention-days: 14

      - name: Publish Player DNA SHADOW reports
        if: github.event_name != 'pull_request'
        id: commit
        run: |
          git config user.name "tenis-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add             frontend/data/player_dna_point_dataset_summary.json             frontend/data/player_dna_profile_readiness.json             frontend/data/player_dna_shadow_profile_summary.json             frontend/data/player_dna_point_scorer.json             frontend/data/player_dna_current_shadow.json             frontend/data/player_dna_current_simulation.json             frontend/data/player_dna_market_backtest.json             frontend/data/player_dna_hold_calibration_audit.json             frontend/data/player_dna_hold_walk_forward.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh Player DNA SHADOW"
          for attempt in 1 2 3; do
            git fetch origin
            if git rebase origin/main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to publish Player DNA SHADOW after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Dispatch FAST Pages deploy
        if: github.event_name != 'pull_request' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages-fast.yml --ref main
