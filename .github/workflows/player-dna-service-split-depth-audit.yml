name: Player DNA Service Split Depth Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/player_dna_service_split_depth_audit.py'
      - 'tests/test_player_dna_service_split_depth_audit.py'
      - '.github/workflows/player-dna-service-split-depth-audit.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Restore tennis history + PBP cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tennis-history-${{ runner.os }}-player-dna-service-split-depth-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Test service-split depth audit
        run: python -m pytest -q tests/test_player_dna_service_split_depth_audit.py

      - name: Audit service-split snapshot depth (SHADOW, zero network)
        run: python backend/player_dna_service_split_depth_audit.py

      - name: Guard diagnostic isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('frontend/data/player_dna_service_split_depth_audit.json')
          if not p.exists():
              raise SystemExit('player_dna_service_split_depth_audit.json was not generated')

          report = json.loads(p.read_text(encoding='utf-8'))
          if report.get('mode') != 'SHADOW_DIAGNOSTIC_ONLY':
              raise SystemExit('service-split depth audit mode invalid')

          contract = report.get('contract') or {}
          expected = {
              'diagnostic_only': True,
              'canonical_profile_selection_changed': False,
              'historical_csv_namespace_used': False,
              'name_or_fuzzy_join_used': False,
              'stable_pbp_identity_required_for_future_use': True,
              'final_tape_score_required_for_terminal_evidence': True,
              'raw_numerator_denominator_required': True,
              'nonterminal_raw_evidence_used_for_production': False,
              'raw_outside_terminal_is_diagnostic_only': True,
              'alternate_raw_container_scan_diagnostic_only': True,
              'alternate_raw_container_authorized_for_history': False,
              'stats_capture_gap_diagnostic_only': True,
              'partial_raw_validation_diagnostic_only': True,
              'partial_raw_authorized_for_canonical_history': False,
              'partial_raw_gate_activation_enabled': False,
              'training_join_enabled': False,
              'scorer_activation_enabled': False,
              'runtime_activation_enabled': False,
          }
          for key, value in expected.items():
              if contract.get(key) is not value:
                  raise SystemExit(f'diagnostic isolation violation: {key}={contract.get(key)!r}')

          comparison = report.get('comparison') or {}
          counts = report.get('counts') or {}
          funnel = report.get('depth_funnel') or {}

          if comparison.get('safe_selection_change_proven') is not False:
              raise SystemExit('coverage audit must not authorize selector change')
          if comparison.get('safe_terminal_relaxation_proven') is not False:
              raise SystemExit('coverage audit must not authorize terminal relaxation')
          if int(counts.get('matches_seen') or 0) <= 0:
              raise SystemExit('service-split depth audit found no restored PBP matches')
          if funnel.get('funnel_accounts_for_all_stable_matches') is not True:
              raise SystemExit('service-split depth funnel does not account for stable matches')

          terminal = int(comparison.get('any_terminal_all_four_raw_matches') or 0)
          raw_any = int(comparison.get('any_profile_all_four_raw_matches') or 0)
          selector_only = int(comparison.get('potentially_recoverable_matches') or 0)
          if terminal > raw_any:
              raise SystemExit('terminal raw coverage cannot exceed raw coverage')
          if selector_only > terminal:
              raise SystemExit('selector-only recovery cannot exceed terminal raw coverage')

          capture = report.get('stats_capture_gap') or {}
          missing_stats = int(counts.get('matches_without_stats_profiles') or 0)
          if int(capture.get('matches_without_stats_profiles') or 0) != missing_stats:
              raise SystemExit('stats-capture gap count disagrees with depth funnel')
          if capture.get('reasons_account_for_all_missing_stats') is not True:
              raise SystemExit('stats-capture reasons do not account for missing stats')
          if capture.get('alternate_raw_accounts_for_all_missing_stats') is not True:
              raise SystemExit('alternate-raw scan does not account for missing stats')

          alternate = capture.get('alternate_raw_evidence') or {}
          alternate_total = sum(int(value or 0) for value in alternate.values())
          if alternate_total != missing_stats:
              raise SystemExit('alternate-raw evidence buckets disagree with missing stats')

          partial = report.get('partial_raw_terminal_validation') or {}
          gate = partial.get('predeclared_future_gate') or {}
          if gate.get('activation_enabled') is not False:
              raise SystemExit('partial-raw validation must not activate a history gate')
          if contract.get('partial_raw_authorized_for_canonical_history') is not False:
              raise SystemExit('partial raw snapshots were authorized without a separate gate')
          progress_candidates = partial.get('raw_without_terminal_candidates_by_progress') or {}
          raw_without_terminal = int(comparison.get('raw_all_four_outside_terminal_proof_matches') or 0)
          for threshold, item in progress_candidates.items():
              if int((item or {}).get('matches') or 0) > raw_without_terminal:
                  raise SystemExit(f'partial raw candidate count exceeds source gap at {threshold}')

          print(
              'Service-split depth: '
              f"seen={counts.get('matches_seen')} "
              f"stats={counts.get('matches_with_stats_profiles')} "
              f"raw_any={raw_any} "
              f"terminal_all4={terminal} "
              f"raw_without_terminal={comparison.get('raw_all_four_outside_terminal_proof_matches')} "
              f"no_stats={missing_stats} "
              f"no_profiles={(capture.get('no_stats_capture_reasons') or {}).get('no_profile_entries')} "
              f"alt_raw_all4={alternate.get('all_four_raw_cached_elsewhere')} "
              f"alt_raw_partial={alternate.get('partial_raw_cached_elsewhere')} "
              f"alt_raw_none={alternate.get('no_raw_stats_like_container_found')} "
              f"paired_partial={partial.get('paired_terminal_matches_with_preterminal_all_four_raw')} "
              f"p90_pairs={((partial.get('by_minimum_game_progress') or {}).get('0.9') or {}).get('matches')} "
              f"p90_mae={((partial.get('by_minimum_game_progress') or {}).get('0.9') or {}).get('mean_abs_error_pp')} "
              f"p90_within5={((partial.get('by_minimum_game_progress') or {}).get('0.9') or {}).get('within_5pp_rate')} "
              f"p90_candidates={(progress_candidates.get('0.9') or {}).get('matches')} "
              f"dominant_gap={funnel.get('dominant_observed_gap')}"
          )
          PY

      - name: Upload service-split depth report
        uses: actions/upload-artifact@v4
        with:
          name: player-dna-service-split-depth-audit
          path: frontend/data/player_dna_service_split_depth_audit.json
          if-no-files-found: error
