name: TennisMyLife freshness preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/tml_freshness_preview.py'
      - 'backend/update.py'
      - 'backend/model.py'
      - 'backend/model_core.py'
      - 'backend/history_hygiene_v78a.py'
      - 'backend/insufficient_history_evidence.py'
      - 'tests/test_tml_freshness_preview.py'
      - '.github/workflows/tml-freshness-preview.yml'

permissions:
  contents: read

env:
  PYTHONPATH: backend:.

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -c requirements.lock

      - name: Unit tests
        run: >-
          python -m pytest -q
          tests/test_tml_freshness_preview.py
          tests/test_insufficient_history_evidence.py

      - name: Restore existing history cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tennis-history-${{ runner.os }}-task010-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Require declared cached TML baseline
        shell: bash
        run: |
          count=$(find data/cache -maxdepth 1 -type f -name '*.csv.gz' | wc -l)
          echo "restored root TML csv files: ${count}"
          test "${count}" -ge 11 || { echo 'incomplete restored TennisMyLife baseline'; exit 21; }

      - name: Run TML-only freshness preview
        env:
          LIVE_TENNIS_API_KEY: ''
        run: python backend/tml_freshness_preview.py

      - name: Validate preview contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('artifacts/tml_freshness_preview.json').read_text(encoding='utf-8'))
          policy = doc['policy']
          summary = doc['summary']
          decision = doc['decision']
          assert policy['live_tennis_api_calls'] == 0
          assert policy['tennismylife_requests_only'] is True
          assert policy['uses_existing_declared_tml_urls_only'] is True
          assert policy['production_cache_writes'] == 0
          assert policy['runtime_change_authorized'] is False
          assert policy['minimum_match_gate_changed'] is False
          assert policy['history_hygiene_changed'] is False
          assert policy['identity_resolver_changed'] is False
          assert policy['model_math_changed'] is False
          assert decision['runtime_change'] is False
          assert decision['history_gate_change'] is False
          assert decision['authorize_fresh_tml'] is False
          assert summary['declared_sources'] == 11
          assert summary['refreshable_sources'] == 7
          assert summary['immutable_sources'] == 4
          # Freshness conclusions are only accepted when every declared refreshable
          # source was actually fetched in this run; otherwise fail rather than infer.
          assert summary['refresh_attempts'] == 7
          assert summary['refresh_success'] == 7
          assert summary['refresh_failures'] == 0
          assert summary['short_history_cases'] > 0
          print(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(doc['category_counts'], indent=2, sort_keys=True))
          for source in doc['sources']:
              if source['refreshable']:
                  print(json.dumps(source, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload TASK 010 report
        uses: actions/upload-artifact@v4
        with:
          name: tml-freshness-preview
          path: artifacts/tml_freshness_preview.json
          if-no-files-found: error
