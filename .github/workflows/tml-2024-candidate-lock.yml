name: TML 2024 candidate lock

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/tml_2024_candidate_lock.py'
      - 'audits/tml_2024_candidate_lock_manifest.json'
      - 'backend/tml_2024_blocker_audit.py'
      - 'backend/tml_2024_integration_safety_gate.py'
      - 'backend/tml_2024_history_preview.py'
      - 'backend/history_coverage_audit.py'
      - 'backend/history_hygiene_v78a.py'
      - 'backend/model.py'
      - 'backend/model_core.py'
      - 'frontend/data/results.json'
      - 'tests/test_tml_2024_candidate_lock.py'
      - '.github/workflows/tml-2024-candidate-lock.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: backend:.

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: python -m pip install pytest pandas requests

      - name: Unit tests
        run: python -m pytest -q tests/test_tml_2024_candidate_lock.py

      - name: Restore latest tennis cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tml-2024-candidate-lock-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Require restored production cache snapshot
        shell: bash
        env:
          MATCHED_CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$MATCHED_CACHE_KEY" || { echo 'No tennis-history Actions cache restored'; exit 21; }
          count=$(find data/cache -maxdepth 1 -type f -name '*.csv.gz' | wc -l)
          echo "restored root CSV cache files: ${count}"
          test "$count" -ge 11 || { echo 'Expected all declared current TennisMyLife cache files'; exit 22; }
          test -s frontend/data/results.json || { echo 'Missing current results.json'; exit 23; }

      - name: Run TASK 017 candidate lock
        env:
          LIVE_TENNIS_API_KEY: ''
        shell: bash
        run: |
          set +e
          python backend/tml_2024_candidate_lock.py
          code=$?
          mkdir -p artifacts
          echo "$code" > artifacts/task017_script_exit_code.txt
          echo "task017_script_exit_code=$code"
          exit 0

      - name: Upload TASK 017 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tml-2024-candidate-lock
          path: |
            artifacts/tml_2024_candidate_lock.json
            artifacts/task017_script_exit_code.txt
          if-no-files-found: error

      - name: Validate audit-only contract
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/tml_2024_candidate_lock.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('audits/tml_2024_candidate_lock_manifest.json').read_text(encoding='utf-8'))
          p = report['policy']
          s = report['summary']
          shape = manifest['task016_expected_shape']

          assert p['live_tennis_api_calls'] == 0
          assert p['production_cache_writes'] == 0
          assert p['fuzzy_matching'] is False
          assert p['manual_aliases'] is False
          assert p['cross_provider_id_comparison'] is False
          assert p['minimum_match_gate'] == 5
          assert p['minimum_match_gate_changed'] is False
          assert p['identity_resolver_changed'] is False
          assert p['history_hygiene_changed'] is False
          assert p['model_math_changed'] is False
          assert p['runtime_change_authorized'] is False
          assert p['archive_data_authorized_for_runtime'] is False
          assert p['tml_sources_changed'] is False

          assert s['all_2024_sources_fetched'] is True
          assert s['manifest_sources_match_task014'] is True
          assert s['task016_candidate_rows'] == shape['candidate_rows']
          assert s['task016_candidate_source_counts'] == shape['source_counts']
          assert s['task016_frozen_shape_matches'] is True
          # current_task016_dynamic_matches_frozen is diagnostic only: results.json
          # legitimately changes over time. Current safety is enforced below.
          assert s['global_hardening_all_evidence_matched'] is True
          assert s['all_candidate_rows_within_2024'] is True
          assert s['archive_involved_global_id_conflicts'] == 0
          assert s['exact_shadow_variant_collisions'] == 0
          assert s['archive_involved_score_conflicts'] == 0
          assert s['visible_resolution_changes'] == 0
          assert s['candidate_lock_safety_verified'] is True

          if manifest.get('expected'):
              assert s['fingerprint_lock_present'] is True
              assert s['fingerprint_lock_matches'] is True
              assert s['candidate_ready_for_separate_integration_review'] is True
          else:
              assert s['fingerprint_lock_present'] is False
              assert s['fingerprint_lock_matches'] is False
              assert s['candidate_ready_for_separate_integration_review'] is False
              print('DISCOVERY_EXPECTED=' + json.dumps(report['expectation_check']['current'], sort_keys=True))

          assert report['decision']['runtime_change'] is False
          assert report['decision']['authorize_2024_archive'] is False
          print(json.dumps(s, indent=2, sort_keys=True))
          PY
