name: Install v8.5 Player Intelligence
on:
  push:
    branches:
      - docs-add-v8.5-Player-Intelligence-plan
    paths:
      - v85_install.py
      - .github/workflows/install-v85.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: install-v85-${{ github.ref }}
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs-add-v8.5-Player-Intelligence-plan
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Generate v8.5 files
        run: python v85_install.py
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Python syntax
        run: |
          python -m py_compile backend/player_intelligence_v85.py
          python -m py_compile scripts/verify_v85.py
      - name: Frontend syntax
        run: node --check frontend/player-intelligence-v85.js
      - name: Player Intelligence unit tests
        run: python -m pytest -q tests/test_v85_player_intelligence.py
      - name: Full test suite
        run: python -m pytest -q
      - name: Player Intelligence guard
        run: python scripts/verify_v85.py
      - name: Commit v8.5 to feature branch
        run: |
          git config user.name "tenis-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add v8.5 Player Intelligence"
          git fetch origin docs-add-v8.5-Player-Intelligence-plan
          git rebase origin/docs-add-v8.5-Player-Intelligence-plan
          git push origin HEAD:docs-add-v8.5-Player-Intelligence-plan
