name: LOGIC-03 population priors audit

on:
  pull_request:
    paths:
      - 'backend/population_priors_audit.py'
      - 'tests/test_population_priors_audit.py'
      - '.github/workflows/population-priors-audit.yml'
      - 'TENIS_AI_EXECUTION_CHECKLIST.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: backend:.
      LIVE_TENNIS_API_KEY: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install pytest pandas requests
      - name: Unit tests
        run: python -m pytest -q tests/test_population_priors_audit.py
      - name: Restore latest production tennis cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: logic-03-priors-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-
      - name: Require exact local evidence sources
        env:
          MATCHED_CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$MATCHED_CACHE_KEY" || { echo 'No tennis-history Actions cache restored'; exit 21; }
          count=$(find data/cache -maxdepth 1 -type f -name '*.csv.gz' | wc -l)
          echo "restored root CSV cache files: ${count}"
          test "$count" -ge 11 || { echo 'Expected all declared TennisMyLife cache files'; exit 22; }
          test -s frontend/data/results.json || { echo 'Missing current results.json'; exit 23; }
      - name: Run LOGIC-03 audit-only population priors counterfactual
        run: python backend/population_priors_audit.py
      - name: Validate audit contract and evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/population_priors_audit.json').read_text(encoding='utf-8'))
          p = report['policy']
          assert p['audit_only'] is True
          assert p['shadow_only'] is True
          assert p['runtime_change'] is False
          assert p['model_math_changed'] is False
          assert p['probability_changed'] is False
          assert p['thresholds_changed'] is False
          assert p['weights_changed'] is False
          assert p['training_changed'] is False
          assert p['player_dna_changed'] is False
          assert p['surface_elo_changed'] is False
          assert p['symphony_changed'] is False
          assert p['neuron_changed'] is False
          assert p['playable_changed'] is False
          assert p['settlement_changed'] is False
          assert p['ineed_calculations_changed'] is False
          assert p['live_tennis_api_calls'] == 0
          assert p['production_cache_writes'] == 0
          assert p['production_surface_support_threshold_changed'] is False

          contract = report['production_contract']
          assert contract['surface_prior_owner'] == 'model_core._surface_priors'
          assert contract['surface_support_threshold'] == 100

          table = report['current_snapshot_priors']['surfaces']
          assert table
          for surface, row in table.items():
              assert 'mixed' in row
              assert set(row['populations']) == {'ATP', 'CH', 'WTA'}
              for population, item in row['populations'].items():
                  assert item['support']['production_surface_threshold'] == 100
                  assert set(item['delta_vs_mixed']) == {
                      'hold_rate', 'break_rate', 'serve_points_won', 'return_points_won'
                  }

          summary = report['summary']
          assert summary['visible_matches'] > 0
          assert summary['model_ready_matches'] > 0
          assert not summary['counterfactual_errors']
          assert summary['eligible_model_ready_counterfactuals'] > 0

          candidate = report['candidate_hierarchy']
          assert candidate['status'] == 'EVIDENCE_ONLY_NOT_PROD'
          assert candidate['production_change_authorized'] is False
          assert candidate['threshold_100_change_authorized'] is False
          decision = report['decision']
          assert decision['production_change_authorized'] is False
          assert decision['population_split_promotion_authorized'] is False
          assert decision['fallback_policy_promotion_authorized'] is False

          print(json.dumps({
              'summary': summary,
              'current_snapshot_priors': report['current_snapshot_priors'],
              'candidate_hierarchy': candidate,
          }, indent=2, sort_keys=True))
          PY
      - name: Upload LOGIC-03 evidence
        uses: actions/upload-artifact@v4
        with:
          name: logic-03-population-priors
          path: artifacts/population_priors_audit.json
          if-no-files-found: error
