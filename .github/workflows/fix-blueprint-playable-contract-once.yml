name: Fix blueprint PLAYABLE presentation contract

on:
  push:
    branches:
      - ui/restore-agreed-product-blueprint

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/restore-agreed-product-blueprint
          fetch-depth: 1

      - name: Apply fix
        run: python scripts/fix_blueprint_playable_contract_once.py

      - name: Install pytest
        run: python -m pip install -q pytest

      - name: Validate failed contracts and product UI
        run: |
          python -m pytest -q tests/test_canonical_playable_frontend.py tests/test_raw_playable_separation_v922.py tests/test_clean_product_ui.py
          node --check frontend/playable-ui.js
          node tests/ui_static_smoke.mjs

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "tenis-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-blueprint-playable-contract-once.yml scripts/fix_blueprint_playable_contract_once.py
          git add frontend/playable-ui.js
          git commit -m "Preserve PLAYABLE contract behind simple product UI"
          git push origin HEAD:ui/restore-agreed-product-blueprint
