name: TML 2024 runtime equivalence audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/tml_2024_runtime_equivalence_audit.py'
      - 'backend/tml_2024_candidate_lock.py'
      - 'audits/tml_2024_candidate_lock_manifest.json'
      - 'backend/model.py'
      - 'backend/model_core.py'
      - 'backend/update.py'
      - 'backend/history_hygiene_v78a.py'
      - 'backend/history_coverage_audit.py'
      - 'backend/prediction_integrity_v78a.py'
      - 'backend/joint_builder_v78b.py'
      - 'frontend/data/results.json'
      - 'tests/test_tml_2024_runtime_equivalence_audit.py'
      - '.github/workflows/tml-2024-runtime-equivalence-audit.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: backend:.

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: python -m pip install pytest pandas requests

      - name: Unit tests
        run: python -m pytest -q tests/test_tml_2024_runtime_equivalence_audit.py

      - name: Restore latest tennis cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tml-2024-runtime-equivalence-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Require restored production cache snapshot
        shell: bash
        env:
          MATCHED_CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$MATCHED_CACHE_KEY" || { echo 'No tennis-history Actions cache restored'; exit 21; }
          count=$(find data/cache -maxdepth 1 -type f -name '*.csv.gz' | wc -l)
          echo "restored root CSV cache files: ${count}"
          test "$count" -ge 11 || { echo 'Expected all declared current TennisMyLife cache files'; exit 22; }
          test -s frontend/data/results.json || { echo 'Missing current results.json'; exit 23; }

      - name: Run TASK 018 runtime equivalence audit
        env:
          LIVE_TENNIS_API_KEY: ''
        run: python backend/tml_2024_runtime_equivalence_audit.py

      - name: Upload TASK 018 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tml-2024-runtime-equivalence-audit
          path: artifacts/tml_2024_runtime_equivalence_audit.json
          if-no-files-found: error

      - name: Validate audit-only contract
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/tml_2024_runtime_equivalence_audit.json').read_text(encoding='utf-8'))
          p = report['policy']
          s = report['summary']
          d = report['decision']

          assert p['live_tennis_api_calls'] == 0
          assert p['production_cache_writes'] == 0
          assert p['temporary_or_memory_only'] is True
          assert p['fuzzy_matching'] is False
          assert p['manual_aliases'] is False
          assert p['cross_provider_id_comparison'] is False
          assert p['minimum_match_gate'] == 5
          assert p['minimum_match_gate_changed'] is False
          assert p['identity_resolver_changed'] is False
          assert p['history_hygiene_changed'] is False
          assert p['model_math_changed'] is False
          assert p['runtime_change_authorized'] is False
          assert p['archive_data_authorized_for_runtime'] is False
          assert p['tml_sources_changed'] is False
          assert p['fail_closed_on_unrelated_output_change'] is True

          assert s['visible_fixtures_audited'] > 0
          assert s['all_2024_sources_fetched'] is True
          assert s['locked_candidate_verified'] is True
          assert s['locked_candidate_rows'] == 12474
          assert s['runtime_contains_locked_2024_sources'] is False

          assert d['runtime_change'] is False
          assert d['authorize_2024_archive'] is False
          assert d['integration_authorized'] is False
          assert d['separate_mitigation_or_integration_pr_required'] is True

          print(json.dumps(s, indent=2, sort_keys=True))
          print('DECISION=' + json.dumps(d, sort_keys=True))
          PY
