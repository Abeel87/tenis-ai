name: Fast frontend deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages-fast.yml'
      - '.github/actions/prepare-pages/**'
      - '.github/scripts/change_scope.py'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Decide FAST vs FULL scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual FAST deploy requested."
            exit 0
          fi

          BEFORE="${{ github.event.before }}" HEAD_SHA="$GITHUB_SHA" python .github/scripts/change_scope.py

      - name: Setup Node
        if: steps.scope.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Fast frontend checks
        if: steps.scope.outputs.deploy == 'true'
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find frontend -maxdepth 1 -name '*.js' -print0)
          node tests/ui_static_smoke.mjs
          node scripts/build_delivery.mjs
          node tests/ui_runtime_smoke.mjs
          node tests/decision_center_smoke.mjs

      - name: Configure Pages
        if: steps.scope.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Build lazy match delivery
        if: steps.scope.outputs.deploy == 'true'
        uses: ./.github/actions/prepare-pages

      - name: Upload frontend
        if: steps.scope.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend

      - name: Deploy Pages
        if: steps.scope.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
