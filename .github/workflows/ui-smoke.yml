name: Tenis AI UI & Project Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, ci/symphony2-clean-base]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: python -m pip install -r requirements.txt

      - name: Restore exact tennis history cache for coverage audit
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tennis-history-${{ runner.os }}-coverage-audit-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Exact current history coverage audit
        # Re-run against the post-#314 ATP qualifying history cache from latest main.
        run: python scripts/audit_current_history_coverage.py
