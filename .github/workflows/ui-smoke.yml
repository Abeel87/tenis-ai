name: Tenis AI UI & Project Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JavaScript syntax
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find frontend -maxdepth 1 -name '*.js' -print0)

      - name: UI static smoke
        run: node tests/ui_static_smoke.mjs

      - name: Python syntax
        run: python -m compileall -q backend scripts

      - name: Project health
        run: python scripts/project_health.py

      - name: Runtime health v8.4E0
        run: python scripts/runtime_health_v84e0.py

      - name: Global Match Time Guard v8.4E1.1
        run: python scripts/verify_v84e11.py

      - name: Model Trend Monitor Guard v8.4E2
        run: python scripts/verify_v84e2.py
