name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/*.js', 'scripts/**', 'supabase/functions/**', '.github/workflows/codeql.yml']
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
