name: Update tennis data and deploy Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test model
        run: python -m pytest -q
      - name: Restore tennis history + PBP cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tennis-history-${{ runner.os }}-${{ hashFiles('data/cache/*.csv.gz') }}-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-${{ hashFiles('data/cache/*.csv.gz') }}-
            tennis-history-${{ runner.os }}-
      - name: Update analysis
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
          FIXTURE_DAYS: '1'
        run: python backend/update.py
      - name: Build player tendency profiles
        run: python backend/player_trends.py
      - name: Build serve props (aces + double faults)
        run: python backend/serve_props.py
      - name: Enrich Early Hold from BASIC point-by-point
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
        run: python backend/pbp_enrich.py
      - name: Track + backtest PBP
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
        run: python backend/pbp_tracker.py
      - name: Capture green history
        run: python backend/degraded_history.py
      - name: Settle history from Live Tennis API
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
        run: python backend/live_history_settle.py
      - name: Save tennis history + PBP cache
        if: ${{ hashFiles('data/cache/*.csv.gz') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: tennis-history-${{ runner.os }}-${{ hashFiles('data/cache/*.csv.gz') }}-${{ github.run_id }}
      - name: Commit refreshed JSON
        run: |
          git config user.name "tenis-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data
          git diff --cached --quiet || git commit -m "data: refresh tennis analysis"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
