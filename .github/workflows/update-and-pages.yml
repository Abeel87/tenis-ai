name: Update tennis data and deploy Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5,9,13,17 * * *'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update analysis
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
          FIXTURE_DAYS: '1'
        run: python backend/update.py
      - name: Commit refreshed JSON
        run: |
          git config user.name "tenis-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data
          git diff --cached --quiet || git commit -m "data: refresh tennis analysis"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
