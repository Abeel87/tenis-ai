name: Update tennis data and deploy Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  # v8.4E2.1: serialize generator/deploy runs so frontend/data JSON never races another run
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Queued runs must build from the newest main, not the old triggering SHA.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test model
        run: python -m pytest -q
      - name: Restore tennis history + PBP cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tennis-history-${{ runner.os }}-${{ hashFiles('data/cache/*.csv.gz') }}-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-${{ hashFiles('data/cache/*.csv.gz') }}-
            tennis-history-${{ runner.os }}-
      - name: Central API Quota Guard v8.3B
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
        run: python backend/api_quota_v83b.py begin
      - name: Update analysis
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
          FIXTURE_DAYS: '2'
        run: python backend/update.py
      - name: Build Market Lab v7.4.1
        run: python backend/market_lab_v741.py
      - name: Build player tendency profiles
        run: python backend/player_trends.py
      - name: Build serve props (aces + double faults)
        run: python backend/serve_props.py
      - name: Enrich Early Hold from BASIC point-by-point
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
        run: python backend/pbp_enrich.py
      - name: Rebuild Joint Builder after PBP enrichment
        run: python backend/apply_joint_to_results_v78b.py
      - name: Player Intelligence v8.5 PRE
        run: python backend/player_intelligence_v85.py pre
      - name: Prediction integrity gate v7.8A
        run: python backend/prediction_integrity_v78a.py
      - name: Track + backtest PBP
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
        run: python backend/pbp_tracker.py
      - name: Capture green history
        run: python backend/degraded_history.py
      - name: Capture specialist learning v7.9B
        run: python backend/specialist_learning_v79b.py
      - name: Capture Shadow Lab v7.8E6
        run: python backend/shadow_lab_v78e6.py
      - name: Settle history from Live Tennis API
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
        run: python backend/live_history_settle.py
      - name: Refresh Shadow Lab stats after settlement
        run: python backend/shadow_lab_v78e6.py
      - name: Track Market Lab learning data
        run: python backend/market_lab_tracker_v741.py
      - name: Build Scenario Settlement feed v8.3C
        run: python backend/scenario_settlement_v83c.py
      - name: Historical backfill v8.3B (central spare quota)
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
          HISTORY_BACKFILL_ENABLED: '1'
          HISTORY_BACKFILL_DAILY_FRACTION: '0.12'
          HISTORY_BACKFILL_HARD_RESERVE_FRACTION: '0.45'
          HISTORY_BACKFILL_RUN_CAP: '18'
          HISTORY_BACKFILL_MIN_INTERVAL_HOURS: '3'
          HISTORY_BACKFILL_MAX_CACHE_MB: '900'
        run: python backend/history_backfill_v83.py
      - name: Optional TabPFN V2 runtime v8.4A
        env:
          TABPFN_MODEL_CACHE_DIR: data/cache/tabpfn_models
          TABPFN_NO_BROWSER: '1'
        run: |
          if python backend/autolearn_v84.py --tabpfn-due; then
            echo "TabPFN V2 challenger is due — bounded optional install"
            timeout 240s python -m pip install "tabpfn==8.2.0" || echo "TabPFN install skipped/failed; CatBoost fallback remains active"
          else
            echo "TabPFN V2 challenger not due this run"
          fi
      - name: AutoLearn Ensemble v8.4A
        env:
          TABPFN_MODEL_CACHE_DIR: data/cache/tabpfn_models
          TABPFN_NO_BROWSER: '1'
        run: python backend/autolearn_v84.py
      - name: Adaptive Learning v7.9B controlled PROD
        run: python backend/adaptive_learning_v79.py
      - name: Accuracy Shadow Lab v8.6
        env:
          TABPFN_MODEL_CACHE_DIR: data/cache/tabpfn_models
          TABPFN_NO_BROWSER: '1'
          V86_EXTENDED: '0'
        run: timeout 300s python backend/accuracy_lab_v86.py || echo "Accuracy Lab skipped/timeout; production remains unchanged"
      - name: Model Telemetry v8.4C
        run: python backend/model_telemetry_v84c.py
      - name: Player Intelligence v8.5 POST
        run: python backend/player_intelligence_v85.py post
      - name: Reconcile all settled layers and refresh final reports
        run: |
          python backend/refresh_settlement_reports.py
          python scripts/verify_audit_consistency.py
      - name: Player Model + Intelligence SHADOW v8.9
        run: python backend/player_model_shadow_v89.py
      - name: Ensemble + Player Learning SHADOW v8.9.1
        run: python backend/ensemble_player_learning_v891.py
      - name: Ensemble + Player Learning Guard v8.9.1
        run: python scripts/verify_v891_ensemble_player_learning.py
      - name: Player Model Shadow Guard v8.9
        run: python scripts/verify_v89_player_model_shadow.py
      - name: Player Intelligence Guard v8.5
        run: python scripts/verify_v85.py
      - name: AutoLearn Integration Guard v8.4A
        run: python scripts/verify_v84a.py
      - name: AutoLearn Hotfix Guard v8.4A.1
        run: python scripts/verify_v84a1.py
      - name: Quality Lock Guard v8.5.2
        run: python scripts/verify_v852_quality_lock.py
      - name: Runtime & UI Guard v8.5.3
        run: python scripts/verify_v853_runtime_ui.py
      - name: Match Decision Center Guard v8.7
        run: |
          python scripts/verify_v87_decision_center.py
          node tests/decision_center_smoke.mjs
          node tests/audit_consistency_smoke.mjs
      - name: Accuracy Shadow Guard v8.6
        run: python scripts/verify_v86_accuracy_shadow.py
      - name: AutoLearn Calibration Guard v8.4A.2
        run: python scripts/verify_v84a2.py
      - name: Logic & Stability Guard v8.4B
        run: python scripts/verify_v84b.py
      - name: Model Telemetry Guard v8.4C
        run: python scripts/verify_v84c.py
      - name: Dynamic Weights Guard v8.4D
        run: python scripts/verify_v84d.py
      - name: Dynamic Weights UI Audit Guard v8.4D.1
        run: python scripts/verify_v84d1.py
      - name: Dynamic Weights View Scope Guard v8.4D.2
        run: python scripts/verify_v84d2.py
      - name: Scenario Dynamic Audit Guard v8.4D.3
        run: python scripts/verify_v84d3.py
      - name: Signal Mapping Bridge Guard v8.4D.4
        run: python scripts/verify_v84d4.py
      - name: Game-State Tracking Guard v8.4E1
        run: python scripts/verify_v84e1.py
      - name: Global Match Time Guard v8.4E1.1
        run: python scripts/verify_v84e11.py
      - name: Model Trend Monitor Guard v8.4E2
        run: python scripts/verify_v84e2.py
      - name: Final API quota report v8.3B
        run: python backend/api_quota_v83b.py report
      - name: Integration Guard v8.3D
        run: python scripts/verify_v83d.py
      - name: Compact frontend data v8.5.3
        run: python scripts/compact_frontend_data_v853.py
      - name: Save tennis history + PBP cache
        if: ${{ hashFiles('data/cache/*.csv.gz') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: tennis-history-${{ runner.os }}-${{ hashFiles('data/cache/*.csv.gz') }}-${{ github.run_id }}
      - name: Commit refreshed JSON
        run: |
          git config user.name "tenis-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data
          git diff --cached --quiet || git commit -m "data: refresh tennis analysis"
          for attempt in 1 2 3; do
            git fetch origin
            if git rebase origin/main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort || true
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to publish refreshed data after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
