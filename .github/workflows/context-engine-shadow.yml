name: LOGIC-04 context engine SHADOW

on:
  pull_request:
    paths:
      - 'backend/context_engine_shadow.py'
      - 'tests/test_context_engine_shadow.py'
      - '.github/workflows/context-engine-shadow.yml'
      - 'TENIS_AI_EXECUTION_CHECKLIST.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: backend:.
      LIVE_TENNIS_API_KEY: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install pytest pandas requests
      - name: Unit tests
        run: python -m pytest -q tests/test_context_engine_shadow.py
      - name: Restore latest production tennis cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: logic-04-context-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-
      - name: Require exact local evidence sources
        env:
          MATCHED_CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$MATCHED_CACHE_KEY" || { echo 'No tennis-history Actions cache restored'; exit 21; }
          count=$(find data/cache -maxdepth 1 -type f -name '*.csv.gz' | wc -l)
          echo "restored root CSV cache files: ${count}"
          test "$count" -ge 11 || { echo 'Expected all declared TennisMyLife cache files'; exit 22; }
          test -s frontend/data/results.json || { echo 'Missing current results.json'; exit 23; }
      - name: Run LOGIC-04 SHADOW context engine
        run: python backend/context_engine_shadow.py
      - name: Validate SHADOW context contract and evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/context_engine_shadow.json').read_text(encoding='utf-8'))
          p = report['policy']
          assert p['audit_only'] is True
          assert p['shadow_only'] is True
          assert p['runtime_wiring'] is False
          assert p['predictive_output_generated'] is False
          assert p['model_math_changed'] is False
          assert p['thresholds_changed'] is False
          assert p['weights_changed'] is False
          assert p['training_changed'] is False
          assert p['player_dna_changed'] is False
          assert p['surface_elo_changed'] is False
          assert p['symphony_changed'] is False
          assert p['neuron_changed'] is False
          assert p['playable_changed'] is False
          assert p['settlement_changed'] is False
          assert p['ineed_calculations_changed'] is False
          assert p['live_tennis_api_calls'] == 0
          assert p['production_cache_writes'] == 0
          assert p['fuzzy_matching'] is False
          assert p['manual_aliases'] is False
          assert p['injury_inference'] is False
          assert p['event_level_inference'] is False

          contract = report['contract']
          assert contract['identity_owner_reused'] == 'model._resolve_history_player_key'
          assert contract['history_date_granularity'] == 'day'
          assert contract['same_day_history_policy'] == 'excluded_fail_closed because TML rows do not contain match time'

          summary = report['summary']
          assert summary['visible_matches'] > 0
          assert summary['player_contexts'] == summary['visible_matches'] * 2

          def all_keys(value):
              if isinstance(value, dict):
                  for key, nested in value.items():
                      yield str(key).casefold()
                      yield from all_keys(nested)
              elif isinstance(value, list):
                  for item in value:
                      yield from all_keys(item)

          fixture_keys = list(all_keys(report['fixtures']))
          for forbidden in ('probability', 'prediction', 'injury', 'comeback'):
              assert not any(forbidden in key for key in fixture_keys)

          decision = report['decision']
          assert decision['runtime_promotion_authorized'] is False
          assert decision['model_consumption_authorized'] is False
          assert decision['player_dna_consumption_authorized'] is False
          assert decision['opponent_strength_promotion_authorized'] is False

          print(json.dumps({
              'summary': summary,
              'contract': contract,
              'decision': decision,
          }, indent=2, sort_keys=True))
          PY
      - name: Upload LOGIC-04 evidence
        uses: actions/upload-artifact@v4
        with:
          name: logic-04-context-engine-shadow
          path: artifacts/context_engine_shadow.json
          if-no-files-found: error
