name: Full app health v9.3.2 one-shot repair

on:
  push:
    branches:
      - fix/full-app-health-v932
    paths:
      - 'scripts/repair_full_app_health_v932.py'
      - 'scripts/repair_full_app_health_v932_post.py'
      - '.github/workflows/full-app-health-v932-one-shot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/repair_full_app_health_v932.py'
      - 'scripts/repair_full_app_health_v932_post.py'
      - '.github/workflows/full-app-health-v932-one-shot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-app-health-v932-one-shot
  cancel-in-progress: true

jobs:
  repair:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/full-app-health-v932
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Apply audited source repairs
        run: |
          python scripts/repair_full_app_health_v932.py
          python scripts/repair_full_app_health_v932_post.py

      - name: Syntax guard
        run: |
          python -m py_compile backend/autolearn_v84.py
          python -m py_compile backend/symphony2_engine.py
          python -m py_compile tests/test_symphony2_probability_coherence_v932.py
          python -m py_compile tests/test_full_app_health_v932.py

      - name: Focused regression
        run: |
          python -m pytest -q tests/test_autolearn_v84.py tests/test_symphony2_probability_coherence_v932.py tests/test_full_app_health_v932.py tests/test_fast_pages_workflow.py
          node tests/ui_static_smoke.mjs
          node tests/decision_center_smoke.mjs
          node tests/audit_consistency_smoke.mjs

      - name: Full pytest regression
        run: python -m pytest -q

      - name: Remove one-shot repair machinery
        run: git rm scripts/repair_full_app_health_v932.py scripts/repair_full_app_health_v932_post.py .github/workflows/full-app-health-v932-one-shot.yml

      - name: Commit repaired source
        run: |
          git config user.name "tenis-ai-health-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend frontend tests .github/workflows
          git diff --cached --quiet && { echo 'No final changes produced'; exit 1; }
          git commit -m "fix: full app health v9.3.2"
          git push origin HEAD:fix/full-app-health-v932
