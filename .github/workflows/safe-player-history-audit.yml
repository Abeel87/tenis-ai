name: Safe player history identity audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/provider_identity_evidence.py'
      - 'backend/player_identity.py'
      - 'backend/model.py'
      - 'backend/history_coverage_audit.py'
      - 'tests/test_provider_identity_evidence.py'
      - 'tests/test_player_identity.py'
      - '.github/workflows/safe-player-history-audit.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: safe-player-history-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited ref
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -c requirements.lock

      - name: Full regression before cache audit
        run: python -m pytest -q

      - name: Restore latest tennis history + PBP cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: safe-player-history-audit-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Require real restored identity and history cache
        shell: bash
        env:
          MATCHED_CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [ -z "$MATCHED_CACHE_KEY" ]; then
            echo "::error::No tennis-history Actions cache was restored."
            exit 1
          fi
          test -s data/cache/pbp_v7/players.json || {
            echo "::error::Restored cache has no pbp_v7/players.json."
            exit 1
          }
          if [ -z "$(find data/cache/pbp_v7/matches -maxdepth 1 -type f -name '*.json.gz' -print -quit 2>/dev/null || true)" ]; then
            echo "::error::Restored cache has no cached PBP match payloads."
            exit 1
          fi
          if [ -z "$(find data/cache -maxdepth 1 -type f -name '*.csv.gz' -print -quit 2>/dev/null || true)" ]; then
            echo "::error::Restored cache has no historical CSV inputs."
            exit 1
          fi
          echo "Restored cache: $MATCHED_CACHE_KEY"

      - name: Build zero-network provider identity evidence
        env:
          LIVE_TENNIS_API_KEY: ''
        run: |
          python backend/provider_identity_evidence.py \
            --output artifacts/provider_identity_evidence.json

      - name: Prove audit policy stayed zero-network and fail-closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/provider_identity_evidence.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          policy = report["policy"]
          assert policy["network_calls"] == 0
          assert policy["fuzzy_matching"] is False
          assert policy["similarity_thresholds"] is False
          assert policy["manual_aliases"] is False
          assert policy["provider_namespace"] == "live_tennis_api_only"
          assert policy["fail_closed_on_collision"] is True
          assert report["summary"]["cached_match_payloads_scanned"] > 0
          assert report["summary"]["stable_provider_ids"] > 0
          print(json.dumps(report["summary"], sort_keys=True))
          print(json.dumps(report["potential_case_impact"], sort_keys=True))
          PY

      - name: Upload provider identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: provider-identity-evidence-${{ github.run_id }}
          path: artifacts/provider_identity_evidence.json
          if-no-files-found: error
          retention-days: 7
