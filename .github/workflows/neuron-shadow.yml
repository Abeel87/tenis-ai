name: Neuron SHADOW research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/neuron.py'
      - 'tests/test_neuron.py'
      - 'requirements.txt'
      - 'requirements.lock'
      - '.github/workflows/neuron-shadow.yml'
  schedule:
    - cron: '20 * * * *'
    - cron: '35 3 * * 1,4'
  pull_request:
    branches: [main]
    paths:
      - 'backend/neuron.py'
      - 'tests/test_neuron.py'
      - 'requirements.txt'
      - 'requirements.lock'
      - '.github/workflows/neuron-shadow.yml'
      - 'frontend/neuron-data-bridge.js'
      - 'frontend/index.html'
      - 'frontend/sw.js'
      - 'scripts/runtime_health.py'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: neuron-shadow-research
  cancel-in-progress: false

jobs:
  neuron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -c requirements.lock
      - name: Compile and test rebuilt Neuron
        run: |
          python -m py_compile backend/neuron.py
          python -m pytest -q tests/test_neuron.py
      - name: Hard isolation guard
        run: |
          ! grep -n "neuro_shadow\|symphony2_current.json\|symphony2_history.json\|superbet_playable.py\|ineed_state" backend/neuron.py
          python - <<'PY'
          from backend.neuron import POLICY, flags
          f=flags()
          assert f['mode']=='SHADOW_RESEARCH'
          assert f['production_influence'] is False
          assert f['playable_influence'] is False
          assert f['symphony_influence'] is False
          assert f['ineed_influence'] is False
          assert f['auto_promote'] is False
          assert 'NO_LEGACY_NEURON_OUTPUTS' in POLICY
          PY
      - name: Train from Tenis AI raw history
        if: github.event_name == 'pull_request' || (github.event_name != 'schedule' || github.event.schedule == '35 3 * * 1,4')
        run: python backend/neuron.py train
      - name: Candidate quality gate against pre-match Elo
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('frontend/data/neuron_metrics.json').read_text())
          print(json.dumps({'training':report.get('training'),'validation':report.get('validation'),'test':report.get('test'),'elo_baseline_test':report.get('elo_baseline_test'),'quality_gate':report.get('quality_gate')},indent=2))
          q=report.get('quality_gate') or {}
          assert q.get('beats_elo_log_loss') is True, 'candidate does not beat Elo log-loss OOS'
          assert q.get('beats_elo_accuracy') is True, 'candidate does not beat Elo accuracy OOS'
          assert q.get('ece_le_0_05') is True, 'candidate ECE exceeds 0.05 OOS'
          assert q.get('test_rows_ge_1000') is True, 'candidate test support too small'
          assert q.get('passed') is True, 'candidate quality gate failed'
          PY
      - name: Require trained model before scoring
        if: github.event_name != 'pull_request'
        run: test -s frontend/data/neuron_model.json
      - name: Score current matches in SHADOW only
        if: github.event_name != 'pull_request'
        run: python backend/neuron.py current
      - name: Audit isolation
        if: github.event_name != 'pull_request'
        run: python backend/neuron.py audit
      - name: Publish SHADOW artifacts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "tenis-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/data/neuron_model.json frontend/data/neuron_metrics.json frontend/data/neuron_current.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh rebuilt Neuron SHADOW"
          for attempt in 1 2 3; do
            git fetch origin
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 2))
          done

  deploy-neuron-ui:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: neuron
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout newest main with published Neuron artifacts
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build lazy match delivery
        uses: ./.github/actions/prepare-pages

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          name: neuron-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: neuron-pages-${{ github.run_id }}-${{ github.run_attempt }}
