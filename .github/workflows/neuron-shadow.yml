name: Neuron SHADOW research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/neuron.py'
      - 'tests/test_neuron.py'
      - 'tests/test_neuron_integrity.py'
      - 'tests/test_neuron_publication.py'
      - 'scripts/publish_neuron_shadow.py'
      - 'requirements.txt'
      - 'requirements.lock'
      - '.github/workflows/neuron-shadow.yml'
  schedule:
    - cron: '20 * * * *'
    - cron: '35 3 * * 1,4'
  workflow_run:
    workflows: ['Update tennis data and deploy Pages']
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - 'backend/neuron.py'
      - 'tests/test_neuron.py'
      - 'tests/test_neuron_integrity.py'
      - 'tests/test_neuron_publication.py'
      - 'scripts/publish_neuron_shadow.py'
      - 'requirements.txt'
      - 'requirements.lock'
      - '.github/workflows/neuron-shadow.yml'
      - 'frontend/neuron-data-bridge.js'
      - 'frontend/app.js'
      - 'frontend/index.html'
      - 'frontend/sw.js'
      - 'scripts/runtime_health.py'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: neuron-shadow-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  neuron:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -c requirements.lock
      - name: Compile and test rebuilt Neuron
        run: |
          python -m py_compile backend/neuron.py scripts/publish_neuron_shadow.py
          python -m pytest -q tests/test_neuron.py tests/test_neuron_integrity.py tests/test_neuron_publication.py tests/test_neuron_pages_contract.py
      - name: Hard isolation guard
        run: |
          ! grep -n "neuro_shadow\|symphony2_current.json\|symphony2_history.json\|superbet_playable.py\|ineed_state" backend/neuron.py
          python - <<'PY'
          from backend.neuron import POLICY, flags
          f=flags()
          assert f['mode']=='SHADOW_RESEARCH'
          assert f['production_influence'] is False
          assert f['playable_influence'] is False
          assert f['symphony_influence'] is False
          assert f['ineed_influence'] is False
          assert f['auto_promote'] is False
          assert 'NO_LEGACY_NEURON_OUTPUTS' in POLICY
          PY
      - name: Train from Tenis AI raw history
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '35 3 * * 1,4'
        run: python backend/neuron.py train
      - name: Candidate quality gate against pre-match Elo
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '35 3 * * 1,4'
        run: python backend/neuron.py gate
      - name: Require trained model before scoring
        if: github.event_name != 'pull_request'
        run: test -s frontend/data/neuron_model.json
      - name: Score current matches in SHADOW only
        if: github.event_name != 'pull_request'
        run: python backend/neuron.py current
      - name: Evaluate frozen forecasts using exact canonical outcomes
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.history_publication_chunks import restore
          restore(Path('frontend/data'), filename='history.json')
          PY
          python backend/neuron.py evaluate
      - name: Audit isolation
        if: github.event_name != 'pull_request'
        run: python backend/neuron.py audit
      - name: Publish SHADOW artifacts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "tenis-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          python scripts/publish_neuron_shadow.py
      - name: Preserve training and scoring evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuron-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 60
          if-no-files-found: error
          path: |
            artifacts/neuron/
            frontend/data/neuron_model.json
            frontend/data/neuron_metrics.json
            frontend/data/neuron_current.json
            data/neuron_predictions/

  deploy-neuron-ui:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: neuron
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout newest main with published Neuron artifacts
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build lazy match delivery
        uses: ./.github/actions/prepare-pages

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          name: neuron-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: neuron-pages-${{ github.run_id }}-${{ github.run_attempt }}
