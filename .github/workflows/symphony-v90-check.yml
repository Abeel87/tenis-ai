name: Tennis Symphony v9.0 checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/symphony_engine_v90.py'
      - 'backend/symphony_engine_v90c.py'
      - 'backend/symphony_evidence_v90c.py'
      - 'backend/symphony_c4.py'
      - 'backend/symphony_tracker_v90d.py'
      - 'backend/symphony_leg_learning_v90d.py'
      - 'frontend/symphony-v90.js'
      - 'frontend/symphony-v90.css'
      - 'frontend/symphony-stats-v90d.js'
      - 'frontend/symphony-stats-v90d.css'
      - 'frontend/symphony-surface-v90.js'
      - 'frontend/symphony-surface-v90.css'
      - 'frontend/stats-ranking-v886.js'
      - 'frontend/index.html'
      - 'tests/test_symphony_v90*.py'
      - 'tests/test_symphony_operator_line_guard.py'
      - '.github/workflows/symphony-v90-check.yml'
      - '.github/workflows/update-and-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symphony:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Python syntax
        run: |
          python -m py_compile backend/symphony_engine_v90.py
          python -m py_compile backend/symphony_evidence_v90c.py
          python -m py_compile backend/symphony_c4.py
          python -m py_compile backend/symphony_leg_learning_v90d.py
          python -m py_compile backend/symphony_tracker_v90d.py
          python -m py_compile backend/symphony_engine_v90c.py
      - name: Symphony tests
        run: python -m pytest -q tests/test_symphony_v90.py tests/test_symphony_v90_report.py tests/test_symphony_v90c_evidence.py tests/test_symphony_v90c4.py tests/test_symphony_v90d.py tests/test_symphony_v90_mobile.py tests/test_symphony_v90d_ui.py tests/test_symphony_operator_line_guard.py
      - name: Frontend syntax
        run: |
          node --check frontend/symphony-v90.js
          node --check frontend/symphony-stats-v90d.js
          node --check frontend/symphony-surface-v90.js
          node --check frontend/stats-ranking-v886.js
      - name: Runtime wiring
        run: |
          grep -q 'symphony-v90.css' frontend/index.html
          grep -q 'symphony-v90.js' frontend/index.html
          grep -q 'symphony-surface-v90.js' frontend/index.html
          grep -q 'Tennis Symphony v9.0' .github/workflows/update-and-pages.yml
          grep -q 'symphony_engine_v90c.py' .github/workflows/update-and-pages.yml
          grep -q 'symphony_tracker_v90d.py' .github/workflows/update-and-pages.yml
          grep -q 'symphony-stats-v90d.js' frontend/stats-ranking-v886.js
