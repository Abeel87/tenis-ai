name: Final audit safe patch once

on:
  push:
    branches:
      - audit/final-safe-pass-v923

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/final-safe-pass-v923
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply verified reporting and telemetry fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          p = Path('backend/superbet_playable_v912.py')
          s = p.read_text(encoding='utf-8')
          needle = '    model_ready = sum(1 for m in results if isinstance(m, dict) and m.get("model_ready"))\n'
          insert = needle + '    verified_model_ready = sum(1 for m in results if isinstance(m, dict) and m.get("model_ready") and operator_context_active(m))\n'
          if needle not in s or 'verified_model_ready = sum(' in s:
              raise SystemExit('Unexpected Superbet model_ready anchor state')
          s = s.replace(needle, insert, 1)
          needle = '            "verified_superbet_matches": verified,\n            "verified_match_coverage": round(verified / model_ready, 4) if model_ready else 0.0,\n'
          repl = '            "verified_superbet_matches": verified,\n            "verified_model_ready_matches": verified_model_ready,\n            "verified_match_coverage": round(verified_model_ready / model_ready, 4) if model_ready else 0.0,\n'
          if needle not in s:
              raise SystemExit('Unexpected Superbet coverage payload anchor state')
          p.write_text(s.replace(needle, repl, 1), encoding='utf-8')

          p = Path('backend/symphony_engine_v91.py')
          s = p.read_text(encoding='utf-8')
          needle = 'DEEP_RUNTIME_STATUS = base.core.OUT / "symphony_model_runtime_v93e.json"\n'
          repl = needle + 'DEEP_INCREMENTAL_STATUS = base.core.OUT / "symphony_model_incremental_v93r.json"\nDEEP_PROGRESS_STATUS = base.core.OUT / "symphony_model_progress_v93m.json"\n'
          if needle not in s or 'DEEP_INCREMENTAL_STATUS' in s:
              raise SystemExit('Unexpected deep status constants state')
          s = s.replace(needle, repl, 1)

          old = dedent('''\
          def _write_deep_runtime_status(payload: dict) -> None:
              status = dict(payload)
              status["execution_version"] = DEEP_EXECUTION_VERSION
              status["production_influence"] = False
              status["playable_influence"] = False
              status["prices_used"] = False
              base.core._write(DEEP_RUNTIME_STATUS, status)
          ''')
          new = dedent('''\
          def _mark_deep_terminal(status: str, reason: str | None = None) -> None:
              """Reconcile diagnostics after the parent stops the deep child."""
              for path, replace_status in (
                  (DEEP_INCREMENTAL_STATUS, True),
                  (DEEP_PROGRESS_STATUS, False),
              ):
                  payload = base.core._read(path, {})
                  if not isinstance(payload, dict) or not payload:
                      continue
                  payload = dict(payload)
                  if replace_status:
                      payload.setdefault("child_status_at_termination", payload.get("status"))
                      payload["status"] = status
                  payload["terminal_status"] = status
                  payload["terminal_execution_version"] = DEEP_EXECUTION_VERSION
                  if reason:
                      payload["terminal_reason"] = reason
                  payload["production_influence"] = False
                  payload["playable_influence"] = False
                  payload["prices_used"] = False
                  base.core._write(path, payload)


          def _write_deep_runtime_status(payload: dict) -> None:
              status = dict(payload)
              status["execution_version"] = DEEP_EXECUTION_VERSION
              status["production_influence"] = False
              status["playable_influence"] = False
              status["prices_used"] = False
              base.core._write(DEEP_RUNTIME_STATUS, status)
              terminal = str(status.get("status") or "").upper()
              if terminal in {"TIMEOUT", "ERROR"}:
                  _mark_deep_terminal(terminal, status.get("reason") or status.get("stderr_tail"))
          ''')
          if old not in s:
              raise SystemExit('Deep runtime status function anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          Path('tests/test_final_audit_safe_fixes_v923.py').write_text(dedent('''\
          from backend import superbet_playable_v912 as playable


          def _verified_match(*, model_ready: bool):
              return {"model_ready": model_ready, "superbet_market_v91": {"operator_verified": True, "status": "VERIFIED", "canonical_selections": [], "model_signals": []}}


          def test_superbet_verified_match_coverage_uses_model_ready_intersection():
              results = [_verified_match(model_ready=True), _verified_match(model_ready=False), {"model_ready": True}]
              current = playable._playable_stats([], results, {}, {})["current"]
              assert current["model_ready_matches"] == 2
              assert current["verified_superbet_matches"] == 2
              assert current["verified_model_ready_matches"] == 1
              assert current["verified_match_coverage"] == 0.5
              assert 0.0 <= current["verified_match_coverage"] <= 1.0
          '''), encoding='utf-8')

          p = Path('tests/test_symphony_v93e_watchdog.py')
          t = p.read_text(encoding='utf-8')
          old_assert = '    assert written[-1][0] == engine.DEEP_RUNTIME_STATUS\n    assert written[-1][1]["execution_version"] == engine.DEEP_EXECUTION_VERSION\n'
          new_assert = '    runtime_payload = next(payload for path, payload in written if path == engine.DEEP_RUNTIME_STATUS)\n    assert runtime_payload["execution_version"] == engine.DEEP_EXECUTION_VERSION\n'
          if old_assert not in t:
              raise SystemExit('Watchdog timeout assertion anchor not found')
          t = t.replace(old_assert, new_assert, 1)
          if 'test_terminal_telemetry_reconciles_stale_running_state' not in t:
              t += dedent('''\


          def test_terminal_telemetry_reconciles_stale_running_state(monkeypatch):
              writes = []
              payloads = {
                  engine.DEEP_INCREMENTAL_STATUS: {"status": "RUNNING", "completed_this_run": 37, "pending_entries": 70},
                  engine.DEEP_PROGRESS_STATUS: {"stage": "OUTCOME_LATTICE_DONE", "completed_matches": 37},
              }
              monkeypatch.setattr(engine.base.core, "_read", lambda path, default=None: dict(payloads.get(path, default or {})))
              monkeypatch.setattr(engine.base.core, "_write", lambda path, payload: writes.append((path, dict(payload))))
              engine._mark_deep_terminal("TIMEOUT", "DEEP_MODEL_RAW_EXCEEDED_WALL_CLOCK_BOUND")
              by_path = {path: payload for path, payload in writes}
              inc = by_path[engine.DEEP_INCREMENTAL_STATUS]
              progress = by_path[engine.DEEP_PROGRESS_STATUS]
              assert inc["status"] == "TIMEOUT"
              assert inc["child_status_at_termination"] == "RUNNING"
              assert inc["completed_this_run"] == 37 and inc["pending_entries"] == 70
              assert progress["stage"] == "OUTCOME_LATTICE_DONE"
              assert progress["terminal_status"] == "TIMEOUT"
              assert progress["completed_matches"] == 37
              assert inc["prices_used"] is False and progress["prices_used"] is False
          ''')
          p.write_text(t, encoding='utf-8')
          PY
          python -m py_compile backend/superbet_playable_v912.py backend/symphony_engine_v91.py
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_final_audit_safe_fixes_v923.py tests/test_symphony_v93e_watchdog.py
          rm .github/workflows/final-audit-safe-patch-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: fix coverage denominator and deep terminal telemetry'
          git push origin HEAD:audit/final-safe-pass-v923
