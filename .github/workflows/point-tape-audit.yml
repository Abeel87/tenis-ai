name: Point Tape Schema Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/point_tape_schema.py'
      - 'backend/point_tape_audit.py'
      - 'tests/test_point_tape_schema.py'
      - '.github/workflows/point-tape-audit.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Restore tennis history + PBP cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tennis-history-${{ runner.os }}-point-tape-audit-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Point tape schema unit tests
        run: python -m pytest -q tests/test_point_tape_schema.py

      - name: Audit cached PBP tapes (zero network)
        run: python backend/point_tape_audit.py

      - name: Require real cached tapes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('frontend/data/point_tape_schema_audit.json')
          if not p.exists():
              raise SystemExit('point_tape_schema_audit.json was not generated')
          report = json.loads(p.read_text(encoding='utf-8'))
          matches = int(report.get('matches') or 0)
          rows = int(report.get('rows') or 0)
          print(f'matches={matches} rows={rows}')
          if matches <= 0 or rows <= 0:
              raise SystemExit('No real cached PBP tapes were available on this runner')
          PY

      - name: Upload point tape audit report
        uses: actions/upload-artifact@v4
        with:
          name: point-tape-schema-audit
          path: frontend/data/point_tape_schema_audit.json
          if-no-files-found: error
          retention-days: 14
