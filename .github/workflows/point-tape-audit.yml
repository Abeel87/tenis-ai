name: Point Tape Schema Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/point_tape_schema.py'
      - 'backend/point_tape_audit.py'
      - 'backend/point_transition_audit.py'
      - 'backend/atomic_point_transition.py'
      - 'backend/canonical_point_event.py'
      - 'backend/player_dna_point_dataset.py'
      - 'backend/player_dna_match_metadata_audit.py'
      - 'backend/player_dna_match_context.py'
      - 'backend/player_dna_context_time_audit.py'
      - 'backend/player_dna_ordering_authority_audit.py'
      - 'backend/player_dna_profile_readiness.py'
      - 'backend/player_dna_service_split_source_readiness.py'
      - 'backend/player_dna_pbp_service_split_readiness.py'
      - 'backend/player_dna_match_state_readiness.py'
      - 'backend/player_dna_match_state_profiles.py'
      - 'backend/player_dna_match_state_challenger.py'
      - 'backend/player_dna_shadow_profiles.py'
      - 'backend/player_dna_matchup_readiness_audit.py'
      - 'backend/player_dna_matchup_challenger.py'
      - 'backend/player_dna_matchup_engine.py'
      - 'backend/player_dna_point_probability_engine.py'
      - 'backend/player_dna_opponent_context_audit.py'
      - 'backend/player_dna_opponent_adjustment_audit.py'
      - 'backend/player_dna_pressure_challenger.py'
      - 'backend/player_dna_tiebreak_challenger.py'
      - 'backend/player_dna_recent_form_challenger.py'
      - 'backend/player_dna_point_scorer.py'
      - 'backend/player_dna_current_shadow.py'
      - 'backend/player_dna_current_dynamic_shadow.py'
      - 'backend/player_dna_tennis_simulator.py'
      - 'backend/player_dna_tennis_state_engine.py'
      - 'backend/player_dna_market_backtest.py'
      - 'backend/player_dna_market_walk_forward.py'
      - 'backend/player_dna_hold_calibration.py'
      - 'backend/player_dna_hold_walk_forward.py'
      - 'backend/player_dna_prospective_validation.py'
      - 'backend/player_identity_audit.py'
      - 'backend/player_identity.py'
      - 'tests/test_point_tape_schema.py'
      - 'tests/test_point_transition_audit.py'
      - 'tests/test_atomic_point_transition.py'
      - 'tests/test_canonical_point_event.py'
      - 'tests/test_player_dna_point_dataset.py'
      - 'tests/test_player_dna_match_metadata_audit.py'
      - 'tests/test_player_dna_match_context.py'
      - 'tests/test_player_dna_context_time_audit.py'
      - 'tests/test_player_dna_ordering_authority_audit.py'
      - 'tests/test_player_dna_profile_readiness.py'
      - 'tests/test_player_dna_service_split_source_readiness.py'
      - 'tests/test_player_dna_pbp_service_split_readiness.py'
      - 'tests/test_player_dna_match_state_readiness.py'
      - 'tests/test_player_dna_match_state_profiles.py'
      - 'tests/test_player_dna_match_state_challenger.py'
      - 'tests/test_player_dna_shadow_profiles.py'
      - 'tests/test_player_dna_matchup_readiness_audit.py'
      - 'tests/test_player_dna_matchup_challenger.py'
      - 'tests/test_player_dna_matchup_engine.py'
      - 'tests/test_player_dna_point_probability_engine.py'
      - 'tests/test_player_dna_opponent_context_audit.py'
      - 'tests/test_player_dna_opponent_adjustment_audit.py'
      - 'tests/test_player_dna_pressure_challenger.py'
      - 'tests/test_player_dna_tiebreak_challenger.py'
      - 'tests/test_player_dna_recent_form_challenger.py'
      - 'tests/test_player_dna_point_scorer.py'
      - 'tests/test_player_dna_current_shadow.py'
      - 'tests/test_player_dna_current_dynamic_shadow.py'
      - 'tests/test_player_dna_tennis_simulator.py'
      - 'tests/test_player_dna_tennis_state_engine.py'
      - 'tests/test_player_dna_market_backtest.py'
      - 'tests/test_player_dna_market_walk_forward.py'
      - 'tests/test_player_dna_hold_calibration.py'
      - 'tests/test_player_dna_hold_walk_forward.py'
      - 'tests/test_player_dna_prospective_validation.py'
      - 'tests/test_player_identity.py'
      - '.github/workflows/point-tape-audit.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Restore tennis history + PBP cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tennis-history-${{ runner.os }}-point-tape-audit-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Point tape + atomic validator + Player DNA identity/context tests
        run: python -m pytest -q tests/test_point_tape_schema.py tests/test_point_transition_audit.py tests/test_atomic_point_transition.py tests/test_canonical_point_event.py tests/test_player_dna_point_dataset.py tests/test_player_dna_match_metadata_audit.py tests/test_player_dna_match_context.py tests/test_player_dna_context_time_audit.py tests/test_player_dna_ordering_authority_audit.py tests/test_player_dna_profile_readiness.py tests/test_player_dna_service_split_source_readiness.py tests/test_player_dna_pbp_service_split_readiness.py tests/test_player_dna_match_state_readiness.py tests/test_player_dna_match_state_profiles.py tests/test_player_dna_match_state_challenger.py tests/test_player_dna_shadow_profiles.py tests/test_player_dna_matchup_readiness_audit.py tests/test_player_dna_matchup_challenger.py tests/test_player_dna_matchup_engine.py tests/test_player_dna_point_probability_engine.py tests/test_player_dna_opponent_context_audit.py tests/test_player_dna_opponent_adjustment_audit.py tests/test_player_dna_pressure_challenger.py tests/test_player_dna_tiebreak_challenger.py tests/test_player_dna_recent_form_challenger.py tests/test_player_dna_point_scorer.py tests/test_player_dna_current_shadow.py tests/test_player_dna_current_dynamic_shadow.py tests/test_player_dna_tennis_simulator.py tests/test_player_dna_tennis_state_engine.py tests/test_player_dna_market_backtest.py tests/test_player_dna_market_walk_forward.py tests/test_player_dna_hold_calibration.py tests/test_player_dna_hold_walk_forward.py tests/test_player_dna_prospective_validation.py tests/test_player_identity.py

      - name: Audit cached PBP fields (zero network)
        run: python backend/point_tape_audit.py

      - name: Audit cached PBP transition semantics (zero network)
        run: python backend/point_transition_audit.py

      - name: Build shadow Player DNA point dataset (zero network)
        run: python backend/player_dna_point_dataset.py

      - name: Audit stable player identity candidates (zero network)
        run: python backend/player_identity_audit.py

      - name: Audit Player DNA match metadata paths (zero network)
        run: python backend/player_dna_match_metadata_audit.py

      - name: Audit Player DNA context distributions + time ordering (zero network)
        run: python backend/player_dna_context_time_audit.py

      - name: Audit Player DNA ordering authority (zero network)
        run: python backend/player_dna_ordering_authority_audit.py

      - name: Audit Player DNA historical profile readiness (zero network)
        run: python backend/player_dna_profile_readiness.py

      - name: Audit Player DNA service-split source readiness (SHADOW, zero network)
        run: python backend/player_dna_service_split_source_readiness.py

      - name: Guard service-split source audit isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('frontend/data/player_dna_service_split_source_readiness.json')
          if not p.exists():
              raise SystemExit('player_dna_service_split_source_readiness.json was not generated')
          report = json.loads(p.read_text(encoding='utf-8'))

          if report.get('mode') != 'SHADOW_SOURCE_READINESS_AUDIT_ONLY':
              raise SystemExit('Service-split source audit mode invalid')
          if report.get('gate') != 'AUDIT_ONLY_NO_PROFILE_BUILD':
              raise SystemExit('Service-split source audit crossed profile-build gate')

          for key in (
              'production_influence',
              'runtime_scoring_enabled',
              'profile_build_enabled',
              'training_join_enabled',
              'symphony2_influence',
              'superbet_playable_influence',
          ):
              if report.get(key) is not False:
                  raise SystemExit(f'Service-split source isolation violation: {key}')

          contract = report.get('contract') or {}
          for key in (
              'source_readiness_only',
              'stable_provider_ids_required',
              'day_precision_same_day_must_be_excluded',
              'no_name_or_fuzzy_identity_for_canonical_profiles',
              'return_split_derivation_uses_only_opponent_match_serve_counts',
              'no_profile_values_published',
              'no_model_fit',
              'no_threshold_tuning',
              'coverage_is_not_predictive_signal',
              'cross_source_numeric_id_namespace_must_be_proven_before_join',
          ):
              if contract.get(key) is not True:
                  raise SystemExit(f'Service-split source contract violation: {key}')

          if int(report.get('rows') or 0) <= 0:
              raise SystemExit('Service-split source audit found no historical rows')
          identity = report.get('identity_time_coverage') or {}
          if int(identity.get('canonical_identity_time_rows') or 0) <= 0:
              raise SystemExit('Service-split source audit found no stable-ID dated rows')

          readiness = report.get('derived_matchup_source_readiness') or {}
          for key in (
              'first_serve_vs_first_return',
              'second_serve_vs_second_return',
              'ace_tendency',
              'double_fault_tendency',
              'ace_vs_contact_return',
              'double_fault_vs_return_pressure',
          ):
              if key not in readiness:
                  raise SystemExit(f'Service-split readiness family missing: {key}')

          if (readiness.get('ace_vs_contact_return') or {}).get('source_ready') is not False:
              raise SystemExit('Contact-return source was promoted without direct evidence')
          if (readiness.get('double_fault_vs_return_pressure') or {}).get('source_ready') is not False:
              raise SystemExit('Return-pressure source was promoted without direct evidence')

          namespace = report.get('identity_namespace_audit') or {}
          for key in (
              'historical_unique_stable_ids',
              'pbp_unique_stable_ids',
              'shared_numeric_ids',
              'shared_ids_with_exact_normalized_name_agreement',
              'shared_ids_with_name_mismatch',
              'exact_normalized_name_agreement_rate',
              'id_namespace_evidence_strong',
              'direct_id_join_authorized',
          ):
              if key not in namespace:
                  raise SystemExit(f'ID namespace audit field missing: {key}')
          if namespace.get('diagnostic_name_matching_only') is not True:
              raise SystemExit('ID namespace audit allowed names beyond diagnostics')
          if namespace.get('name_matching_used_for_join') is not False:
              raise SystemExit('ID namespace audit used names to create a join')
          if namespace.get('fuzzy_matching_used') is not False:
              raise SystemExit('ID namespace audit used fuzzy matching')
          if namespace.get('direct_id_join_authorized') is not False:
              raise SystemExit('ID namespace audit auto-authorized profile join')

          print(
              'Service-split source readiness: '
              f"rows={report.get('rows')} "
              f"canonical={identity.get('canonical_identity_time_rows')} "
              f"first={(readiness.get('first_serve_vs_first_return') or {}).get('canonical_match_rows')} "
              f"second={(readiness.get('second_serve_vs_second_return') or {}).get('canonical_match_rows')} "
              f"hist_ids={namespace.get('historical_unique_stable_ids')} "
              f"pbp_ids={namespace.get('pbp_unique_stable_ids')} "
              f"shared_ids={namespace.get('shared_numeric_ids')} "
              f"name_agreement={namespace.get('exact_normalized_name_agreement_rate')} "
              f"namespace_strong={namespace.get('id_namespace_evidence_strong')}"
          )
          PY

      - name: Audit PBP-native first/second serve-return split readiness (SHADOW, zero network)
        run: python backend/player_dna_pbp_service_split_readiness.py

      - name: Guard PBP-native service-split audit isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('frontend/data/player_dna_pbp_service_split_readiness.json')
          if not p.exists():
              raise SystemExit('player_dna_pbp_service_split_readiness.json was not generated')
          report = json.loads(p.read_text(encoding='utf-8'))

          if report.get('mode') != 'SHADOW_PBP_SERVICE_SPLIT_READINESS_AUDIT_ONLY':
              raise SystemExit('PBP-native service-split audit mode invalid')
          if report.get('gate') != 'AUDIT_ONLY_NO_PROFILE_BUILD':
              raise SystemExit('PBP-native service-split audit crossed profile-build gate')

          for key in (
              'production_influence',
              'runtime_scoring_enabled',
              'profile_build_enabled',
              'training_join_enabled',
              'matchup_feature_activation_enabled',
              'symphony2_influence',
              'superbet_playable_influence',
          ):
              if report.get(key) is not False:
                  raise SystemExit(f'PBP-native split isolation violation: {key}')

          contract = report.get('contract') or {}
          for key in (
              'pbp_native_provider_ids_only',
              'historical_csv_id_namespace_not_used',
              'name_or_fuzzy_join_forbidden',
              'latest_stats_profile_selected_without_future_target_context',
              'terminal_snapshot_requires_same_sets_and_games_as_final_tape',
              'raw_ratio_preferred_over_rounded_derived_rate',
              'coverage_is_not_predictive_signal',
              'profile_build_requires_separate_gate',
              'chronological_backtest_required_after_profile_gate',
          ):
              if contract.get(key) is not True:
                  raise SystemExit(f'PBP-native split contract violation: {key}')

          readiness = report.get('readiness') or {}
          if readiness.get('stable_pbp_provider_ids_same_namespace_as_player_dna') is not True:
              raise SystemExit('PBP-native split lost canonical Player DNA ID namespace')
          if readiness.get('cross_source_id_join_required') is not False:
              raise SystemExit('PBP-native split unexpectedly requires cross-source ID join')
          if readiness.get('predictive_signal_proven') is not False:
              raise SystemExit('PBP-native readiness audit claimed predictive signal')

          if int(report.get('matches_seen') or 0) <= 0:
              raise SystemExit('PBP-native split audit found no restored matches')
          if int(report.get('stable_identity_matches') or 0) <= 0:
              raise SystemExit('PBP-native split audit found no stable identities')

          consistency = report.get('raw_vs_derived_consistency') or {}
          for key in (
              'checks',
              'agreements_within_2pp',
              'agreement_rate',
              'semantic_consistency_gate_passed',
          ):
              if key not in consistency:
                  raise SystemExit(f'PBP-native consistency field missing: {key}')

          print(
              'PBP-native service-split readiness: '
              f"matches={report.get('matches_seen')} "
              f"stable={report.get('stable_identity_matches')} "
              f"stats={report.get('matches_with_stats_profile')} "
              f"all4={report.get('matches_with_all_four_splits_both_players')} "
              f"terminal_all4={report.get('terminal_matches_with_all_four_splits')} "
              f"checks={consistency.get('checks')} "
              f"agreement={consistency.get('agreement_rate')} "
              f"source_ready={readiness.get('source_ready_for_canonical_profile_design')}"
          )
          PY

      - name: Audit comeback + BO5 stamina match-state readiness (SHADOW, zero network)
        run: python backend/player_dna_match_state_readiness.py

      - name: Guard comeback + BO5 stamina readiness isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('frontend/data/player_dna_match_state_readiness.json')
          if not p.exists():
              raise SystemExit('player_dna_match_state_readiness.json was not generated')
          report = json.loads(p.read_text(encoding='utf-8'))

          if report.get('mode') != 'SHADOW_MATCH_STATE_READINESS_AUDIT_ONLY':
              raise SystemExit('Match-state readiness mode invalid')
          if report.get('gate') != 'AUDIT_ONLY_NO_PROFILE_BUILD':
              raise SystemExit('Match-state readiness crossed profile-build gate')
          if int(report.get('network_calls') or 0) != 0:
              raise SystemExit('Match-state readiness unexpectedly used network')

          for key in (
              'production_influence',
              'runtime_scoring_enabled',
              'profile_build_enabled',
              'training_join_enabled',
              'simulator_callback_activation_enabled',
              'symphony2_influence',
              'superbet_playable_influence',
          ):
              if report.get(key) is not False:
                  raise SystemExit(f'Match-state readiness isolation violation: {key}')

          contract = report.get('contract') or {}
          for key in (
              'pbp_native_provider_ids_only',
              'historical_csv_id_namespace_not_used',
              'name_or_fuzzy_join_forbidden',
              'provider_format_bo3_or_bo5_required',
              'provider_status_completed_required',
              'provider_outcome_completed_required',
              'provider_withdrawal_or_retirement_rejected',
              'provider_winner_required',
              'provider_match_score_must_match_final_tape_score',
              'provider_winner_must_match_terminal_set_score',
              'terminal_stats_snapshot_not_required_for_match_state_semantics',
              'legal_completed_match_score_required',
              'full_set_winner_sequence_from_zero_required',
              'atomic_plus_one_set_transitions_only',
              'retirement_or_incomplete_scores_rejected',
              'comeback_means_match_win_after_observed_first_set_loss',
              'bo5_stamina_evidence_uses_only_exact_completed_bo5',
              'profile_build_requires_separate_gate',
              'chronological_backtest_required_after_profile_gate',
          ):
              if contract.get(key) is not True:
                  raise SystemExit(f'Match-state readiness contract violation: {key}')

          if int(report.get('matches_seen') or 0) <= 0:
              raise SystemExit('Match-state readiness found no restored PBP matches')
          if int(report.get('matches_with_exact_set_sequence') or 0) <= 0:
              raise SystemExit('Match-state readiness found no exact set-order proof')

          comeback = report.get('comeback_readiness') or {}
          stamina = report.get('bo5_stamina_readiness') or {}
          if comeback.get('profile_build_enabled') is not False:
              raise SystemExit('Comeback profile was activated by readiness audit')
          if comeback.get('predictive_signal_proven') is not False:
              raise SystemExit('Comeback readiness claimed predictive signal')
          if stamina.get('profile_build_enabled') is not False:
              raise SystemExit('BO5 stamina profile was activated by readiness audit')
          if stamina.get('predictive_signal_proven') is not False:
              raise SystemExit('BO5 stamina readiness claimed predictive signal')

          print(
              'Match-state readiness: '
              f"matches={report.get('matches_seen')} "
              f"completed={report.get('provider_completed_matches')} "
              f"terminal={report.get('matches_with_terminal_score_proof')} "
              f"exact_sequences={report.get('matches_with_exact_set_sequence')} "
              f"comeback_exposures={comeback.get('first_set_loss_player_exposures')} "
              f"comebacks={comeback.get('comeback_wins_after_first_set_loss')} "
              f"bo5={stamina.get('exact_bo5_matches')} "
              f"bo5_late={stamina.get('late_set_player_exposures')} "
              f"comeback_design={(report.get('readiness') or {}).get('comeback_profile_design_sample_available')} "
              f"stamina_design={(report.get('readiness') or {}).get('bo5_stamina_profile_design_sample_available')}"
          )
          PY

      - name: Build strict-as-of comeback + BO5 match-state profiles (SHADOW, zero network)
        run: python backend/player_dna_match_state_profiles.py

      - name: Guard comeback + BO5 match-state profile isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('frontend/data/player_dna_match_state_profile_summary.json')
          if not p.exists():
              raise SystemExit('player_dna_match_state_profile_summary.json was not generated')
          report = json.loads(p.read_text(encoding='utf-8'))

          if report.get('mode') != 'SHADOW_MATCH_STATE_AS_OF_PROFILE':
              raise SystemExit('Match-state profile mode invalid')
          if int(report.get('network_calls') or 0) != 0:
              raise SystemExit('Match-state profile build unexpectedly used network')
          if report.get('same_time_matches_count_as_prior') is not False:
              raise SystemExit('Match-state profiles leaked same-time matches')

          for key in (
              'production_influence',
              'runtime_scoring_enabled',
              'training_join_enabled',
              'canonical_point_scorer_feature_activation_enabled',
              'simulator_callback_activation_enabled',
              'symphony2_influence',
              'superbet_playable_influence',
          ):
              if report.get(key) is not False:
                  raise SystemExit(f'Match-state profile isolation violation: {key}')

          contract = report.get('contract') or {}
          for key in (
              'provider_terminal_exact_set_order_source_only',
              'stable_provider_ids_only',
              'historical_csv_id_namespace_not_used',
              'name_or_fuzzy_join_forbidden',
              'strictly_prior_matches_only',
              'same_timestamp_matches_never_count_as_prior',
              'raw_support_counts_accompany_every_rate',
              'comeback_is_observed_match_win_after_first_set_loss',
              'front_runner_conversion_is_observed_match_win_after_first_set_win',
              'bo5_late_sets_start_at_set_three',
              'bo5_deciding_set_means_set_five_only',
              'bo5_late_set_rate_is_descriptive_proxy_not_validated_stamina',
              'no_shrinkage_or_partial_pooling_applied',
              'no_profile_threshold_activation',
              'predictive_signal_not_yet_proven',
              'chronological_challenger_required_before_feature_activation',
          ):
              if contract.get(key) is not True:
                  raise SystemExit(f'Match-state profile contract violation: {key}')

          counts = report.get('source_counts') or {}
          source_matches = int(counts.get('usable_exact_source_matches') or 0)
          snapshots = int(report.get('player_match_snapshots') or 0)
          if source_matches <= 0:
              raise SystemExit('Match-state profile build found no exact source matches')
          if snapshots != 2 * source_matches:
              raise SystemExit(
                  f'Match-state profile snapshot accounting drift: '
                  f'{snapshots} != 2*{source_matches}'
              )

          readiness = report.get('readiness') or {}
          for family in (
              'comeback_overall',
              'comeback_same_surface',
              'bo5_late_set_overall',
              'bo5_late_set_same_surface',
              'bo5_deciding_set_overall',
          ):
              item = readiness.get(family) or {}
              if set(item) != {'1', '3', '5', '10'}:
                  raise SystemExit(f'Match-state readiness thresholds drifted: {family}')

          features = report.get('features') or {}
          overall = set(features.get('overall_prior') or [])
          for key in (
              'first_set_loss_exposures',
              'comeback_wins_after_first_set_loss',
              'comeback_rate_after_first_set_loss',
              'first_set_win_exposures',
              'match_wins_after_first_set_win',
              'front_runner_conversion_rate',
              'bo5_matches',
              'bo5_late_set_exposures',
              'bo5_late_set_wins',
              'bo5_late_set_win_rate',
              'bo5_deciding_set_exposures',
              'bo5_deciding_set_wins',
              'bo5_deciding_set_win_rate',
          ):
              if key not in overall:
                  raise SystemExit(f'Match-state profile field missing: {key}')

          print(
              'Match-state profiles: '
              f"source={source_matches} snapshots={snapshots} "
              f"players={report.get('players')} "
              f"comeback@1={(readiness.get('comeback_overall') or {}).get('1')} "
              f"comeback@3={(readiness.get('comeback_overall') or {}).get('3')} "
              f"bo5late@1={(readiness.get('bo5_late_set_overall') or {}).get('1')} "
