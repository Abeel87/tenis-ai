          simulation = json.loads(p.read_text(encoding='utf-8'))
          if simulation.get('mode') != 'SHADOW_SIMULATION_ONLY':
              raise SystemExit('Player DNA tennis simulator must remain SHADOW-only')
          if simulation.get('production_influence') is not False:
              raise SystemExit('Player DNA tennis simulator must have zero PROD influence')
          if simulation.get('symphony2_influence') is not False:
              raise SystemExit('Player DNA tennis simulator must have zero Symfonia 2.0 influence')
          if simulation.get('superbet_playable_influence') is not False:
              raise SystemExit('Player DNA tennis simulator must have zero PLAYABLE influence')
          if simulation.get('match_level_validation_required') is not True:
              raise SystemExit('Player DNA match-level outputs must remain explicitly unvalidated')
          if simulation.get('auto_promote') is not False:
              raise SystemExit('Player DNA simulator cannot auto-promote')
          if int(simulation.get('source_scored_matches') or 0) != scored:
              raise SystemExit('Player DNA simulator source/current scored count mismatch')
          if int(simulation.get('simulated_matches') or 0) != scored:
              raise SystemExit('Player DNA simulator did not simulate every SHADOW-scored match')
          expected_candidate = calibration.get('signal') == 'HOLD_CALIBRATION_PROMISING_SHADOW'
          if simulation.get('hold_calibration_candidate_enabled') is not expected_candidate:
              raise SystemExit('Player DNA calibrated candidate enablement disagrees with calibration gate')
          expected_candidate_count = scored if expected_candidate else 0
          if int(simulation.get('calibrated_candidate_matches') or 0) != expected_candidate_count:
              raise SystemExit('Player DNA calibrated candidate count mismatch')
          source_cal = simulation.get('hold_calibration_source') or {}
          if source_cal.get('signal') != calibration.get('signal'):
              raise SystemExit('Player DNA simulator calibration source signal mismatch')
          policy = simulation.get('market_policy') or {}
          if policy.get('raw_iid_remains_reference') is not True or policy.get('hold_calibrated_is_candidate_only') is not True:
              raise SystemExit('Player DNA calibrated simulator must remain additive/reference-only')
          if policy.get('winner_markets') != 'NO_AUTOMATIC_SWITCH':
              raise SystemExit('Player DNA winner markets cannot auto-switch to calibrated track')
          for row in simulation.get('matches') or []:
              if row.get('validation_status') != 'UNVALIDATED_MATCH_LEVEL':
                  raise SystemExit('Player DNA simulated match lost UNVALIDATED_MATCH_LEVEL status')
              sim = row.get('simulation') or {}
              first_set = sim.get('first_set') or {}
              match = sim.get('match') or {}
              trajectory = sim.get('trajectory') or {}
              if trajectory.get('status') != 'SHADOW_TRAJECTORY_FOUNDATION':
                  raise SystemExit('Player DNA trajectory foundation missing')
              if trajectory.get('validation_status') != 'UNVALIDATED_MATCH_LEVEL':
                  raise SystemExit('Player DNA trajectory lost unvalidated status')
              tcontract = trajectory.get('contract') or {}
              for key in ('production_influence', 'symphony2_influence', 'superbet_playable_influence'):
                  if tcontract.get(key) is not False:
                      raise SystemExit(f'Player DNA trajectory leaked influence: {key}')
              if tcontract.get('not_a_single_certain_script') is not True:
                  raise SystemExit('Player DNA trajectory must remain ranked scenarios, not a certain script')
              if tcontract.get('ranked_paths_are_exact_within_known_start_server_condition') is not True:
                  raise SystemExit('Player DNA trajectory path-ranking contract drift')
              checkpoints = trajectory.get('checkpoints_neutral_start_server') or {}
              for checkpoint in ('after_2_games', 'after_4_games', 'after_6_games'):
                  rows_cp = checkpoints.get(checkpoint) or []
                  if not rows_cp or abs(sum(float(item.get('probability') or 0) for item in rows_cp) - 1.0) > 1e-9:
                      raise SystemExit(f'Player DNA trajectory checkpoint probability mass drift: {checkpoint}')
              conditioned = trajectory.get('serve_order_conditioned') or {}
              for key in ('p1_serves_first', 'p2_serves_first'):
                  branch = conditioned.get(key) or {}
                  if not branch.get('first_set_top_game_paths') or not branch.get('match_top_set_paths'):
                      raise SystemExit(f'Player DNA trajectory ranked paths missing: {key}')
                  full_paths = branch.get('full_match_top_game_paths') or []
                  if not full_paths or len(full_paths) > 4:
                      raise SystemExit(f'Player DNA full-match game paths missing/oversized: {key}')
                  if full_paths != sorted(full_paths, key=lambda item: float(item.get('probability') or 0), reverse=True):
                      raise SystemExit(f'Player DNA full-match game paths not ranked: {key}')
                  for full_path in full_paths:
                      sets = full_path.get('sets') or []
                      if int(full_path.get('sets_played') or 0) != len(sets):
                          raise SystemExit('Player DNA full-match set-count drift')
                      if int(full_path.get('total_games') or 0) != sum(len(item.get('progression') or []) for item in sets):
                          raise SystemExit('Player DNA full-match game-count drift')
                      for set_path in sets:
                          progression = set_path.get('progression') or []
                          if not progression or progression[-1] != set_path.get('score'):
                              raise SystemExit('Player DNA full-match set progression terminal score drift')
                          if set_path.get('tiebreak') is True and progression.count('6:6') != 1:
                              raise SystemExit('Player DNA tiebreak progression must contain exactly one 6:6 checkpoint')
              if abs(float(first_set.get('p1_win') or 0) + float(first_set.get('p2_win') or 0) - 1.0) > 1e-9:
                  raise SystemExit('Player DNA first-set winner probability mass drift')
              if abs(sum(float(v) for v in (first_set.get('exact_score') or {}).values()) - 1.0) > 1e-9:
                  raise SystemExit('Player DNA first-set exact-score probability mass drift')
              if abs(sum(float(v) for v in (first_set.get('games_distribution') or {}).values()) - 1.0) > 1e-9:
                  raise SystemExit('Player DNA first-set games probability mass drift')
              if abs(float(match.get('p1_win') or 0) + float(match.get('p2_win') or 0) - 1.0) > 1e-9:
                  raise SystemExit('Player DNA match winner probability mass drift')
              if abs(sum(float(v) for v in (match.get('exact_score') or {}).values()) - 1.0) > 1e-9:
                  raise SystemExit('Player DNA exact-match-score probability mass drift')
              if abs(sum(float(v) for v in (match.get('total_sets') or {}).values()) - 1.0) > 1e-9:
                  raise SystemExit('Player DNA total-sets probability mass drift')
              candidate = row.get('hold_calibrated_candidate')
              if expected_candidate:
                  if not isinstance(candidate, dict):
                      raise SystemExit('Player DNA calibrated candidate missing despite positive calibration gate')
                  if candidate.get('mode') != 'SHADOW_HOLD_CALIBRATED_CANDIDATE':
                      raise SystemExit('Player DNA calibrated candidate mode invalid')
                  if candidate.get('validation_status') != 'BACKTESTED_HOLD_CALIBRATION_CANDIDATE':
                      raise SystemExit('Player DNA calibrated candidate validation status invalid')
                  for key in ('production_influence', 'symphony2_influence', 'superbet_playable_influence', 'auto_promote'):
                      if candidate.get(key) is not False:
                          raise SystemExit(f'Player DNA calibrated candidate leaked influence: {key}')
                  cfirst = candidate.get('first_set') or {}
                  cmatch = candidate.get('match') or {}
                  ctraj = candidate.get('trajectory') or {}
                  if ctraj.get('status') != 'SHADOW_TRAJECTORY_FOUNDATION':
                      raise SystemExit('Player DNA calibrated trajectory foundation missing')
                  ccontract = ctraj.get('contract') or {}
                  if ccontract.get('production_influence') is not False:
                      raise SystemExit('Player DNA calibrated trajectory leaked PROD influence')
                  if ccontract.get('full_match_game_paths_are_exact_for_known_start_server') is not True:
                      raise SystemExit('Player DNA calibrated full-match path contract drift')
                  if not all((branch or {}).get('full_match_top_game_paths') for branch in (ctraj.get('serve_order_conditioned') or {}).values()):
                      raise SystemExit('Player DNA calibrated full-match game paths missing')
                  if abs(float(cfirst.get('p1_win') or 0) + float(cfirst.get('p2_win') or 0) - 1.0) > 1e-9:
                      raise SystemExit('Player DNA calibrated first-set winner probability mass drift')
                  if abs(sum(float(v) for v in (cfirst.get('exact_score') or {}).values()) - 1.0) > 1e-9:
                      raise SystemExit('Player DNA calibrated first-set exact-score probability mass drift')
                  if abs(sum(float(v) for v in (cmatch.get('exact_score') or {}).values()) - 1.0) > 1e-9:
                      raise SystemExit('Player DNA calibrated exact-match-score probability mass drift')
              elif candidate is not None:
                  raise SystemExit('Player DNA calibrated candidate present without positive calibration gate')
          print(
              f"Player DNA simulator: simulated={simulation.get('simulated_matches')} "
              f"validation={simulation.get('match_level_validation_required')} "
              f"mode={simulation.get('mode')}"
          )

          p = Path('frontend/data/player_dna_prospective_validation.json')
          if not p.exists():
              raise SystemExit('player_dna_prospective_validation.json was not generated')
          prospective = json.loads(p.read_text(encoding='utf-8'))
          if prospective.get('mode') != 'SHADOW_PROSPECTIVE_VALIDATION_ONLY':
              raise SystemExit('Player DNA prospective validation must remain SHADOW-only')
          if prospective.get('status') != 'PROSPECTIVE_COLLECTION_ACTIVE':
              raise SystemExit(f"Player DNA prospective status invalid: {prospective.get('status')}")
          if prospective.get('signal') not in {
              'COLLECTING_PROSPECTIVE_EVIDENCE',
              'PROSPECTIVE_DURATION_ROBUST_SHADOW',
              'PROSPECTIVE_DURATION_NOT_YET_PROVEN',
          }:
              raise SystemExit(f"Player DNA prospective signal invalid: {prospective.get('signal')}")
          for key in ('production_influence', 'symphony2_influence', 'superbet_playable_influence'):
              if prospective.get(key) is not False:
                  raise SystemExit(f'Player DNA prospective validation crossed isolation boundary: {key}')
          if prospective.get('current_simulator_modified') is not False:
              raise SystemExit('Player DNA prospective validation cannot mutate simulator')
          if prospective.get('auto_integrate') is not False:
              raise SystemExit('Player DNA prospective validation cannot auto-integrate')
          dynamic_evidence = prospective.get('dynamic_lean_evidence') or {}
          if dynamic_evidence.get('mode') != 'SHADOW_DYNAMIC_LEAN_PROSPECTIVE_LEDGER_ONLY':
              raise SystemExit('Player DNA dynamic prospective ledger mode invalid')
          if dynamic_evidence.get('status') != 'DYNAMIC_PROSPECTIVE_COLLECTION_ACTIVE':
              raise SystemExit('Player DNA dynamic prospective ledger status invalid')
          if dynamic_evidence.get('signal') not in {
              'COLLECTING_DYNAMIC_LEAN_PROSPECTIVE_EVIDENCE',
              'DYNAMIC_LEAN_PROSPECTIVE_EVIDENCE_READY_SHADOW',
          }:
              raise SystemExit(f"Player DNA dynamic prospective signal invalid: {dynamic_evidence.get('signal')}")
          for key in ('production_influence', 'runtime_switch_enabled', 'symphony2_influence', 'superbet_playable_influence', 'auto_integrate'):
              if dynamic_evidence.get(key) is not False:
                  raise SystemExit(f'Player DNA dynamic prospective isolation violation: {key}={dynamic_evidence.get(key)}')
          if dynamic_evidence.get('performance_verdict_emitted') is not False:
              raise SystemExit('Player DNA dynamic prospective ledger cannot emit performance verdict yet')
          dynamic_integrity = dynamic_evidence.get('ledger_integrity') or {}
          if dynamic_integrity.get('status') != 'LEDGER_INTEGRITY_OK':
              raise SystemExit(f"Player DNA dynamic prospective ledger integrity failed: {dynamic_integrity.get('status')}")
          for key in (
              'rewritten_predictions',
              'settlement_regressions',
              'settled_actual_rewrites',
              'settled_at_rewrites',
              'missing_previous_snapshots',
              'duplicate_previous_match_ids',
              'duplicate_current_match_ids',
          ):
              if int(dynamic_integrity.get(key) or 0) != 0:
                  raise SystemExit(f'Player DNA dynamic prospective ledger corruption: {key}={dynamic_integrity.get(key)}')
          dynamic_readiness = dynamic_evidence.get('evidence_readiness') or {}
          if dynamic_readiness.get('performance_verdict_emitted') is not False:
              raise SystemExit('Player DNA dynamic prospective readiness cannot self-promote')
          dynamic_policy = dynamic_readiness.get('policy') or {}
          if int(dynamic_policy.get('overall_minimum_settled_market_observations') or 0) != 150:
              raise SystemExit('Player DNA dynamic prospective total support threshold drift')
          if int(dynamic_policy.get('per_observed_candidate_market_minimum') or 0) != 30:
              raise SystemExit('Player DNA dynamic prospective per-market support threshold drift')
          if dynamic_policy.get('conflict_and_insufficient_markets_never_enter_ledger') is not True:
              raise SystemExit('Player DNA dynamic prospective conflict exclusion drift')
          if dynamic_policy.get('profile_reference_markets_never_enter_dynamic_candidate_ledger') is not True:
              raise SystemExit('Player DNA dynamic prospective profile-reference exclusion drift')
          if dynamic_evidence.get('signal') == 'DYNAMIC_LEAN_PROSPECTIVE_EVIDENCE_READY_SHADOW':
              if dynamic_readiness.get('ready_for_performance_verdict') is not True:
                  raise SystemExit('Player DNA dynamic prospective evidence-ready signal below support threshold')
          if prospective.get('market_scope') != 'DURATION_MARKETS_ONLY':
              raise SystemExit('Player DNA prospective validation scope must remain duration-only')
          if prospective.get('winner_markets_promoted') is not False:
              raise SystemExit('Player DNA prospective validation cannot promote winner markets')
          integrity = prospective.get('ledger_integrity') or {}
          if integrity.get('status') != 'LEDGER_INTEGRITY_OK':
              raise SystemExit(f"Player DNA prospective ledger integrity failed: {integrity.get('status')}")
          for key in (
              'prediction_rewrite_forbidden',
              'settlement_regression_forbidden',
              'settled_actual_rewrite_forbidden',
              'settled_at_rewrite_forbidden',
              'snapshot_drop_forbidden_before_retention_cap',
          ):
              if integrity.get(key) is not True:
                  raise SystemExit(f'Player DNA prospective integrity policy drift: {key}')
          for key in (
              'rewritten_predictions',
              'settlement_regressions',
              'settled_actual_rewrites',
              'settled_at_rewrites',
              'missing_previous_snapshots',
              'duplicate_previous_match_ids',
              'duplicate_current_match_ids',
          ):
              if int(integrity.get(key) or 0) != 0:
                  raise SystemExit(f'Player DNA prospective ledger corruption detected: {key}={integrity.get(key)}')
          if int(integrity.get('current_snapshot_count_after_retention') or 0) != int((prospective.get('counts') or {}).get('snapshots') or 0):
              raise SystemExit('Player DNA prospective ledger count drift after retention')
          if int(integrity.get('pruned_by_retention') or 0) == 0:
              if int(integrity.get('preserved_snapshots') or 0) != int(integrity.get('previous_snapshot_count') or 0):
                  raise SystemExit('Player DNA prospective ledger dropped a prior snapshot before retention cap')
          observability = prospective.get('settlement_observability') or {}
          unsettled_obs = observability.get('unsettled') or {}
          buckets = unsettled_obs.get('buckets') or {}
          if sum(int(v or 0) for v in buckets.values()) != int((prospective.get('counts') or {}).get('unsettled_snapshots') or 0):
              raise SystemExit('Player DNA prospective unsettled age buckets do not match unsettled count')
          if 'does not imply cancellation' not in str(unsettled_obs.get('meaning') or ''):
              raise SystemExit('Player DNA prospective overdue diagnostics must not infer cancellation')
          latency = observability.get('settlement_latency') or {}
          if int(latency.get('n') or 0) > int((prospective.get('counts') or {}).get('settled_snapshots') or 0):
              raise SystemExit('Player DNA prospective settlement latency sample exceeds settled count')
          if 'first workflow observation' not in str(latency.get('meaning') or ''):
              raise SystemExit('Player DNA prospective settlement latency semantics drift')
          drift = observability.get('schedule_drift') or {}
          if int(drift.get('count') or 0) < 0:
              raise SystemExit('Player DNA prospective schedule drift count invalid')
          if 'snapshot is never rewritten' not in str(drift.get('meaning') or ''):
              raise SystemExit('Player DNA prospective schedule drift must preserve frozen snapshot')
          readiness = prospective.get('evidence_readiness') or {}
          overall_ready = readiness.get('overall') or {}
          if int(overall_ready.get('required') or 0) != 150:
              raise SystemExit('Player DNA prospective overall support threshold drift')
          readiness_policy = readiness.get('policy') or {}
          if int(readiness_policy.get('per_supported_segment_minimum_settled') or 0) != 30:
              raise SystemExit('Player DNA prospective segment support threshold drift')
          if readiness_policy.get('all_supported_tours_and_surfaces_must_meet_minimum') is not True:
              raise SystemExit('Player DNA prospective must require all supported segment minima')
          if readiness_policy.get('performance_verdict_before_support_ready_forbidden') is not True:
              raise SystemExit('Player DNA prospective cannot issue verdict before support readiness')
          if prospective.get('signal') in {'PROSPECTIVE_DURATION_ROBUST_SHADOW', 'PROSPECTIVE_DURATION_NOT_YET_PROVEN'}:
              if readiness.get('ready_for_performance_verdict') is not True:
                  raise SystemExit('Player DNA prospective verdict emitted without evidence readiness')
              if overall_ready.get('support_sufficient') is not True or readiness.get('segment_support_ready') is not True:
                  raise SystemExit('Player DNA prospective verdict emitted below overall/segment support')
          if readiness.get('ready_for_performance_verdict') is not True:
              if prospective.get('signal') != 'COLLECTING_PROSPECTIVE_EVIDENCE':
                  raise SystemExit('Player DNA prospective must stay collecting until all support thresholds are met')
          policy_prospective = prospective.get('eligibility_policy') or {}
          if policy_prospective.get('requires_walk_forward_robust') is not True:
              raise SystemExit('Player DNA prospective gate must require robust walk-forward')
          if policy_prospective.get('requires_repeatable_tour') is not True:
              raise SystemExit('Player DNA prospective gate must require repeatable tour')
          if policy_prospective.get('requires_repeatable_surface') is not True:
              raise SystemExit('Player DNA prospective gate must require repeatable surface')
          if policy_prospective.get('post_result_snapshot_forbidden') is not True:
              raise SystemExit('Player DNA prospective gate must forbid post-result snapshots')
          if walk_forward.get('signal') == 'HOLD_CALIBRATION_WALK_FORWARD_ROBUST_SHADOW':
              repeatable_tours = sorted(
                  name for name, row in ((walk_forward.get('segment_aggregate') or {}).get('tour') or {}).items()
                  if isinstance(row, dict) and row.get('repeatable_duration_signal') is True
              )
              repeatable_surfaces = sorted(
                  name for name, row in ((walk_forward.get('segment_aggregate') or {}).get('surface') or {}).items()
                  if isinstance(row, dict) and row.get('repeatable_duration_signal') is True
              )
              if policy_prospective.get('supported_tours') != repeatable_tours:
                  raise SystemExit('Player DNA prospective tour eligibility drift')
              if policy_prospective.get('supported_surfaces') != repeatable_surfaces:
                  raise SystemExit('Player DNA prospective surface eligibility drift')
          expected_markets = {
              'first_set_tiebreak', 'first_set_over_8.5',
              'first_set_over_9.5', 'first_set_over_10.5',
          }
          for snap in prospective.get('snapshots') or []:
              if snap.get('captured_pre_match') is not True:
                  raise SystemExit('Player DNA prospective snapshot was not frozen pre-match')
              if set((snap.get('raw_probabilities') or {}).keys()) != expected_markets:
                  raise SystemExit('Player DNA prospective raw market snapshot drift')
              if set((snap.get('calibrated_probabilities') or {}).keys()) != expected_markets:
                  raise SystemExit('Player DNA prospective calibrated market snapshot drift')
              if snap.get('settled') is True and set((snap.get('actual') or {}).keys()) != expected_markets:
                  raise SystemExit('Player DNA prospective settled labels incomplete')
          print(
              f"Player DNA prospective: signal={prospective.get('signal')} "
              f"snapshots={(prospective.get('counts') or {}).get('snapshots')} "
              f"settled={(prospective.get('counts') or {}).get('settled_snapshots')} "
              f"eligible_current={(prospective.get('counts') or {}).get('current_eligible_by_segment')} "
              f"new={integrity.get('new_snapshots')} newly_settled={integrity.get('newly_settled')} "
              f"rewrites={integrity.get('rewritten_predictions')} "
              f"overdue72={(unsettled_obs.get('buckets') or {}).get('overdue_gt_72h')} drift={drift.get('count')} "
              f"ready={readiness.get('ready_for_performance_verdict')} segment_ready={readiness.get('segment_support_ready')}"
          )
          PY

