name: Point Tape Schema Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/point_tape_schema.py'
      - 'backend/point_tape_audit.py'
      - 'backend/point_transition_audit.py'
      - 'backend/atomic_point_transition.py'
      - 'backend/canonical_point_event.py'
      - 'backend/player_dna_point_dataset.py'
      - 'backend/player_dna_match_metadata_audit.py'
      - 'backend/player_dna_match_context.py'
      - 'backend/player_dna_context_time_audit.py'
      - 'backend/player_dna_ordering_authority_audit.py'
      - 'backend/player_dna_profile_readiness.py'
      - 'backend/player_dna_shadow_profiles.py'
      - 'backend/player_dna_point_scorer.py'
      - 'backend/player_dna_current_shadow.py'
      - 'backend/player_dna_tennis_simulator.py'
      - 'backend/player_dna_market_backtest.py'
      - 'backend/player_dna_hold_calibration.py'
      - 'backend/player_identity_audit.py'
      - 'backend/player_identity.py'
      - 'tests/test_point_tape_schema.py'
      - 'tests/test_point_transition_audit.py'
      - 'tests/test_atomic_point_transition.py'
      - 'tests/test_canonical_point_event.py'
      - 'tests/test_player_dna_point_dataset.py'
      - 'tests/test_player_dna_match_metadata_audit.py'
      - 'tests/test_player_dna_match_context.py'
      - 'tests/test_player_dna_context_time_audit.py'
      - 'tests/test_player_dna_ordering_authority_audit.py'
      - 'tests/test_player_dna_profile_readiness.py'
      - 'tests/test_player_dna_shadow_profiles.py'
      - 'tests/test_player_dna_point_scorer.py'
      - 'tests/test_player_dna_current_shadow.py'
      - 'tests/test_player_dna_tennis_simulator.py'
      - 'tests/test_player_dna_market_backtest.py'
      - 'tests/test_player_dna_hold_calibration.py             tests/test_player_dna_hold_walk_forward.py'
      - 'tests/test_player_identity.py'
      - '.github/workflows/point-tape-audit.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Restore tennis history + PBP cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tennis-history-${{ runner.os }}-point-tape-audit-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Point tape + atomic validator + Player DNA identity/context tests
        run: python -m pytest -q tests/test_point_tape_schema.py tests/test_point_transition_audit.py tests/test_atomic_point_transition.py tests/test_canonical_point_event.py tests/test_player_dna_point_dataset.py tests/test_player_dna_match_metadata_audit.py tests/test_player_dna_match_context.py tests/test_player_dna_context_time_audit.py tests/test_player_dna_ordering_authority_audit.py tests/test_player_dna_profile_readiness.py tests/test_player_dna_shadow_profiles.py tests/test_player_dna_point_scorer.py tests/test_player_dna_current_shadow.py tests/test_player_dna_tennis_simulator.py tests/test_player_dna_market_backtest.py tests/test_player_dna_hold_calibration.py tests/test_player_identity.py

      - name: Audit cached PBP fields (zero network)
        run: python backend/point_tape_audit.py

      - name: Audit cached PBP transition semantics (zero network)
        run: python backend/point_transition_audit.py

      - name: Build shadow Player DNA point dataset (zero network)
        run: python backend/player_dna_point_dataset.py

      - name: Audit stable player identity candidates (zero network)
        run: python backend/player_identity_audit.py

      - name: Audit Player DNA match metadata paths (zero network)
        run: python backend/player_dna_match_metadata_audit.py

      - name: Audit Player DNA context distributions + time ordering (zero network)
        run: python backend/player_dna_context_time_audit.py

      - name: Audit Player DNA ordering authority (zero network)
        run: python backend/player_dna_ordering_authority_audit.py

      - name: Audit Player DNA historical profile readiness (zero network)
        run: python backend/player_dna_profile_readiness.py

      - name: Build leakage-safe Player DNA shadow profiles (zero network)
        run: python backend/player_dna_shadow_profiles.py

      - name: Train + evaluate Player DNA point scorer (SHADOW, zero network)
        run: python backend/player_dna_point_scorer.py

      - name: Score current card with Player DNA (SHADOW, zero network)
        run: python backend/player_dna_current_shadow.py

      - name: Backtest Player DNA simulated markets (SHADOW, zero network)
        run: python backend/player_dna_market_backtest.py

      - name: Audit Player DNA hold calibration (SHADOW, zero network)
        run: python backend/player_dna_hold_calibration.py

      - name: Audit Player DNA hold walk-forward robustness (SHADOW, zero network)
        run: python backend/player_dna_hold_walk_forward.py

      - name: Simulate raw + hold-calibrated Player DNA markets (SHADOW, zero network)
        run: python backend/player_dna_tennis_simulator.py

      - name: Require real cached tapes and strict trainable point rows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('point_tape_schema_audit.json', 'point_transition_audit.json'):
              p = Path('frontend/data') / name
              if not p.exists():
                  raise SystemExit(f'{name} was not generated')
              report = json.loads(p.read_text(encoding='utf-8'))
              matches = int(report.get('matches') or 0)
              rows = int(report.get('rows') or 0)
              print(f'{name}: matches={matches} rows={rows}')
              if matches <= 0 or rows <= 0:
                  raise SystemExit(f'No real cached PBP tapes were available for {name}')

          p = Path('frontend/data/player_dna_point_dataset_summary.json')
          if not p.exists():
              raise SystemExit('player_dna_point_dataset_summary.json was not generated')
          report = json.loads(p.read_text(encoding='utf-8'))
          matches = int(report.get('matches') or 0)
          events = int(report.get('events') or 0)
          trainable_basic = int(report.get('trainable_basic') or 0)
          trainable_point = int(report.get('trainable_point') or 0)
          print(f'Player DNA point dataset: matches={matches} events={events} trainable_basic={trainable_basic} trainable_point={trainable_point}')
          if matches <= 0 or events <= 0 or trainable_basic <= 0 or trainable_point <= 0:
              raise SystemExit('Player DNA point dataset is empty or has no strictly atomic trainable points')
          if trainable_point > trainable_basic:
              raise SystemExit('Strict point rows cannot exceed broadly observable rows')
          if report.get('shadow_only') is not True:
              raise SystemExit('Player DNA point dataset must remain SHADOW-only')
          context_matches = int(report.get('context_matches') or 0)
          context_ready = int(report.get('context_ready_player_point') or 0)
          if context_matches != matches:
              raise SystemExit(f'Player DNA provider-backed context coverage regressed: {context_matches}/{matches}')
          if context_ready <= 0:
              raise SystemExit('Player DNA context join produced no context-ready strict player points')
          if report.get('training_join_enabled') is not False:
              raise SystemExit('Player DNA training join must remain disabled')
          if report.get('profile_aggregation_enabled') is not False:
              raise SystemExit('Player DNA profile aggregation must remain disabled')
          print(f'Player DNA context join: matches={context_matches}/{matches} context_ready_player_point={context_ready}')

          p = Path('frontend/data/player_identity_audit.json')
          if not p.exists():
              raise SystemExit('player_identity_audit.json was not generated')
          identity = json.loads(p.read_text(encoding='utf-8'))
          if int(identity.get('matches') or 0) <= 0:
              raise SystemExit('Player identity audit saw no restored PBP matches')
          if identity.get('gate') != 'AUDIT_ONLY_NO_IDENTITY_JOIN':
              raise SystemExit('Identity audit must remain an audit; join activation is explicit in player_identity.py')
          print(f"Player identity audit: matches={identity['matches']} candidates={list(identity.get('identity_candidates') or {})}")

          p = Path('frontend/data/player_dna_match_metadata_audit.json')
          if not p.exists():
              raise SystemExit('player_dna_match_metadata_audit.json was not generated')
          metadata = json.loads(p.read_text(encoding='utf-8'))
          if int(metadata.get('matches') or 0) <= 0:
              raise SystemExit('Player DNA metadata audit saw no restored PBP matches')
          if metadata.get('gate') != 'AUDIT_ONLY_NO_FEATURE_JOIN':
              raise SystemExit('Metadata audit must not activate any training feature join')
          print(f"Player DNA metadata audit: matches={metadata['matches']} likely_context_paths={len(metadata.get('likely_context_paths') or [])}")

          p = Path('frontend/data/player_dna_context_time_audit.json')
          if not p.exists():
              raise SystemExit('player_dna_context_time_audit.json was not generated')
          context_time = json.loads(p.read_text(encoding='utf-8'))
          if int(context_time.get('matches') or 0) <= 0:
              raise SystemExit('Player DNA context/time audit saw no restored PBP matches')
          if int(context_time.get('valid_context_matches') or 0) <= 0:
              raise SystemExit('Player DNA context/time audit found no strict provider-backed contexts')
          ordering = context_time.get('time_ordering') or {}
          if int(ordering.get('events_total') or 0) <= 0 or int(ordering.get('parseable_event_times') or 0) <= 0:
              raise SystemExit('Player DNA context/time audit found no parseable point chronology')
          if context_time.get('gate') != 'AUDIT_ONLY_NO_PROFILE_AGGREGATION':
              raise SystemExit('Context/time audit must remain audit-only')
          if context_time.get('training_join_enabled') is not False:
              raise SystemExit('Player DNA training join must remain disabled')
          if context_time.get('profile_aggregation_enabled') is not False:
              raise SystemExit('Player DNA profile aggregation must remain disabled')
          print(
              f"Player DNA context/time audit: valid_context={context_time['valid_context_matches']}/{context_time['matches']} "
              f"events={ordering.get('events_total')} invalid_times={ordering.get('invalid_event_times')} "
              f"non_monotonic_matches={ordering.get('matches_with_non_monotonic_events')} "
              f"before_scheduled={ordering.get('events_before_scheduled')}"
          )

          p = Path('frontend/data/player_dna_ordering_authority_audit.json')
          if not p.exists():
              raise SystemExit('player_dna_ordering_authority_audit.json was not generated')
          authority = json.loads(p.read_text(encoding='utf-8'))
          if int(authority.get('matches') or 0) <= 0:
              raise SystemExit('Player DNA ordering audit saw no restored PBP matches')
          if authority.get('gate') != 'AUDIT_ONLY_NO_ORDERING_ACTIVATION':
              raise SystemExit('Ordering audit must remain audit-only')
          if authority.get('ordering_activation_enabled') is not False:
              raise SystemExit('Player DNA ordering activation must remain disabled')
          provider = authority.get('provider_sequence') or {}
          timestamp = authority.get('timestamp_sorted_sequence') or {}
          comparison = authority.get('per_match_comparison') or {}
          if int(provider.get('trainable_point') or 0) <= 0 or int(timestamp.get('events') or 0) <= 0:
              raise SystemExit('Ordering audit produced no comparable point sequences')
          print(
              f"Player DNA ordering audit: candidate={authority.get('ordering_authority_candidate')} "
              f"provider_atomic={provider.get('trainable_point')} timestamp_atomic={timestamp.get('trainable_point')} "
              f"provider_better_matches={comparison.get('provider_more_atomic_matches')} "
              f"timestamp_better_matches={comparison.get('timestamp_more_atomic_matches')}"
          )

          p = Path('frontend/data/player_dna_profile_readiness.json')
          if not p.exists():
              raise SystemExit('player_dna_profile_readiness.json was not generated')
          readiness = json.loads(p.read_text(encoding='utf-8'))
          if readiness.get('gate') != 'AUDIT_ONLY_NO_PROFILE_AGGREGATION':
              raise SystemExit('Profile readiness must remain audit-only')
          if readiness.get('training_join_enabled') is not False:
              raise SystemExit('Player DNA training join must remain disabled')
          if readiness.get('profile_aggregation_enabled') is not False:
              raise SystemExit('Player DNA profile aggregation must remain disabled')
          if readiness.get('readiness_threshold_activation_enabled') is not False:
              raise SystemExit('Player DNA readiness threshold must remain unactivated')
          source_matches = int(readiness.get('source_matches_seen') or 0)
          context_ready_matches = int(readiness.get('context_ready_matches') or 0)
          missing_strict = int(readiness.get('matches_without_context_ready_points') or 0)
          if source_matches != matches:
              raise SystemExit(
                  f"Player DNA readiness lost source matches before strict filtering: "
                  f"{source_matches}/{matches}"
              )
          if context_ready_matches <= 0 or context_ready_matches > source_matches:
              raise SystemExit(
                  f"Player DNA readiness invalid strict-history coverage: "
                  f"{context_ready_matches}/{source_matches}"
              )
          if missing_strict != source_matches - context_ready_matches:
              raise SystemExit('Player DNA readiness strict-history accounting is inconsistent')
          if int(readiness.get('player_match_targets') or 0) <= 0:
              raise SystemExit('Player DNA readiness audit produced no player-match targets')
          print(
              f"Player DNA profile readiness: source_matches={source_matches} strict_history_matches={context_ready_matches} "
              f"without_strict_points={missing_strict} players={readiness.get('players')} "
              f"targets={readiness.get('player_match_targets')} "
              f"any_surface={readiness.get('readiness_any_surface')} "
              f"same_surface={readiness.get('readiness_same_surface')} "
              f"same_time_groups={readiness.get('same_time_player_groups')}"
          )

          p = Path('frontend/data/player_dna_shadow_profile_summary.json')
          if not p.exists():
              raise SystemExit('player_dna_shadow_profile_summary.json was not generated')
          profiles = json.loads(p.read_text(encoding='utf-8'))
          if profiles.get('mode') != 'SHADOW_AS_OF_PROFILE':
              raise SystemExit('Player DNA profiles must remain SHADOW as-of snapshots')
          if profiles.get('production_influence') is not False:
              raise SystemExit('Player DNA shadow profiles must have zero production influence')
          if profiles.get('training_join_enabled') is not False:
              raise SystemExit('Player DNA shadow profile training join must remain disabled')
          if profiles.get('profile_threshold_activation_enabled') is not False:
              raise SystemExit('Player DNA profile threshold activation must remain disabled')
          if profiles.get('same_time_matches_count_as_prior') is not False:
              raise SystemExit('Same-time matches must never count as Player DNA prior history')
          if int(profiles.get('strict_matches') or 0) != context_ready_matches:
              raise SystemExit(
                  f"Player DNA profile strict-match mismatch: "
                  f"{profiles.get('strict_matches')}/{context_ready_matches}"
              )
          if int(profiles.get('player_match_snapshots') or 0) != int(readiness.get('player_match_targets') or 0):
              raise SystemExit(
                  f"Player DNA snapshot target mismatch: "
                  f"{profiles.get('player_match_snapshots')}/{readiness.get('player_match_targets')}"
              )
          for threshold in ('1', '3', '5', '10'):
              for key in ('readiness_any_surface', 'readiness_same_surface'):
                  expected = ((readiness.get(key) or {}).get(threshold) or {}).get('targets')
                  observed = ((profiles.get(key) or {}).get(threshold) or {}).get('targets')
                  if int(observed or 0) != int(expected or 0):
                      raise SystemExit(
                          f"Player DNA readiness drift {key} threshold={threshold}: "
                          f"profile={observed} audit={expected}"
                      )
          print(
              f"Player DNA shadow profiles: matches={profiles.get('strict_matches')} "
              f"snapshots={profiles.get('player_match_snapshots')} players={profiles.get('players')} "
              f"readiness_any={profiles.get('readiness_any_surface')} "
              f"readiness_surface={profiles.get('readiness_same_surface')}"
          )

          p = Path('frontend/data/player_dna_point_scorer.json')
          if not p.exists():
              raise SystemExit('player_dna_point_scorer.json was not generated')
          scorer = json.loads(p.read_text(encoding='utf-8'))
          if scorer.get('mode') != 'SHADOW_EVAL_ONLY':
              raise SystemExit('Player DNA scorer must remain SHADOW evaluation only')
          if scorer.get('production_influence') is not False:
              raise SystemExit('Player DNA scorer must have zero production influence')
          if scorer.get('runtime_scoring_enabled') is not False:
              raise SystemExit('Player DNA runtime scoring must remain disabled')
          if scorer.get('prod_model_write_enabled') is not False:
              raise SystemExit('Player DNA PROD model writes must remain disabled')
          if scorer.get('model_artifact_persisted') is not False:
              raise SystemExit('Player DNA scorer must not persist a runtime model yet')
          if scorer.get('evaluation_threshold_is_production_gate') is not False:
              raise SystemExit('Player DNA threshold 3 is SHADOW evaluation only')
          if scorer.get('real_shadow_training') is not True:
              raise SystemExit('Player DNA scorer did not perform real SHADOW training')
          split = scorer.get('split') or {}
          if split.get('same_timestamp_split') is not False:
              raise SystemExit('Player DNA train/holdout split leaked a same-timestamp group')
          if int(scorer.get('all_joined_points') or 0) != context_ready:
              raise SystemExit(
                  f"Player DNA scorer join coverage mismatch: "
                  f"{scorer.get('all_joined_points')}/{context_ready}"
              )
          if int(scorer.get('train_points_after_support_gate') or 0) <= 0:
              raise SystemExit('Player DNA scorer has no SHADOW training points')
          if int(scorer.get('holdout_points_after_support_gate') or 0) <= 0:
              raise SystemExit('Player DNA scorer has no untouched holdout points')
          models = scorer.get('models') or {}
          for model_name in ('profile_only_logistic', 'rank_only_logistic', 'profile_plus_rank_logistic'):
              model = models.get(model_name) or {}
              metrics = model.get('metrics') or {}
              meta = model.get('model') or {}
              if int(metrics.get('points') or 0) <= 0 or metrics.get('brier') is None or metrics.get('log_loss') is None:
                  raise SystemExit(f'Player DNA {model_name} has no valid holdout metrics')
              if meta.get('fitted') is not True or not meta.get('model_fingerprint_sha256'):
                  raise SystemExit(f'Player DNA {model_name} was not actually fitted')
              if meta.get('engine') != 'NUMPY_NEWTON_LOGISTIC_L2' or meta.get('converged') is not True:
                  raise SystemExit(
                      f"Player DNA {model_name} did not converge with canonical NumPy logistic engine: "
                      f"{meta.get('engine')} converged={meta.get('converged')}"
                  )
          signal = scorer.get('signal') or {}
          if signal.get('status') not in {'POSITIVE_HOLDOUT_SIGNAL', 'MIXED_OR_NO_INCREMENTAL_SIGNAL'}:
              raise SystemExit(f"Player DNA scorer signal status invalid: {signal.get('status')}")
          print(
              f"Player DNA scorer: train={scorer.get('train_points_after_support_gate')} "
              f"holdout={scorer.get('holdout_points_after_support_gate')} "
              f"status={signal.get('status')} "
              f"profile_vs_rank_brier={signal.get('profile_only_brier_gain_vs_rank')} "
              f"combined_vs_rank_brier={signal.get('combined_brier_gain_vs_rank')} "
              f"combined_vs_rank_match_equal={signal.get('combined_match_equal_brier_gain_vs_rank')}"
          )

          p = Path('frontend/data/player_dna_current_shadow.json')
          if not p.exists():
              raise SystemExit('player_dna_current_shadow.json was not generated')
          current = json.loads(p.read_text(encoding='utf-8'))
          if current.get('mode') != 'SHADOW_CURRENT_ONLY':
              raise SystemExit('Player DNA current scorer must remain SHADOW-only')
          for key in ('production_influence', 'symphony2_influence', 'superbet_playable_influence'):
              if current.get(key) is not False:
                  raise SystemExit(f'Player DNA current scorer leaked influence: {key}={current.get(key)}')
          if current.get('match_winner_probability_enabled') is not False:
              raise SystemExit('Player DNA current stage must not expose match-winner probability yet')
          if current.get('point_serve_probability_only') is not True:
              raise SystemExit('Player DNA current stage must expose serve-point probability only')
          current_matches = int(current.get('current_matches') or 0)
          stable_ids = int(current.get('stable_id_matches') or 0)
          valid_targets = int(current.get('valid_target_matches') or 0)
          if current_matches <= 0:
              raise SystemExit('Player DNA current scorer saw no current matches')
          if stable_ids != current_matches or valid_targets != current_matches:
              raise SystemExit(
                  f'Player DNA current stable-ID coverage regressed: '
                  f'stable={stable_ids} valid={valid_targets} total={current_matches}'
              )
          validation = current.get('historical_validation') or {}
          if validation.get('status') != 'POSITIVE_HOLDOUT_SIGNAL':
              raise SystemExit(
                  f"Player DNA current scorer historical validation is not positive: {validation.get('status')}"
              )
          if int(current.get('pre_cutoff_training_points') or 0) <= 0:
              raise SystemExit('Player DNA current scorer has no leakage-safe pre-cutoff training rows')
          scored = int(current.get('scored_matches') or 0)
          eligible = int(current.get('eligible_matches') or 0)
          if scored != eligible:
              raise SystemExit(f'Player DNA current scoring mismatch: scored={scored} eligible={eligible}')
          if scored <= 0:
              raise SystemExit('Player DNA current scorer produced no SHADOW-scored current matches')
          model_path = Path('data/derived/player_dna/current_point_model_shadow.json')
          if not model_path.exists():
              raise SystemExit('Player DNA current SHADOW model artifact was not generated')
          model = json.loads(model_path.read_text(encoding='utf-8'))
          if model.get('mode') != 'SHADOW_MODEL_ARTIFACT':
              raise SystemExit('Player DNA current model artifact mode invalid')
          if model.get('production_influence') is not False or model.get('prod_runtime_model') is not False:
              raise SystemExit('Player DNA current model artifact must not be a PROD model')
          if model.get('shadow_current_scoring_only') is not True:
              raise SystemExit('Player DNA current model artifact scope is not SHADOW-only')
          if (model.get('fit') or {}).get('converged') is not True:
              raise SystemExit('Player DNA current SHADOW model did not converge')
          if model.get('training_cutoff_exclusive') != current.get('training_cutoff_exclusive'):
              raise SystemExit('Player DNA current model/report cutoff mismatch')
          print(
              f"Player DNA current SHADOW: matches={current_matches} stable_ids={stable_ids} "
              f"eligible={eligible} scored={scored} collecting={current.get('collecting_history_matches')} "
              f"cutoff={current.get('training_cutoff_exclusive')} "
              f"fingerprint={current.get('model_fingerprint_sha256')}"
          )

          p = Path('frontend/data/player_dna_market_backtest.json')
          if not p.exists():
              raise SystemExit('player_dna_market_backtest.json was not generated')
          backtest = json.loads(p.read_text(encoding='utf-8'))
          if backtest.get('mode') != 'SHADOW_BACKTEST_ONLY':
              raise SystemExit('Player DNA market backtest must remain SHADOW-only')
          if backtest.get('status') != 'BACKTEST_COMPLETE_NO_PROMOTION':
              raise SystemExit(f"Player DNA market backtest incomplete: {backtest.get('status')}")
          if backtest.get('production_influence') is not False:
              raise SystemExit('Player DNA market backtest must have zero PROD influence')
          if backtest.get('symphony2_influence') is not False or backtest.get('superbet_playable_influence') is not False:
              raise SystemExit('Player DNA market backtest crossed isolation boundary')
          if backtest.get('auto_promote') is not False:
              raise SystemExit('Player DNA market backtest cannot auto-promote')
          if backtest.get('current_simulation_status_unchanged') != 'UNVALIDATED_MATCH_LEVEL':
              raise SystemExit('Player DNA historical evidence must not silently promote current simulation')
          if backtest.get('model_features') != 'PROFILE_ONLY_CURRENT_COMPATIBLE':
              raise SystemExit('Player DNA backtest must use current-compatible profile-only features')
          if backtest.get('model_converged') is not True:
              raise SystemExit('Player DNA backtest point model did not converge')
          if backtest.get('signal') not in {
              'POSITIVE_MATCH_LEVEL_HOLDOUT_SIGNAL',
              'MIXED_OR_NO_MATCH_LEVEL_SIGNAL',
          }:
              raise SystemExit(f"Player DNA market backtest signal invalid: {backtest.get('signal')}")
          bt_counts = backtest.get('counts') or {}
          if int(bt_counts.get('settled_simulated_holdout_matches') or 0) < 200:
              raise SystemExit('Player DNA market backtest has too few settled holdout matches')
          bt_summary = backtest.get('summary') or {}
          if int(bt_summary.get('binary_markets_evaluated_ge_100') or 0) < 6:
              raise SystemExit('Player DNA market backtest evaluated too few markets')
          for market in ('match_p1_win', 'first_set_p1_win', 'first_set_tiebreak'):
              metrics = (backtest.get('binary_markets') or {}).get(market) or {}
              if int(metrics.get('n') or 0) < 100 or metrics.get('brier') is None or metrics.get('ece_10_bin') is None:
                  raise SystemExit(f'Player DNA market backtest missing robust metrics for {market}')
          print(
              f"Player DNA market backtest: signal={backtest.get('signal')} "
              f"settled_holdout={bt_counts.get('settled_simulated_holdout_matches')} "
              f"positive_markets={bt_summary.get('binary_markets_with_positive_brier_gain')}/"
              f"{bt_summary.get('binary_markets_evaluated_ge_100')}"
          )

          p = Path('frontend/data/player_dna_hold_calibration_audit.json')
          if not p.exists():
              raise SystemExit('player_dna_hold_calibration_audit.json was not generated')
          calibration = json.loads(p.read_text(encoding='utf-8'))
          if calibration.get('mode') != 'SHADOW_CALIBRATION_AUDIT_ONLY':
              raise SystemExit('Player DNA hold calibration must remain audit-only')
          if calibration.get('status') != 'CALIBRATION_EXPERIMENT_COMPLETE_NO_INTEGRATION':
              raise SystemExit(f"Player DNA hold calibration incomplete: {calibration.get('status')}")
          if calibration.get('production_influence') is not False:
              raise SystemExit('Player DNA hold calibration crossed PROD boundary')
          if calibration.get('symphony2_influence') is not False or calibration.get('superbet_playable_influence') is not False:
              raise SystemExit('Player DNA hold calibration crossed downstream isolation')
          if calibration.get('current_simulator_modified') is not False or calibration.get('auto_integrate') is not False:
              raise SystemExit('Player DNA hold calibration cannot mutate/integrate current simulator')
          if calibration.get('signal') not in {
              'HOLD_CALIBRATION_PROMISING_SHADOW',
              'HOLD_CALIBRATION_NOT_YET_PROVEN',
          }:
              raise SystemExit(f"Player DNA hold calibration signal invalid: {calibration.get('signal')}")
          split_cal = calibration.get('split') or {}
          if split_cal.get('same_timestamp_groups_not_split') is not True:
              raise SystemExit('Player DNA hold calibration split leaked same-timestamp matches')
          counts_cal = calibration.get('counts') or {}
          if int(counts_cal.get('calibration_games') or 0) < 500 or int(counts_cal.get('test_games') or 0) < 500:
              raise SystemExit('Player DNA hold calibration game sample too small')
          if int(counts_cal.get('settled_test_matches') or 0) < 100:
              raise SystemExit('Player DNA hold calibration settled final-test sample too small')
          hold_cal = calibration.get('hold_calibrator') or {}
          if hold_cal.get('converged') is not True:
              raise SystemExit('Player DNA hold calibrator did not converge')
          game_test = calibration.get('game_hold_test') or {}
          if (game_test.get('iid_raw') or {}).get('brier') is None or (game_test.get('calibrated') or {}).get('brier') is None:
              raise SystemExit('Player DNA hold calibration game metrics missing')
          print(
              f"Player DNA hold calibration: signal={calibration.get('signal')} "
              f"games={counts_cal.get('test_games')} "
              f"game_brier_gain={game_test.get('brier_gain_calibrated_vs_raw')} "
              f"duration={(calibration.get('summary') or {}).get('duration_markets_improved')}/"
              f"{(calibration.get('summary') or {}).get('duration_markets_total')}"
          )

          p = Path('frontend/data/player_dna_hold_walk_forward.json')
          if not p.exists():
              raise SystemExit('player_dna_hold_walk_forward.json was not generated')
          walk_forward = json.loads(p.read_text(encoding='utf-8'))
          if walk_forward.get('mode') != 'SHADOW_WALK_FORWARD_AUDIT_ONLY':
              raise SystemExit('Player DNA walk-forward audit must remain SHADOW-only')
          if walk_forward.get('status') not in {
              'WALK_FORWARD_COMPLETE_NO_INTEGRATION',
              'WALK_FORWARD_INCOMPLETE_NO_INTEGRATION',
          }:
              raise SystemExit(f"Player DNA walk-forward status invalid: {walk_forward.get('status')}")
          if walk_forward.get('signal') not in {
              'HOLD_CALIBRATION_WALK_FORWARD_ROBUST_SHADOW',
              'HOLD_CALIBRATION_WALK_FORWARD_NOT_YET_ROBUST',
          }:
              raise SystemExit(f"Player DNA walk-forward signal invalid: {walk_forward.get('signal')}")
          for key in ('production_influence', 'symphony2_influence', 'superbet_playable_influence'):
              if walk_forward.get(key) is not False:
                  raise SystemExit(f'Player DNA walk-forward crossed isolation boundary: {key}')
          if walk_forward.get('current_simulator_modified') is not False:
              raise SystemExit('Player DNA walk-forward cannot mutate current simulator')
          if walk_forward.get('candidate_gate_modified') is not False:
              raise SystemExit('Player DNA walk-forward cannot silently change candidate gate')
          if walk_forward.get('auto_integrate') is not False:
              raise SystemExit('Player DNA walk-forward cannot auto-integrate')
          chronology = walk_forward.get('chronology_policy') or {}
          if chronology.get('test_windows_disjoint') is not True:
              raise SystemExit('Player DNA walk-forward test windows must be disjoint')
          if chronology.get('same_timestamp_groups_not_split') is not True:
              raise SystemExit('Player DNA walk-forward split leaked same-timestamp matches')
          if chronology.get('mature_history_windows') is not True:
              raise SystemExit('Player DNA walk-forward must use mature-history windows')
          if not isinstance(walk_forward.get('segment_aggregate'), dict):
              raise SystemExit('Player DNA walk-forward segment aggregate missing')
          aggregate = walk_forward.get('aggregate') or {}
          if int(aggregate.get('required_folds') or 0) != 3:
              raise SystemExit('Player DNA walk-forward must define exactly three folds')
          if int(aggregate.get('completed_folds') or 0) < 2:
              raise SystemExit('Player DNA walk-forward completed too few folds')
          print(
              f"Player DNA walk-forward: signal={walk_forward.get('signal')} "
              f"completed={aggregate.get('completed_folds')}/{aggregate.get('required_folds')} "
              f"promising={aggregate.get('promising_folds')} "
              f"game_improved={aggregate.get('game_hold_improved_folds')}"
          )

          p = Path('frontend/data/player_dna_current_simulation.json')
          if not p.exists():
              raise SystemExit('player_dna_current_simulation.json was not generated')
          simulation = json.loads(p.read_text(encoding='utf-8'))
          if simulation.get('mode') != 'SHADOW_SIMULATION_ONLY':
              raise SystemExit('Player DNA tennis simulator must remain SHADOW-only')
          if simulation.get('production_influence') is not False:
              raise SystemExit('Player DNA tennis simulator must have zero PROD influence')
          if simulation.get('symphony2_influence') is not False:
              raise SystemExit('Player DNA tennis simulator must have zero Symfonia 2.0 influence')
          if simulation.get('superbet_playable_influence') is not False:
              raise SystemExit('Player DNA tennis simulator must have zero PLAYABLE influence')
          if simulation.get('match_level_validation_required') is not True:
              raise SystemExit('Player DNA match-level outputs must remain explicitly unvalidated')
          if simulation.get('auto_promote') is not False:
              raise SystemExit('Player DNA simulator cannot auto-promote')
          if int(simulation.get('source_scored_matches') or 0) != scored:
              raise SystemExit('Player DNA simulator source/current scored count mismatch')
          if int(simulation.get('simulated_matches') or 0) != scored:
              raise SystemExit('Player DNA simulator did not simulate every SHADOW-scored match')
          expected_candidate = calibration.get('signal') == 'HOLD_CALIBRATION_PROMISING_SHADOW'
          if simulation.get('hold_calibration_candidate_enabled') is not expected_candidate:
              raise SystemExit('Player DNA calibrated candidate enablement disagrees with calibration gate')
          expected_candidate_count = scored if expected_candidate else 0
          if int(simulation.get('calibrated_candidate_matches') or 0) != expected_candidate_count:
              raise SystemExit('Player DNA calibrated candidate count mismatch')
          source_cal = simulation.get('hold_calibration_source') or {}
          if source_cal.get('signal') != calibration.get('signal'):
              raise SystemExit('Player DNA simulator calibration source signal mismatch')
          policy = simulation.get('market_policy') or {}
          if policy.get('raw_iid_remains_reference') is not True or policy.get('hold_calibrated_is_candidate_only') is not True:
              raise SystemExit('Player DNA calibrated simulator must remain additive/reference-only')
          if policy.get('winner_markets') != 'NO_AUTOMATIC_SWITCH':
              raise SystemExit('Player DNA winner markets cannot auto-switch to calibrated track')
          for row in simulation.get('matches') or []:
              if row.get('validation_status') != 'UNVALIDATED_MATCH_LEVEL':
                  raise SystemExit('Player DNA simulated match lost UNVALIDATED_MATCH_LEVEL status')
              sim = row.get('simulation') or {}
              first_set = sim.get('first_set') or {}
              match = sim.get('match') or {}
              if abs(float(first_set.get('p1_win') or 0) + float(first_set.get('p2_win') or 0) - 1.0) > 1e-9:
                  raise SystemExit('Player DNA first-set winner probability mass drift')
              if abs(sum(float(v) for v in (first_set.get('exact_score') or {}).values()) - 1.0) > 1e-9:
                  raise SystemExit('Player DNA first-set exact-score probability mass drift')
              if abs(sum(float(v) for v in (first_set.get('games_distribution') or {}).values()) - 1.0) > 1e-9:
                  raise SystemExit('Player DNA first-set games probability mass drift')
              if abs(float(match.get('p1_win') or 0) + float(match.get('p2_win') or 0) - 1.0) > 1e-9:
                  raise SystemExit('Player DNA match winner probability mass drift')
              if abs(sum(float(v) for v in (match.get('exact_score') or {}).values()) - 1.0) > 1e-9:
                  raise SystemExit('Player DNA exact-match-score probability mass drift')
              if abs(sum(float(v) for v in (match.get('total_sets') or {}).values()) - 1.0) > 1e-9:
                  raise SystemExit('Player DNA total-sets probability mass drift')
              candidate = row.get('hold_calibrated_candidate')
              if expected_candidate:
                  if not isinstance(candidate, dict):
                      raise SystemExit('Player DNA calibrated candidate missing despite positive calibration gate')
                  if candidate.get('mode') != 'SHADOW_HOLD_CALIBRATED_CANDIDATE':
                      raise SystemExit('Player DNA calibrated candidate mode invalid')
                  if candidate.get('validation_status') != 'BACKTESTED_HOLD_CALIBRATION_CANDIDATE':
                      raise SystemExit('Player DNA calibrated candidate validation status invalid')
                  for key in ('production_influence', 'symphony2_influence', 'superbet_playable_influence', 'auto_promote'):
                      if candidate.get(key) is not False:
                          raise SystemExit(f'Player DNA calibrated candidate leaked influence: {key}')
                  cfirst = candidate.get('first_set') or {}
                  cmatch = candidate.get('match') or {}
                  if abs(float(cfirst.get('p1_win') or 0) + float(cfirst.get('p2_win') or 0) - 1.0) > 1e-9:
                      raise SystemExit('Player DNA calibrated first-set winner probability mass drift')
                  if abs(sum(float(v) for v in (cfirst.get('exact_score') or {}).values()) - 1.0) > 1e-9:
                      raise SystemExit('Player DNA calibrated first-set exact-score probability mass drift')
                  if abs(sum(float(v) for v in (cmatch.get('exact_score') or {}).values()) - 1.0) > 1e-9:
                      raise SystemExit('Player DNA calibrated exact-match-score probability mass drift')
              elif candidate is not None:
                  raise SystemExit('Player DNA calibrated candidate present without positive calibration gate')
          print(
              f"Player DNA simulator: simulated={simulation.get('simulated_matches')} "
              f"validation={simulation.get('match_level_validation_required')} "
              f"mode={simulation.get('mode')}"
          )
          PY

      - name: Upload point audit + Player DNA dataset artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-dna-point-foundation
          path: |
            frontend/data/point_tape_schema_audit.json
            frontend/data/point_transition_audit.json
            frontend/data/player_dna_point_dataset_summary.json
            frontend/data/player_identity_audit.json
            frontend/data/player_dna_match_metadata_audit.json
            frontend/data/player_dna_context_time_audit.json
            frontend/data/player_dna_ordering_authority_audit.json
            frontend/data/player_dna_profile_readiness.json
            frontend/data/player_dna_shadow_profile_summary.json
            frontend/data/player_dna_point_scorer.json
            frontend/data/player_dna_current_shadow.json
            frontend/data/player_dna_current_simulation.json
            frontend/data/player_dna_market_backtest.json
            frontend/data/player_dna_hold_calibration_audit.json
            frontend/data/player_dna_hold_walk_forward.json
            data/derived/player_dna/point_events.jsonl.gz
            data/derived/player_dna/profile_snapshots.jsonl.gz
            data/derived/player_dna/current_point_model_shadow.json
          if-no-files-found: error
          retention-days: 14
