name: TML internal ID alias audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/tml_internal_id_alias_audit.py'
      - 'backend/history_coverage_audit.py'
      - 'backend/history_hygiene_v78a.py'
      - 'backend/model.py'
      - 'backend/model_core.py'
      - 'frontend/data/results.json'
      - 'tests/test_tml_internal_id_alias_audit.py'
      - '.github/workflows/tml-internal-id-alias-audit.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: backend:.

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: python -m pip install pytest pandas requests

      - name: Unit tests
        run: python -m pytest -q tests/test_tml_internal_id_alias_audit.py

      - name: Restore latest tennis cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: tml-id-alias-audit-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Require real restored TennisMyLife cache
        shell: bash
        env:
          MATCHED_CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$MATCHED_CACHE_KEY" || { echo 'No tennis-history Actions cache restored'; exit 21; }
          count=$(find data/cache -maxdepth 1 -type f -name '*.csv.gz' | wc -l)
          echo "restored root CSV cache files: ${count}"
          test "$count" -ge 11 || { echo 'Expected all declared TennisMyLife cache files'; exit 22; }
          test -s frontend/data/results.json || { echo 'Missing current results.json'; exit 23; }

      - name: Audit same-provider TML IDs
        env:
          LIVE_TENNIS_API_KEY: ''
        run: python backend/tml_internal_id_alias_audit.py

      - name: Validate fail-closed contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/tml_internal_id_alias_audit.json').read_text(encoding='utf-8'))
          policy = report['policy']
          source = report['source']
          summary = report['summary']
          decision = report['decision']
          assert policy['network_calls'] == 0
          assert policy['provider_requests'] == 0
          assert policy['production_cache_writes'] == 0
          assert policy['fuzzy_matching'] is False
          assert policy['manual_aliases'] is False
          assert policy['cross_provider_id_comparison'] is False
          assert policy['cross_tml_namespace_id_comparison'] is False
          assert policy['minimum_match_gate'] == 5
          assert policy['minimum_match_gate_changed'] is False
          assert policy['identity_resolver_changed'] is False
          assert policy['model_math_changed'] is False
          assert policy['runtime_change_authorized'] is False
          assert policy['discovered_aliases_authorized_for_runtime'] is False
          assert decision['runtime_change'] is False
          assert decision['authorize_aliases'] is False
          assert source['raw_rows'] > 0
          assert source['clean_rows'] > 0
          assert summary['visible_matches'] > 0
          assert summary['short_history_slots'] > 0
          print(json.dumps(source, indent=2, sort_keys=True))
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload TASK 013 report
        uses: actions/upload-artifact@v4
        with:
          name: tml-internal-id-alias-audit
          path: artifacts/tml_internal_id_alias_audit.json
          if-no-files-found: error
