name: History payload diagnostic
on:
  push:
    branches:
      - fix/history-payload-retention
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Measure real history compaction
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from compact_frontend_data import prune_history_payload

          p=Path('frontend/data/history.json')
          before=json.loads(p.read_text(encoding='utf-8'))
          before_mb=p.stat().st_size/(1024*1024)
          def counts(h):
              return {
                  'entries': len(h),
                  'base_signals': sum(len(e.get('signals') or []) for e in h if isinstance(e,dict)),
                  'autolearn': sum(len(e.get('autolearn_signals_v84') or []) for e in h if isinstance(e,dict)),
                  'player_intelligence': sum(len(e.get('player_intelligence_signals_v85') or []) for e in h if isinstance(e,dict)),
                  'playable': sum(len(e.get('playable_autolearn_signals_v912') or []) for e in h if isinstance(e,dict)),
                  'candidates': sum(len(e.get('superbet_candidate_signals_v925') or []) for e in h if isinstance(e,dict)),
              }
          cb=counts(before)
          report=prune_history_payload(p)
          after=json.loads(p.read_text(encoding='utf-8'))
          ca=counts(after)
          after_mb=p.stat().st_size/(1024*1024)
          print('BEFORE_MB',round(before_mb,3))
          print('AFTER_MB',round(after_mb,3))
          print('SAVED_MB',round(before_mb-after_mb,3))
          print('COUNTS_BEFORE',cb)
          print('COUNTS_AFTER',ca)
          print('REPORT',report)
          assert cb == ca
          assert after_mb < 45.0, (before_mb,after_mb,report)
          PY
