name: History payload diagnostic
on:
  push:
    branches:
      - fix/history-payload-retention
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Measure history payload
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p=Path('frontend/data/history.json')
          h=json.loads(p.read_text(encoding='utf-8'))
          totals=Counter(); present=Counter()
          for e in h:
              if not isinstance(e,dict): continue
              for k,v in e.items():
                  totals[k]+=len(json.dumps(v,ensure_ascii=False,separators=(',',':')).encode())
                  present[k]+=1
          print('ENTRIES',len(h),'FILE_MB',round(p.stat().st_size/(1024*1024),3))
          for k,n in totals.most_common(15):
              print('TOP',k,round(n/(1024*1024),3),present[k])
          for layer in ('autolearn_signals_v84','playable_autolearn_signals_v912','player_intelligence_signals_v85','learning_signals_v79b','superbet_candidate_signals_v925'):
              nested=Counter(); rows=0
              for e in h:
                  for s in (e.get(layer) or []) if isinstance(e,dict) else []:
                      if not isinstance(s,dict): continue
                      rows+=1
                      for k,v in s.items():
                          nested[k]+=len(json.dumps(v,ensure_ascii=False,separators=(',',':')).encode())
              print('LAYER',layer,'ROWS',rows)
              for k,n in nested.most_common(20):
                  print('NESTED',layer,k,round(n/(1024*1024),3))
          PY
