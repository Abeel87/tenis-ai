name: History payload diagnostic
on:
  push:
    branches:
      - fix/history-payload-retention
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Measure history top-level fields
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p=Path('frontend/data/history.json')
          h=json.loads(p.read_text(encoding='utf-8'))
          totals=Counter(); present=Counter()
          for e in h:
              if not isinstance(e,dict): continue
              for k,v in e.items():
                  totals[k]+=len(json.dumps(v,ensure_ascii=False,separators=(',',':')).encode('utf-8'))
                  present[k]+=1
          print('ENTRIES',len(h))
          print('FILE_MB',round(p.stat().st_size/(1024*1024),3))
          for k,n in totals.most_common(40):
              print('FIELD',k,'MB',round(n/(1024*1024),3),'PRESENT',present[k],'AVG_KB',round(n/max(1,present[k])/1024,2))
          PY
