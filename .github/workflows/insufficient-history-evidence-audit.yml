name: Insufficient history evidence audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/insufficient_history_evidence.py'
      - 'backend/history_coverage_audit.py'
      - 'backend/history_hygiene_v78a.py'
      - 'backend/model.py'
      - 'backend/model_core.py'
      - 'backend/update.py'
      - 'tests/test_insufficient_history_evidence.py'
      - '.github/workflows/insufficient-history-evidence-audit.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: insufficient-history-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited ref
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -c requirements.lock

      - name: Full regression before cache audit
        run: python -m pytest -q

      - name: Restore latest tennis history cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: insufficient-history-evidence-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            tennis-history-${{ runner.os }}-

      - name: Require real restored history cache
        shell: bash
        env:
          MATCHED_CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [ -z "$MATCHED_CACHE_KEY" ]; then
            echo "::error::No tennis-history Actions cache was restored."
            exit 1
          fi
          if [ -z "$(find data/cache -maxdepth 1 -type f -name '*.csv.gz' -print -quit 2>/dev/null || true)" ]; then
            echo "::error::Restored cache has no historical CSV inputs."
            exit 1
          fi
          echo "Restored cache: $MATCHED_CACHE_KEY"

      - name: Build zero-network insufficient history evidence
        env:
          LIVE_TENNIS_API_KEY: ''
        run: |
          python backend/insufficient_history_evidence.py \
            --output artifacts/insufficient_history_evidence.json

      - name: Prove diagnostic policy stayed unchanged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/insufficient_history_evidence.json").read_text(encoding="utf-8"))
          policy = report["policy"]
          assert policy["network_calls"] == 0
          assert policy["fuzzy_matching"] is False
          assert policy["similarity_thresholds"] is False
          assert policy["manual_aliases"] is False
          assert policy["minimum_match_gate_changed"] is False
          assert policy["minimum_match_gate"] == 5
          assert policy["history_hygiene_changed"] is False
          assert policy["identity_resolver_changed"] is False
          assert policy["runtime_change_authorized"] is False
          assert policy["undeclared_cache_rows_authorized"] is False
          assert report["decision"]["runtime_change"] is False
          assert report["summary"]["visible_matches"] > 0
          assert report["summary"]["declared_cache_files"] > 0
          print(json.dumps(report["summary"], sort_keys=True))
          PY

      - name: Upload insufficient history evidence
        uses: actions/upload-artifact@v4
        with:
          name: insufficient-history-evidence-${{ github.run_id }}
          path: artifacts/insufficient_history_evidence.json
          if-no-files-found: error
          retention-days: 7
