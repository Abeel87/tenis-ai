name: One-shot workflow source-guard patch

on:
  push:
    branches: ['hardening/ineed-db-workflow-source-guards']
    paths:
      - '.github/workflows/_oneshot_hardening_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/ineed-db-workflow-source-guards
          fetch-depth: 0

      - name: Patch exact workflow_run guards and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          expr = "$" + "{{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}"

          superbet_path = Path('.github/workflows/superbet-market-refresh.yml')
          superbet = superbet_path.read_text(encoding='utf-8')
          old_superbet = "jobs:\n  refresh:\n    runs-on: ubuntu-latest\n"
          new_superbet = "jobs:\n  refresh:\n    if: " + expr + "\n    runs-on: ubuntu-latest\n"
          if superbet.count(old_superbet) != 1:
              raise SystemExit(f'Expected exactly one Superbet refresh job anchor, found {superbet.count(old_superbet)}')
          superbet_path.write_text(superbet.replace(old_superbet, new_superbet, 1), encoding='utf-8')

          dna_path = Path('.github/workflows/player-dna-shadow-refresh.yml')
          dna = dna_path.read_text(encoding='utf-8')
          old_dna = "    if: $" + "{{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}\n"
          new_dna = "    if: " + expr + "\n"
          if dna.count(old_dna) != 1:
              raise SystemExit(f'Expected exactly one Player DNA workflow_run guard, found {dna.count(old_dna)}')
          dna_path.write_text(dna.replace(old_dna, new_dna, 1), encoding='utf-8')

          test_path = Path('tests/test_ineed_hardening_contracts.py')
          test_text = test_path.read_text(encoding='utf-8')
          for fragment in (
              "github.event.workflow_run.conclusion == 'success'",
              "github.event.workflow_run.head_branch == 'main'",
          ):
              assert fragment in superbet_path.read_text(encoding='utf-8')
              assert fragment in dna_path.read_text(encoding='utf-8')
              assert fragment in test_text

          Path('.github/workflows/_oneshot_hardening_patch.yml').unlink()
          PY

          git diff --check
          git config user.name "tenis-ai-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ci: require successful main source for workflow_run producers"
          git push origin HEAD:hardening/ineed-db-workflow-source-guards
