name: Symphony coherence compatibility one-shot

on:
  workflow_dispatch:
  push:
    branches: [fix/full-app-health-v932]
    paths: ['.github/workflows/full-app-health-v932-compat-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/full-app-health-v932
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Preserve probability kind contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/symphony2_engine.py')
          s=p.read_text(encoding='utf-8')
          old='            row["probability_kind"] = "SUPERVISED_OPERATOR_LINE_P_HIT_COHERENT"\n'
          assert s.count(old)==1
          p.write_text(s.replace(old,'',1),encoding='utf-8')
          PY
      - name: Regression
        run: |
          python -m pytest -q tests/test_symphony2_probability_coherence_v932.py tests/test_symphony2_learning.py tests/test_symphony2_state.py tests/test_symphony2_tracker.py
          python -m py_compile backend/symphony2_engine.py
      - name: Commit source only
        run: |
          git config user.name "tenis-ai-health-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/symphony2_engine.py
          git commit -m "fix: preserve Symphony probability kind contract"
          git push origin HEAD:fix/full-app-health-v932
