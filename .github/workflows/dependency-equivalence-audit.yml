name: Dependency behavior equivalence audit

on:
  pull_request:
    paths:
      - '.github/workflows/dependency-equivalence-audit.yml'
      - 'scripts/dependency_equivalence_fingerprint.py'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'backend/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validated baseline
        run: python -m pip install -r requirements.txt -c requirements.lock
      - name: Full baseline tests
        run: python -m pytest -q
      - name: Baseline fingerprint
        run: python scripts/dependency_equivalence_fingerprint.py > baseline.fingerprint
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-fingerprint
          path: baseline.fingerprint
          if-no-files-found: error
          retention-days: 1

  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validated baseline
        run: python -m pip install -r requirements.txt -c requirements.lock
      - name: Overlay candidate pandas and NumPy
        run: |
          python -m pip install --upgrade --no-deps pandas==3.0.5 numpy==2.5.3
          python -m pip check
          python - <<'PY'
          import numpy, pandas
          assert numpy.__version__ == '2.5.3', numpy.__version__
          assert pandas.__version__ == '3.0.5', pandas.__version__
          PY
      - name: Full candidate tests
        run: python -m pytest -q
      - name: Candidate fingerprint
        run: python scripts/dependency_equivalence_fingerprint.py > candidate.fingerprint
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-fingerprint
          path: candidate.fingerprint
          if-no-files-found: error
          retention-days: 1

  compare:
    runs-on: ubuntu-latest
    needs: [baseline, candidate]
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: baseline-fingerprint
          path: baseline
      - uses: actions/download-artifact@v5
        with:
          name: candidate-fingerprint
          path: candidate
      - name: Require exact deterministic fingerprint equality
        shell: bash
        run: |
          BASELINE=$(tr -d '\r\n' < baseline/baseline.fingerprint)
          CANDIDATE=$(tr -d '\r\n' < candidate/candidate.fingerprint)
          test -n "$BASELINE"
          test -n "$CANDIDATE"
          echo "baseline=$BASELINE"
          echo "candidate=$CANDIDATE"
          test "$BASELINE" = "$CANDIDATE"
