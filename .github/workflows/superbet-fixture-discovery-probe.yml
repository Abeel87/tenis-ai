name: Superbet fixture discovery probe

on:
  pull_request:
    paths:
      - 'scripts/probe_superbet_fixture_discovery.py'
      - '.github/workflows/superbet-fixture-discovery-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile probe
        run: python -m py_compile scripts/probe_superbet_fixture_discovery.py
      - name: Probe fixture discovery filters
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: python scripts/probe_superbet_fixture_discovery.py
