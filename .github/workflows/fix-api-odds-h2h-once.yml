name: Fix API odds and H2H once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-api-odds-h2h-once.yml'

permissions:
  contents: write

concurrency:
  group: fix-api-odds-h2h-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Preserve OddsPapi Superbet price as presentation metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/superbet_market_context.py')
          text = path.read_text(encoding='utf-8')
          marker = 'selection["operator_price_source"]="oddspapi_current_superbet_offer"'
          if marker not in text:
              fn = text.find('def mapped_sanitize(row: dict,meta: dict):')
              end_fn = text.find('\ndef _direct_selection_without_price', fn)
              target = text.find('                selections.append(selection)', fn)
              if fn < 0 or target < 0 or end_fn < 0 or target > end_fn:
                  raise SystemExit('mapped_sanitize insertion point not found; refusing blind patch')
              old = '                selections.append(selection)'
              new = '''                # OddsPapi returns the exact current Superbet price on the active
                # outcome carrier. Keep it strictly as UI/presentation metadata;
                # MODEL/RAW, Symphony and PLAYABLE calculations remain unchanged.
                api_price=base._num(carrier.get("price"))
                if api_price is None:api_price=base._num(outcome_data.get("price"))
                if api_price is not None and api_price>=1.0:
                    selection["odds"]=round(float(api_price),4)
                    selection["operator_price_source"]="oddspapi_current_superbet_offer"
                    selection["operator_price_metadata_only"]=True
                    selection["prices_used"]=False
                selections.append(selection)'''
              text = text[:target] + new + text[target + len(old):]
              path.write_text(text, encoding='utf-8')

          test = Path('tests/test_superbet_current_offer_authority.py')
          tests = test.read_text(encoding='utf-8')
          marker_test = 'def test_context_preserves_oddspapi_price_as_presentation_metadata_only():'
          if marker_test not in tests:
              tests += '''\n\ndef test_context_preserves_oddspapi_price_as_presentation_metadata_only():\n    markets = _winner_markets()\n    markets["1"]["outcomes"]["1"]["players"]["a"]["price"] = 1.83\n    markets["1"]["outcomes"]["2"]["players"]["b"]["price"] = 2.05\n    row = {\n        "fixtureId": "f-price-ui",\n        "participant1Name": "A",\n        "participant2Name": "B",\n        "startTime": "2026-09-11T12:00:00Z",\n        "bookmakerOdds": {"superbet.pl": _book(markets)},\n    }\n    out = context.mapped_sanitize(row, _market_meta())\n    assert out is not None\n    by_pick = {selection["pick"]: selection for selection in out["canonical_selections"]}\n    assert by_pick["A"]["odds"] == 1.83\n    assert by_pick["B"]["odds"] == 2.05\n    assert by_pick["A"]["operator_price_source"] == "oddspapi_current_superbet_offer"\n    assert by_pick["A"]["operator_price_metadata_only"] is True\n    assert by_pick["A"]["prices_used"] is False\n    assert by_pick["A"]["operator_available"] is True\n'''
              test.write_text(tests, encoding='utf-8')
          PY

      - name: Focused regression checks
        run: |
          python -m pip install -q pytest
          python -m py_compile backend/superbet_market_context.py
          python -m pytest -q tests/test_superbet_current_offer_authority.py tests/test_superbet_market_v924.py
          node --check frontend/match-detail-data.js
          node - <<'NODE'
          global.window={TenisPresentation:{num:v=>Number(v),ratio:String,score:String,pct:String}};
          require('./frontend/match-detail-data.js');
          const D=window.TenisMatchDetail;
          const current={p1:'Alpha Player',p2:'Beta Player',p1_id:101,p2_id:202,scheduled_time:'2026-09-11T12:00:00Z'};
          const archived=[{p1:'Alpha Player',p2:'Beta Player',p1_id:'legacy-a',p2_id:'legacy-b',scheduled_time:'2025-01-01T12:00:00Z',result:{status:'completed',winner:'Alpha Player',score_text:'6-4 6-4'}}];
          if(D.historyRows(archived,current,'p1',true).length!==1) throw new Error('H2H cross-namespace fallback failed');
          console.log('H2H cross-namespace fallback OK');
          NODE

      - name: Commit repair to main
        run: |
          git config user.name "chatgpt-repair"
          git config user.email "actions@users.noreply.github.com"
          git add backend/superbet_market_context.py tests/test_superbet_current_offer_authority.py
          git diff --cached --quiet && { echo 'No backend repair changes required'; exit 0; }
          git commit -m "Fix OddsPapi Superbet price presentation metadata"
          git pull --rebase origin main
          git push origin HEAD:main
