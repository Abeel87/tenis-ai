name: Fix API odds and H2H once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-api-odds-h2h-once.yml'

permissions:
  contents: write

concurrency:
  group: fix-api-odds-h2h-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Patch API price metadata and H2H identity fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          context = Path('backend/superbet_market_context.py')
          text = context.read_text(encoding='utf-8')
          old = '''            selection = {
                          "market": canonical_market,
                          "pick": pick,
                          "line": line_value,
                          "player": player,
                          "set_no": set_no,
                          "operator_available": True,
                          "operator_line_verified": bool(lined),
                          "fixture_line_verified": bool(lined),
                          "operator_market_id": str(market_id),
                          "operator_outcome_id": str(outcome_id),
                          "market_parameter_special_value": parameter,
                          "provider_line_source": line_source,
                      }
                      selections.append(selection)
          '''
          # Be tolerant to the exact indentation while remaining structurally strict.
          if old not in text:
              old = '''            selection = {
                "market": canonical_market,
                "pick": pick,
                "line": line_value,
                "player": player,
                "set_no": set_no,
                "operator_available": True,
                "operator_line_verified": bool(lined),
                "fixture_line_verified": bool(lined),
                "operator_market_id": str(market_id),
                "operator_outcome_id": str(outcome_id),
                "market_parameter_special_value": parameter,
                "provider_line_source": line_source,
            }
            selections.append(selection)
          '''
          if old not in text:
              raise SystemExit('mapped_sanitize selection block not found; refusing blind patch')

          new = old.replace(
              '            selections.append(selection)\n',
              '''            # OddsPapi already returns the exact Superbet price on the active\n            # outcome carrier. Preserve it strictly as presentation metadata; it\n            # must never participate in MODEL/RAW, Symphony or PLAYABLE math.\n            api_price = base._num(carrier.get("price"))\n            if api_price is None:\n                api_price = base._num(outcome_data.get("price"))\n            if api_price is not None and api_price >= 1.0:\n                selection["odds"] = round(float(api_price), 4)\n                selection["operator_price_source"] = "oddspapi_current_superbet_offer"\n                selection["operator_price_metadata_only"] = True\n                selection["prices_used"] = False\n            selections.append(selection)\n'''
          )
          if new == old:
              raise SystemExit('price metadata insertion failed; refusing write')
          context.write_text(text.replace(old, new, 1), encoding='utf-8')

          detail = Path('frontend/match-detail-data.js')
          js = detail.read_text(encoding='utf-8')
          old_js = "function samePlayer(a,sideA,b,sideB){const ai=a?.[sideA+'_id'],bi=b?.[sideB+'_id'];if(ai!=null&&bi!=null)return String(ai)===String(bi);const an=normName(a?.[sideA]),bn=normName(b?.[sideB]);return !!an&&an===bn}"
          new_js = "function samePlayer(a,sideA,b,sideB){const ai=a?.[sideA+'_id'],bi=b?.[sideB+'_id'];if(ai!=null&&bi!=null&&String(ai)===String(bi))return true;const an=normName(a?.[sideA]),bn=normName(b?.[sideB]);return !!an&&an===bn}"
          if old_js not in js:
              if new_js not in js:
                  raise SystemExit('samePlayer contract not found; refusing blind patch')
          else:
              detail.write_text(js.replace(old_js, new_js, 1), encoding='utf-8')

          test = Path('tests/test_superbet_current_offer_authority.py')
          tests = test.read_text(encoding='utf-8')
          marker = 'def test_context_preserves_oddspapi_price_as_presentation_metadata_only():'
          if marker not in tests:
              tests += '''\n\ndef test_context_preserves_oddspapi_price_as_presentation_metadata_only():\n    markets = _winner_markets()\n    markets["1"]["outcomes"]["1"]["players"]["a"]["price"] = 1.83\n    markets["1"]["outcomes"]["2"]["players"]["b"]["price"] = 2.05\n    row = {\n        "fixtureId": "f-price-ui",\n        "participant1Name": "A",\n        "participant2Name": "B",\n        "startTime": "2026-09-11T12:00:00Z",\n        "bookmakerOdds": {"superbet.pl": _book(markets)},\n    }\n\n    out = context.mapped_sanitize(row, _market_meta())\n    assert out is not None\n    by_pick = {selection["pick"]: selection for selection in out["canonical_selections"]}\n    assert by_pick["A"]["odds"] == 1.83\n    assert by_pick["B"]["odds"] == 2.05\n    assert by_pick["A"]["operator_price_source"] == "oddspapi_current_superbet_offer"\n    assert by_pick["A"]["operator_price_metadata_only"] is True\n    assert by_pick["A"]["prices_used"] is False\n    assert by_pick["A"]["operator_available"] is True\n    assert by_pick["A"]["fixture_line_verified"] is False\n'''
              test.write_text(tests, encoding='utf-8')
          PY

      - name: Focused regression checks
        run: |
          python -m pip install -q pytest
          python -m py_compile backend/superbet_market_context.py
          python -m pytest -q tests/test_superbet_current_offer_authority.py tests/test_superbet_market_v924.py tests/test_match_detail_history.py
          node --check frontend/match-detail-data.js
          node - <<'NODE'
          global.window = {};
          require('./frontend/match-detail-data.js');
          const D = window.TENIS_AI_MATCH_DETAIL_DATA;
          const current = {p1:'Alpha Player',p2:'Beta Player',p1_id:101,p2_id:202};
          const archived = [{p1:'Alpha Player',p2:'Beta Player',p1_id:'old-provider-1',p2_id:'old-provider-2',scheduled_time:'2025-01-01',result:{winner:'Alpha Player',score_text:'6-4 6-4'}}];
          const out = D.h2h(archived,current);
          if (!out || out.matches.length !== 1 || out.p1Wins !== 1) throw new Error('H2H name fallback regression');
          console.log('H2H cross-namespace fallback OK');
          NODE

      - name: Commit repair to main
        run: |
          git config user.name "chatgpt-repair"
          git config user.email "actions@users.noreply.github.com"
          git add backend/superbet_market_context.py frontend/match-detail-data.js tests/test_superbet_current_offer_authority.py
          git diff --cached --quiet && { echo 'No repair changes required'; exit 0; }
          git commit -m "Fix OddsPapi price presentation and H2H matching"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
